const nfaDrafts = {};

App.register({
  id: "nfa", title: "Potenzmengen­konstruktion", chapter: "Kap. 3 · Rabin-Scott", desc: "NFA → DFA: Teilmengen-Tabelle selbst ausfüllen",
  intro: "Starte mit der Startmenge (bei NFAε mit ε-Hülle) und bestimme für jede Menge und jedes Zeichen die Folgemenge. Neue Mengen bekommen automatisch eine Zeile.",
  tasks: NFA_TASKS,
  renderTask(view, t) {
    taskHead(view, this, t, t.text);
    const n = t.nfa, cols = [...n.sigma, ...(n.states.some((q) => (n.delta[q] || {})["ε"]) ? ["ε"] : [])];
    view.append(h("div", { class: "card task" }, h("b", null, "Gegebener NFA"), diagramView(drawAutomaton(nfaSpec(n)).svg),
      deltaTable(n.states, cols, (q, c) => { const s = (n.delta[q] || {})[c]; return s && s.length ? setLabel(s) : "∅"; })));
    const st = nfaDrafts[t.id] || (nfaDrafts[t.id] = { rows: [{ set: null, trans: {}, final: false }] });
    const ref = powerset(n);
    const tableBox = h("div", { class: "scroll" });
    const out = h("div", { class: "stack" });
    let marks = null;
    const ensureRow = (s) => { if (!st.rows.some((r) => r.set && setKey(r.set) === setKey(s))) st.rows.push({ set: s, trans: {}, final: false }); };
    const draw = () => {
      const tbl = h("table", { class: "ed" }, h("tr", null, h("th", null, "Menge T"), n.sigma.map((c) => h("th", null, "δ̃(T, " + c + ")")), h("th", null, "End?"), h("th", null, "")));
      st.rows.forEach((r, i) => {

            if (v) { r.set = v; marks = null; draw(); }
          } }, r.set ? setLabel(r.set) : (i === 0 ? "Start?" : "?")));
        const cells = n.sigma.map((c) => h("td", { class: "cell " + ((m.trans || {})[c] || "") },
          h("button", { class: "btn ghost", type: "button", disabled: !r.set, onclick: async () => {
            const v = await pickSubset(n.states, r.trans[c], "δ̃(" + setLabel(r.set) + ", " + c + ")");
            if (v) { r.trans[c] = v; ensureRow(v); marks = null; draw(); }
          } }, r.trans[c] ? setLabel(r.trans[c]) : "?")));
        tbl.append(h("tr", null, setCell, cells,
          h("td", { class: m.final || "" }, h("input", { type: "checkbox", checked: r.final, "aria-label": "Endzustand", onchange: (e) => { r.final = e.target.checked; marks = null; draw(); } })),
          h("td", null, i ? h("button", { class: "btn ghost", type: "button", "aria-label": "Zeile löschen", onclick: () => { st.rows.splice(i, 1); marks = null; draw(); } }, "×") : "")));
      });
      tableBox.replaceChildren(tbl);
    };
    const check = () => {
      out.replaceChildren();
      const refRows = new Map(ref.rows.map((r) => [setKey(r.set), r]));
      marks = st.rows.map(() => ({ trans: {} }));
      let errors = 0;
      const notes = [];
      st.rows.forEach((r, i) => {
        if (!r.set) { marks[i].set = "bad"; errors++; return; }
        if (i === 0 && setKey(r.set) !== setKey(ref.start)) { marks[i].set = "bad"; errors++; notes.push("Die Startmenge stimmt nicht" + (n.states.some((q) => (n.delta[q] || {})["ε"]) ? " (ε-Hülle von z₀!)" : "") + "."); return; }

      const have = new Set(st.rows.filter((r) => r.set).map((r) => setKey(r.set)));
      const missing = ref.rows.filter((r) => !have.has(setKey(r.set)));

          delta: Object.fromEntries(ref.rows.map((r) => [setKey(r.set), Object.fromEntries(n.sigma.map((c) => [c, setKey(r.trans[c])]))])), sigma: n.sigma,
          labels: Object.fromEntries(ref.rows.map((r) => [setKey(r.set), setLabel(r.set)])) };
        out.append(diagramView(drawAutomaton(dfaSpec(dfa)).svg));
      } else {
        Progress.record(key, false);
        out.append(fb("bad", errors ? errors + " Feld(er) falsch (rot markiert)" : "Fast – es fehlen noch Zeilen",
          notes.map((x) => h("p", null, x)),
          missing.length ? h("p", null, "Noch ohne Zeile: " + missing.map((r) => setLabel(r.set)).join(", ")) : null,
          h("p", { class: "small" }, "Regel: δ̃(T, a) = Vereinigung aller δ(z, a) für z ∈ T" + (cols.includes("ε") ? ", danach ε-Hülle." : "."))));
      }
    };
    draw();
    view.append(h("div", { class: "card task" }, h("b", null, "Deine Teilmengen-Tabelle"), tableBox,
      h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => { st.rows.push({ set: null, trans: {}, final: false }); draw(); } }, "+ Zeile"))),
      h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: check }, "Prüfen"),
        h("button", { class: "btn ghost", type: "button", onclick: () => { st.rows = ref.rows.map((r) => ({ set: r.set, trans: Object.assign({}, r.trans), final: r.final })); marks = null; draw(); out.replaceChildren(fb("info", "Lösung eingetragen", "Geh die Zeilen in Ruhe durch: Jede Folgemenge ist die Vereinigung der NFA-Nachfolger.")); } }, "Lösung zeigen")), out);
  },
});

function evalExpr(s, N) {

function sortModule(id, title, chapter, desc) {
  const sets = SORT_SETS[id];
  App.register({
    id, title, chapter, desc, intro: "Tippe für jedes Element den passenden Kasten an. Nach jeder Antwort kommt die Begründung – auch für die Fallen.",
    tasks: sets.map((s) => ({ id: s.id, title: s.title, hint: s.items.length + " Elemente" })),
    renderTask(view, t) {
      const set = sets.find((s) => s.id === t.id);
      taskHead(view, this, t, null);
      const order = shuffle(set.items.map((_, i) => i));
      let k = 0, right = 0;
      const box = h("div", { class: "stack" });
      const next = () => {
        box.replaceChildren();
        if (k >= order.length) {
          const ok = right / order.length >= 0.8;
          Progress.record(id + ":" + t.id, ok);
          box.append(fb(ok ? "ok" : "info", `${right} von ${order.length} richtig`, h("p", null, ok ? "Sitzt!" : "Ab 80 % gilt das Set als geschafft – noch eine Runde?")),
            h("button", { class: "btn", type: "button", onclick: () => App.render() }, "Neue Runde"));
          return;
        }
        const [txt, b, why] = set.items[order[k]];
        const fbBox = h("div");
        const btns = set.buckets.map((name, i) => h("button", { class: "btn", type: "button", onclick: () => {
          btns.forEach((x) => (x.disabled = true));
          if (i === b) right++;
          btns[b].classList.add("primary");
          fbBox.replaceChildren(fb(i === b ? "ok" : "bad", i === b ? "Richtig" : "Nicht ganz – richtig ist: " + set.buckets[b], h("p", { html: why })),
            h("button", { class: "btn primary", type: "button", onclick: () => { k++; next(); } }, k + 1 < order.length ? "Weiter" : "Auswertung"));
          typeset(fbBox);
        } }, name));
        box.append(h("div", { class: "small muted" }, (k + 1) + " / " + order.length),
          h("div", { class: "card sortcard", html: txt }), h("div", { class: "buckets" }, btns), fbBox);
        typeset(box);
      };
      next();
      view.append(box);
    },
  });
}

const nice = (x) => (Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : Math.abs(x * 2 - Math.round(x * 2)) < 1e-9 ? String(x).replace(".", ",") : null);

const cmpKey = (x, y) => { for (let i = 0; i < 4; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1; return 0; };
const WHY = {
  same: "Beide liegen in derselben Klasse: der Quotient strebt gegen eine Konstante > 0.",
};
counterModule({
  id: "landau", title: "Landau-Vergleiche", chapter: "Kap. 8", desc: "f gegen g: O, Θ oder Ω?",
  intro: "Grenzwertkriterium: lim f/g = 0 ⇒ O, nicht Θ · lim = c ∈ (0, ∞) ⇒ Θ · lim = ∞ ⇒ Ω, nicht Θ. Reihenfolge: 1 ≺ log n ≺ nᵋ ≺ nᶜ ≺ cⁿ ≺ n! ≺ nⁿ.",
  make(box, done, again) {
    let f, g;
    do { f = pick(FN); g = Math.random() < 0.3 ? pick(FN.filter((x) => cmpKey(x[1], f[1]) === 0)) : pick(FN); } while (f === g);
    const c = cmpKey(f[1], g[1]);
    const labels = ["f ∈ O(g), aber f ∉ Θ(g)", "f ∈ Θ(g)", "f ∈ Ω(g), aber f ∉ Θ(g)"];
    const right = c < 0 ? 0 : c === 0 ? 1 : 2;

      fbBox.replaceChildren(fb(i === right ? "ok" : "bad", i === right ? "Richtig" : "Richtig ist: " + labels[right], h("p", null, why)),

    } }, l));
    box.append(h("div", { class: "card task" }, h("p", { html: `\\[f(n) = ${f[0]} \\qquad g(n) = ${g[0]}\\]` }), h("div", { class: "stack" }, btns), fbBox));
  },
});

function examinerPrompt(q, rounds) {
  const nf = q.nachfragen.map((x) => "- " + x.q_raw).join("\n");
  let p = `Du bist Prüfer in einer mündlichen Prüfung zur Vorlesung „Berechenbarkeit und Komplexität“ (Theoretische Informatik, FSU Jena). Prüfe fair, aber genau wie an einer deutschen Universität: Es zählt fachliche Korrektheit und Vollständigkeit der Kernaussagen, nicht Stil. Die Antworten wurden oft diktiert – ignoriere Tipp- und Erkennungsfehler und fehlende Formelzeichen, solange der Inhalt erkennbar ist. Benutze die Notation der Vorlesung (DFA M = (Z, Σ, δ, z₀, F), TM mit Ablehnungszustand ⊗, NPDA mit Akzeptanz durch leeren Keller).

Prüfungsfrage: ${q.frage_raw}

Musterlösung (Kernpunkte, nur für dich):
${q.antwort_raw}

Typische Nachfragen zu diesem Thema:
${nf || "- (keine)"}
`;
  rounds.forEach((r, i) => {
    p += i === 0 ? `\nAntwort des Studenten auf die Prüfungsfrage:\n"""${r.answer}"""\n` : `\nDeine Nachfrage war: ${rounds[i - 1].result.nachfrage}\nAntwort des Studenten darauf:\n"""${r.answer}"""\n`;
    if (r.result && i < rounds.length - 1) p += `\n(Deine Bewertung dazu: ${r.result.urteil})\n`;
  });
  p += `
Bewerte die LETZTE Antwort des Studenten. Antworte ausschließlich mit einem JSON-Objekt dieser Form:
{"punkte": <0 bis 100>, "urteil": "<ein Satz, auf Deutsch, direkt an den Studenten>", "getroffen": ["<richtig genannter Kernpunkt>", ...], "fehlt": ["<fehlender Kernpunkt>", ...], "fehler": ["<fachlicher Fehler mit kurzer Korrektur>", ...], "nachfrage": "<eine Nachfrage, wie ein Prüfer sie jetzt stellen würde, bezogen auf eine Lücke oder Unschärfe>"}
Halte jeden Listeneintrag kurz (höchstens ein Satz). Leere Listen sind erlaubt.`;
  return p;
}

const proofDrafts = {};

App.register({
  id: "beweis", title: "Beweis-Puzzles", chapter: "Kap. 3–9", desc: "Beweisschritte ordnen, Lücken füllen, Fallen erkennen",

  renderTask(view, t) {
    const P = PROOFS.find((p) => p.id === t.id);
    taskHead(view, this, t, null);
    const fresh = () => {
      const S = { placed: [], pool: shuffle([...P.steps.map((_, i) => "s" + i), ...P.traps.map((_, j) => "t" + j)]), gaps: {}, order: {} };
      P.steps.forEach((s, i) => (s.gaps || []).forEach((g, j) => { S.order["s" + i + ":" + j] = shuffle(g.o.map((_, k) => k)); }));
      return S;
    };
    const S = proofDrafts[P.id] || (proofDrafts[P.id] = fresh());
    const piece = (k) => (k[0] === "s" ? P.steps[+k.slice(1)] : P.traps[+k.slice(1)]);
    const textOf = (k) => {
      const p = piece(k), span = h("span", { class: "answer" });
      p.t.split(/\{(\d)\}/).forEach((x, i) => {
        if (i % 2 === 0) { if (x) span.append(h("span", { html: x })); return; }
        const g = p.gaps[+x], gk = k + ":" + x;
        const sel = h("select", { "aria-label": "Lücke", onchange: (e) => { S.gaps[gk] = e.target.value; } },
          h("option", { value: "" }, "…"), (S.order[gk] || g.o.map((_, j) => j)).map((j) => h("option", { value: String(j) }, g.o[j])));
        sel.value = S.gaps[gk] != null ? S.gaps[gk] : "";
        span.append(sel);
      });
      return span;
    };
    const proofBox = h("ol", { class: "proof" }), poolBox = h("div", { class: "pool" }), out = h("div", { class: "stack" }), sol = h("div");
    const emptyHint = h("p", { class: "small muted" }, "Noch leer – tippe unten den ersten Schritt an.");
    const draw = () => {
      emptyHint.hidden = S.placed.length > 0;
      proofBox.replaceChildren(...S.placed.map((k, i) => h("li", { class: "pstep" }, textOf(k),
        h("div", { class: "row" },
          h("button", { class: "btn ghost", type: "button", "aria-label": "Nach oben", disabled: i === 0, onclick: () => { [S.placed[i - 1], S.placed[i]] = [S.placed[i], S.placed[i - 1]]; draw(); } }, "↑"),
          h("button", { class: "btn ghost", type: "button", "aria-label": "Nach unten", disabled: i === S.placed.length - 1, onclick: () => { [S.placed[i + 1], S.placed[i]] = [S.placed[i], S.placed[i + 1]]; draw(); } }, "↓"),
          h("button", { class: "btn ghost", type: "button", "aria-label": "Zurücklegen", onclick: () => { S.placed.splice(i, 1); S.pool.push(k); draw(); } }, "×")))));
      const take = (k) => { S.pool = S.pool.filter((x) => x !== k); S.placed.push(k); draw(); };
      poolBox.replaceChildren(...S.pool.map((k) => h("div", { class: "piece", role: "button", tabindex: "0",
        onclick: (e) => { if (!e.target.closest("select")) take(k); },
        onkeydown: (e) => { if ((e.key === "Enter" || e.key === " ") && e.target === e.currentTarget) { e.preventDefault(); take(k); } } }, textOf(k))));
      if (!S.pool.length) poolBox.append(h("p", { class: "small muted" }, "Alle Bausteine liegen oben."));
    };
    const check = () => {
      out.replaceChildren();
      const key = "beweis:" + P.id;

      if (trap) {

        out.append(fb("bad", "Dieser Baustein gehört nicht in den Beweis", h("p", { class: "answer", html: "„" + piece(trap).t.replace(/\{\d\}/g, "…") + "“" }), h("p", { class: "answer", html: piece(trap).why })));
        return;
      }
      const grp = (i) => P.steps[i].g || "s" + i;
      const want = P.steps.map((_, i) => grp(i));
      const bad = S.placed.findIndex((k, i) => grp(+k.slice(1)) !== want[i]);
      if (bad >= 0) {
        Progress.record(key, false);
        const roles = P.steps.filter((_, i) => grp(i) === want[bad]).map((s) => s.role).join(" / ");
        out.append(fb("bad", "Ab Schritt " + (bad + 1) + " stimmt die Reihenfolge nicht", h("p", null, "An Stelle " + (bad + 1) + " gehört: ", h("b", null, roles), ".")));
        return;
      }
      if (S.placed.length < P.steps.length) {
        out.append(fb("info", "Bis hierhin richtig", h("p", null, "Es fehlen noch " + (P.steps.length - S.placed.length) + " Schritt(e). Achtung: Nicht jeder Baustein gehört hinein.")));
        return;
      }
      const wrong = [];
      S.placed.forEach((k, i) => (piece(k).gaps || []).forEach((g, j) => { const v = S.gaps[k + ":" + j]; if (v !== String(g.a)) wrong.push([i, g, !v]); }));

        return;

      out.append(fb("ok", "Beweis vollständig!", h("p", null, h("b", null, "So erzählst du ihn in der Prüfung: ")), h("p", { class: "answer", html: P.summary }),
        P.traps.length ? h("details", null, h("summary", null, "Warum die Fallen falsch sind"), h("ul", null, P.traps.map((x) => h("li", { class: "answer", html: x.t.replace(/\{\d\}/g, "…") + " – " + x.why })))) : null));
    };
    const showSol = () => {
      sol.replaceChildren(h("div", { class: "card task" }, h("b", null, "Musterbeweis"),
        h("ol", { class: "proof" }, P.steps.map((s) => h("li", { class: "pstep", html: s.t.replace(/\{(\d)\}/g, (_, j) => "<b>" + s.gaps[+j].o[s.gaps[+j].a] + "</b>") }))),
        h("p", { class: "answer", html: P.summary })));
    };
    draw();
    view.append(h("div", { class: "card task" }, h("div", { class: "eyebrow" }, "Satz"), h("p", { class: "answer", html: P.claim })),
      h("div", { class: "card task" }, h("b", null, "Dein Beweis"), proofBox, emptyHint),
      h("div", { class: "card task" }, h("b", null, "Bausteine"), poolBox),
      h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: check }, "Prüfen"),
        h("button", { class: "btn ghost", type: "button", onclick: () => { proofDrafts[P.id] = fresh(); App.render(); } }, "Neu mischen"),
        h("button", { class: "btn ghost", type: "button", onclick: showSol }, "Lösung zeigen")), out, sol);
  },
});

"use strict";
/* Reduktionen in Schritten: Richtung, Konstruktion, beide Richtungen der Äquivalenz, Berechenbarkeit, Schluss.
   Ein Schritt ist eine Auswahl mit Begründung (o, ok = richtig) oder ein kleines Beispiel (widget).
   Gelöste Schritte wachsen zur fertigen Argumentation (add); als gelöst zählt eine Aufgabe erst ohne Fehlgriff. */

const stepDrafts = {};

function renderSteps(view, key, R) {
  const fresh = () => ({ k: 0, miss: 0, wrong: {}, solved: {}, wdata: {}, order: R.steps.map((s) => (s.o ? shuffle(s.o.map((_, i) => i)) : null)) });
  const S = stepDrafts[key] || (stepDrafts[key] = fresh());
  const proof = h("ol", { class: "proof" }), cur = h("div", { class: "stack" });
  const proofCard = h("div", { class: "card task" }, h("b", null, "Deine Argumentation"), proof);
  const draw = () => {
    proof.replaceChildren(...R.steps.slice(0, S.k).map((s) => h("li", { class: "pstep", html: s.add })));
    proofCard.hidden = S.k === 0;
    cur.replaceChildren();
    if (S.k >= R.steps.length) { finish(); return; }
    const i = S.k, st = R.steps[i];
    const card = h("div", { class: "card task" }, h("div", { class: "eyebrow" }, "Schritt " + (i + 1) + " von " + R.steps.length + (st.role ? " · " + st.role : "")), h("p", { class: "answer", html: st.q }));
    const after = h("div", { class: "stack" });
    const next = h("button", { class: "btn primary", type: "button", onclick: () => { S.k++; draw(); cur.scrollIntoView({ block: "nearest" }); } }, i + 1 < R.steps.length ? "Weiter" : "Abschluss");
    if (st.o) {
      const wrong = S.wrong[i] || (S.wrong[i] = []), solved = S.solved[i];
      card.append(h("div", { class: "choices" }, S.order[i].map((j) => h("button", {
        class: "choice" + (wrong.includes(j) ? " no" : "") + (solved === j ? " yes" : ""), type: "button", disabled: wrong.includes(j) || solved != null, html: st.o[j].t,
        onclick: () => { if (st.o[j].ok) S.solved[i] = j; else { wrong.push(j); S.miss++; } draw(); } }))));
      if (solved != null) after.append(fb("ok", "Richtig", h("p", { class: "answer", html: st.o[solved].why })), next);
      else if (wrong.length) after.append(fb("bad", "Nicht ganz", h("p", { class: "answer", html: st.o[wrong[wrong.length - 1]].why })));
    } else {
      st.widget(card, { data: S.wdata[i] || (S.wdata[i] = {}), solved: !!S.solved[i], fail: () => { S.miss++; }, solve: () => { S.solved[i] = true; draw(); }, redraw: () => draw() });
      if (S.solved[i]) after.append(fb("ok", "Richtig", st.why ? h("p", { class: "answer", html: st.why }) : null), next);
    }
    card.append(after);
    cur.append(card);
    typeset(cur);
  };
  const finish = () => {
    if (!S.recorded) { Progress.record(key, S.miss === 0); S.recorded = true; }
    cur.append(fb(S.miss ? "info" : "ok", S.miss ? "Geschafft – mit " + S.miss + " Fehlgriff" + (S.miss > 1 ? "en" : "") : "Fehlerfrei geschafft!",
      h("p", null, h("b", null, "So erzählst du es in der Prüfung: ")), h("p", { class: "answer", html: R.summary }),
      S.miss ? h("p", { class: "small" }, "Als gelöst zählt die Aufgabe, sobald du sie einmal ohne Fehlgriff schaffst.") : null),
      h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => { stepDrafts[key] = fresh(); App.render(); } }, "Nochmal von vorn")));
    typeset(cur);
  };
  view.append(h("div", { class: "card task" }, h("div", { class: "eyebrow" }, "Aufgabe"), h("p", { class: "answer", html: R.goal })), proofCard, cur);
  draw();
}

/* kleine ungerichtete Graphen: Knoten 1..n im Kreis */
function drawGraph(n, edges, o = {}) {
  const R = 58, c = 76, P = (i) => [c + R * Math.sin((2 * Math.PI * (i - 1)) / n), c - R * Math.cos((2 * Math.PI * (i - 1)) / n)];
  const svg = svgEl("svg", { viewBox: "0 0 152 152", class: "graph", role: "img", "aria-label": o.label || "Graph" });
  const on = (a, b) => (o.hlEdges || []).some(([x, y]) => (x === a && y === b) || (x === b && y === a));
  for (const [a, b] of edges) {
    const [x1, y1] = P(a), [x2, y2] = P(b);
    svg.append(svgEl("line", { x1, y1, x2, y2, class: "ge" + (on(a, b) ? " on" : "") + ((o.bad || []).some(([x, y]) => (x === a && y === b) || (x === b && y === a)) ? " bad" : "") }));
  }
  for (let i = 1; i <= n; i++) {
    const [x, y] = P(i);
    const g = svgEl("g", { class: "gn" + ((o.hl || []).includes(i) ? " hl" : "") + ((o.sel || []).includes(i) ? " sel" : "") });
    g.append(svgEl("circle", { cx: x, cy: y, r: 13 }), svgEl("text", { x, y: y + 5, "text-anchor": "middle" }, String(i)));
    if (o.onTap) {
      g.setAttribute("role", "button"); g.setAttribute("tabindex", "0"); g.setAttribute("aria-label", "Knoten " + i);
      g.addEventListener("click", () => o.onTap(i));
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); o.onTap(i); } });
    }
    svg.append(g);
  }
  return svg;
}
const pairs = (n) => { const out = []; for (let a = 1; a <= n; a++) for (let b = a + 1; b <= n; b++) out.push([a, b]); return out; };
const hasEdge = (E, a, b) => E.some(([x, y]) => (x === a && y === b) || (x === b && y === a));

/* ------------------------------------------------------------------ NP-Vollständigkeit */
const lit = (l) => (l < 0 ? "¬" : "") + "x" + SUBS[Math.abs(l)];
const SAT_FORMULAS = [
  [[1, 2, -3], [-1, -2, 3], [1, -2, -3]],
  [[-1, 2, 3], [1, -2, 3], [1, 2, -3]],
  [[1, -2, 3], [-1, 2, -3], [2, 3, -1]],
];
function cliqueWidget(card, api) {
  const D = api.data;
  if (!D.phi) { D.phi = pick(SAT_FORMULAS); D.pick = [null, null, null]; }
  const phi = D.phi;
  const chosen = () => D.pick.map((j, k) => (j == null ? null : phi[k][j]));
  const clash = () => { const c = chosen(), out = []; for (let a = 0; a < 3; a++) for (let b = a + 1; b < 3; b++) if (c[a] != null && c[b] != null && c[a] === -c[b]) out.push([a, b]); return out; };
  const msg = h("p", { class: "small" });
  const box = h("div", { class: "stack" });
  const draw = () => {
    const cl = clash();
    const bad = new Set(cl.flat());
    box.replaceChildren(
      h("p", { class: "answer mono" }, phi.map((c) => "(" + c.map(lit).join(" ∨ ") + ")").join(" ∧ ")),
      h("div", { class: "satcols" }, phi.map((c, k) => h("div", { class: "satcol" }, h("span", { class: "small muted" }, "Klausel " + (k + 1)),
        c.map((l, j) => h("button", { class: "chip" + (D.pick[k] === j ? " on" : "") + (D.pick[k] === j && bad.has(k) ? " clash" : ""), type: "button", disabled: api.solved,
          onclick: () => { D.pick[k] = D.pick[k] === j ? null : j; msg.textContent = ""; draw(); } }, lit(l)))))),
      litGraph(phi, D.pick),
      cl.length ? h("p", { class: "small bad-t" }, cl.map(([a, b]) => lit(chosen()[a]) + " (Klausel " + (a + 1) + ") und " + lit(chosen()[b]) + " (Klausel " + (b + 1) + ") widersprechen sich – zwischen ihnen gibt es keine Kante.").join(" ")) : null,
      api.solved ? h("p", { class: "small" }, "Belegung: " + [1, 2, 3].map((v) => { const c = chosen(); return "x" + SUBS[v] + " = " + (c.includes(v) ? "1" : c.includes(-v) ? "0" : "beliebig"); }).join(", ") + " – damit ist in jeder Klausel ein Literal wahr.") : null,
      api.solved ? null : h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => {
        if (D.pick.includes(null)) { msg.textContent = "Wähle aus jeder Klausel genau ein Literal."; return; }
        if (clash().length) { api.fail(); msg.textContent = "Das ist keine Clique: Widersprüchliche Literale sind nicht verbunden."; return; }
        api.solve();
      } }, "Ist das eine Clique der Größe 3?"), msg));
  };
  draw();
  card.append(box);
}
/* Clique-Graph zu einer 3-KNF: Spalten = Klauseln, Kanten zwischen Spalten, außer bei x/¬x */
function litGraph(phi, pickIdx) {
  const X = (k) => 34 + k * 116, Y = (j) => 22 + j * 46;
  const svg = svgEl("svg", { viewBox: "0 0 300 136", class: "graph wide", role: "img", "aria-label": "Graph der Reduktion" });
  const sel = (k, j) => pickIdx[k] === j;
  for (let a = 0; a < 3; a++) for (let b = a + 1; b < 3; b++) for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
    if (phi[a][i] === -phi[b][j]) continue;
    svg.append(svgEl("line", { x1: X(a), y1: Y(i), x2: X(b), y2: Y(j), class: "ge thin" + (sel(a, i) && sel(b, j) ? " on" : "") }));
  }
  phi.forEach((c, k) => c.forEach((l, j) => {
    const g = svgEl("g", { class: "gn" + (sel(k, j) ? " sel" : "") });
    g.append(svgEl("rect", { x: X(k) - 20, y: Y(j) - 13, width: 40, height: 26, rx: 13 }), svgEl("text", { x: X(k), y: Y(j) + 5, "text-anchor": "middle" }, lit(l)));
    svg.append(g);
  }));
  return svg;
}

const VC_G = { n: 5, E: [[1, 2], [1, 3], [2, 3], [3, 4], [4, 5], [1, 5]], C: [1, 2, 3] };
function vcWidget(card, api) {
  const D = api.data;
  D.S = D.S || [];
  const comp = pairs(VC_G.n).filter(([a, b]) => !hasEdge(VC_G.E, a, b));
  const kk = VC_G.n - VC_G.C.length;
  const msg = h("p", { class: "small" }), box = h("div", { class: "stack" });
  const draw = () => {
    const open = comp.filter(([a, b]) => !D.S.includes(a) && !D.S.includes(b));
    box.replaceChildren(
      h("div", { class: "graphs" },
        h("figure", null, drawGraph(VC_G.n, VC_G.E, { hl: VC_G.C, hlEdges: VC_G.E.filter(([a, b]) => VC_G.C.includes(a) && VC_G.C.includes(b)), label: "Graph G mit Clique" }), h("figcaption", { class: "small muted" }, "G, Clique C = {" + VC_G.C.join(", ") + "}, k = " + VC_G.C.length)),
        h("figure", null, drawGraph(VC_G.n, comp, { sel: D.S, bad: api.solved ? [] : open, label: "Komplementgraph, Knoten antippen", onTap: api.solved ? null : (i) => { D.S = D.S.includes(i) ? D.S.filter((x) => x !== i) : [...D.S, i].sort(); msg.textContent = ""; draw(); } }),
          h("figcaption", { class: "small muted" }, "Ḡ – tippe Knoten an"))),
      h("p", { class: "small" }, "Gewählt: {" + D.S.join(", ") + "} · noch unbedeckte Kanten von Ḡ: " + (open.length ? open.map(([a, b]) => "{" + a + "," + b + "}").join(" ") : "keine")),
      api.solved ? null : h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => {
        if (open.length) { api.fail(); msg.textContent = "Noch nicht: Jede Kante von Ḡ braucht einen gewählten Endpunkt."; return; }
        if (D.S.length > kk) { api.fail(); msg.textContent = "Eine Überdeckung ist es, aber mit " + D.S.length + " Knoten zu groß – erlaubt sind k′ = n − k = " + kk + "."; return; }
        api.solve();
      } }, "Knotenüberdeckung mit höchstens " + kk + " Knoten?"), msg));
  };
  draw();
  card.append(box);
}

const TSP_G = { n: 5, E: [[1, 2], [2, 3], [3, 4], [4, 5], [5, 1], [1, 3]], tour: [1, 3, 2, 4, 5] };
function tspWidget(card, api) {
  const D = api.data;
  const T = TSP_G.tour, steps = T.map((v, i) => [v, T[(i + 1) % T.length]]);
  const len = steps.reduce((s, [a, b]) => s + (hasEdge(TSP_G.E, a, b) ? 1 : 2), 0);
  const inp = h("input", { type: "number", inputmode: "numeric", min: "0", style: "max-width:90px", "aria-label": "Länge der Rundreise", value: D.v || "" });
  const msg = h("p", { class: "small" });
  card.append(h("div", { class: "stack" },
    h("div", { class: "graphs" }, h("figure", null, drawGraph(TSP_G.n, TSP_G.E, { hlEdges: api.solved ? steps.filter(([a, b]) => hasEdge(TSP_G.E, a, b)) : [], bad: api.solved ? steps.filter(([a, b]) => !hasEdge(TSP_G.E, a, b)) : [], label: "Graph G" }), h("figcaption", { class: "small muted" }, "G mit n = " + TSP_G.n + " Knoten"))),
    h("p", null, "Rundreise " + [...T, T[0]].join(" → ") + ". Wie lang ist sie im TSP-Graphen (Kanten von G: 1, sonst 2)?"),
    api.solved ? h("p", { class: "small" }, "Länge " + len + " > B = " + TSP_G.n + ": Die Rundreise benutzt die Nicht-Kante {2,4}. Die Rundreise 1 → 2 → 3 → 4 → 5 → 1 hat dagegen Länge 5 = B – sie ist ein Hamiltonkreis in G.")
      : h("div", { class: "row" }, inp, h("button", { class: "btn", type: "button", onclick: () => {
        D.v = inp.value;
        if (+inp.value === len) api.solve();
        else { api.fail(); msg.textContent = "Nicht ganz – geh die " + T.length + " Schritte einzeln durch: Ist {a, b} eine Kante von G, kostet sie 1, sonst 2."; }
      } }, "Prüfen"), msg)));
}

const mnDrafts = {};
const byLen = (a, b) => a.length - b.length || (a < b ? -1 : a > b ? 1 : 0);

App.register({
  id: "mn", title: "Myhill-Nerode-Klassen", chapter: "Kap. 4", desc: "Äquivalenzklassen finden, Minimalautomat ablesen, Nicht-Regularität zeigen",
  intro: "Sortiere Wörter in die Äquivalenzklassen der Myhill-Nerode-Relation. Bei falschen Klassen zeigt dir der Trainer das Wort, das zwei Wörter trennt. Aus den Klassen entsteht dann der Minimalautomat – und bei nicht-regulären Sprachen zeigst du, dass es unendlich viele Klassen gibt.",
  tasks: MN_TASKS,
  renderTask(view, t) {
    taskHead(view, this, t, null);
    if (t.steps) { renderSteps(view, "mn:" + t.id, t); return; }
    const sigma = t.sigma, mini = dfaMinimize(Object.assign({ sigma }, t.dfa), sigma), D = mini.dfa;
    const end = (w) => dfaRun(D, w).end;
    const inL = (w) => dfaRun(D, w).ok;
    const klass = (w) => mini.classes.findIndex((c) => c.includes(end(w)));
    const sep = (v, w) => { const d = dfaDiff(D, D, sigma, end(v), end(w)); return d ? d.word : null; };
    const fresh = () => ({ pool: shuffle([...t.words]), cls: [], sel: null, step: 1, fin: [], miss: 0 });
    const S = mnDrafts[t.id] || (mnDrafts[t.id] = fresh());
    const rep = (c) => c.slice().sort(byLen)[0];
    const name = (c) => "[" + W(rep(c)) + "]";
    const out = h("div", { class: "stack" }), box = h("div", { class: "stack" });
    const chip = (w) => h("button", { class: "chip mono" + (S.sel === w ? " on" : ""), type: "button", disabled: S.step > 1, "aria-pressed": S.sel === w ? "true" : "false",
      onclick: (e) => { e.stopPropagation(); S.sel = S.sel === w ? null : w; draw(); } }, W(w));
    const moveTo = (k) => {
      if (S.sel == null) return;
      S.pool = S.pool.filter((x) => x !== S.sel);
      S.cls = S.cls.map((c) => c.filter((x) => x !== S.sel));
      if (k == null) S.cls.push([S.sel]); else S.cls[k].push(S.sel);
      S.cls = S.cls.filter((c) => c.length);
      S.sel = null;
      out.replaceChildren();
      draw();
    };
    const draw = () => {
      box.replaceChildren(
        h("div", { class: "card task" }, h("div", { class: "eyebrow" }, "Sprache"), h("p", { class: "answer" }, t.lang),
          h("p", { class: "small muted", html: "Σ = {" + sigma.join(", ") + "}. v und w sind äquivalent, (v, w) ∈ R<sub>L</sub>, wenn für jeden Anhang x gilt: vx ∈ L ⇔ wx ∈ L." })),
        h("div", { class: "card task" },
          h("b", null, "1. Wörter in Klassen sortieren"),
          S.step === 1 ? h("p", { class: "small muted" }, "Wort antippen, dann die Klasse antippen, in die es gehört – oder „+ neue Klasse“.") : null,
          h("div", { class: "row" }, S.pool.length ? S.pool.map(chip) : h("span", { class: "small muted" }, "Alle Wörter sind verteilt.")),
          h("div", { class: "mncls" }, S.cls.map((c, k) => h("div", { class: "mnc" + (S.sel != null && !c.includes(S.sel) ? " target" : ""), role: S.sel != null ? "button" : null, tabindex: S.sel != null ? "0" : null,
            onclick: () => moveTo(k), onkeydown: (e) => { if (e.key === "Enter" && e.target === e.currentTarget) moveTo(k); } },
            h("span", { class: "small muted" }, S.step > 1 ? name(c) : "Klasse " + (k + 1)), h("div", { class: "row" }, c.map(chip))))),
          S.step === 1 ? h("div", { class: "row" },
            h("button", { class: "btn", type: "button", disabled: S.sel == null, onclick: () => moveTo(null) }, "+ neue Klasse"),
            h("button", { class: "btn primary", type: "button", onclick: check1 }, "Prüfen"),
            h("button", { class: "btn ghost", type: "button", onclick: () => { mnDrafts[t.id] = fresh(); App.render(); } }, "Neu mischen")) : null),
        S.step >= 2 ? step2() : null,
        S.step >= 3 ? step3() : null);
    };
    const check1 = () => {
      out.replaceChildren();
      if (S.pool.length) { out.append(fb("info", "Noch nicht fertig", h("p", null, "Ordne erst alle Wörter einer Klasse zu."))); return; }
      const errs = [];
      for (const c of S.cls) for (const w of c.slice(1)) {
        if (klass(w) !== klass(c[0])) {
          const x = sep(c[0], w);
          errs.push("„" + W(c[0]) + "“ und „" + W(w) + "“ gehören nicht zusammen: x = „" + W(x) + "“ trennt sie – " + W(c[0] + x) + (inL(c[0] + x) ? " ∈ L" : " ∉ L") + ", aber " + W(w + x) + (inL(w + x) ? " ∈ L." : " ∉ L."));
          break;
        }
      }
      for (let i = 0; i < S.cls.length; i++) for (let j = i + 1; j < S.cls.length; j++) {
        if (klass(S.cls[i][0]) === klass(S.cls[j][0])) errs.push("Klasse " + (i + 1) + " und Klasse " + (j + 1) + " gehören zusammen: „" + W(S.cls[i][0]) + "“ und „" + W(S.cls[j][0]) + "“ trennt kein Anhang – für jedes x ist beides in L oder beides nicht.");
      }
      if (errs.length) {
        S.miss++;
        out.append(fb("bad", "Noch nicht richtig", h("ul", null, errs.slice(0, 2).map((e) => h("li", null, e))), errs.length > 2 ? h("p", { class: "small" }, "… und " + (errs.length - 2) + " weitere Stelle(n).") : null));
        return;
      }
      S.step = 2;
      draw();
    };
    const step2 = () => {
      const msg = h("div");
      const card = h("div", { class: "card task" }, h("b", null, "2. Endzustände"),
        h("p", { class: "small" }, "Index von L = " + S.cls.length + ". Im Minimalautomaten wird jede Klasse [w] ein Zustand z", h("sub", null, "[w]"), ". Welche Klassen werden Endzustände?"),
        h("div", { class: "row" }, S.cls.map((c, k) => h("button", { class: "chip mono" + (S.fin.includes(k) ? " on" : ""), type: "button", disabled: S.step > 2,
          onclick: () => { S.fin = S.fin.includes(k) ? S.fin.filter((x) => x !== k) : [...S.fin, k]; draw(); } }, name(c)))),
        S.step === 2 ? h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: () => {
          const want = S.cls.map((c, k) => (inL(c[0]) ? k : -1)).filter((k) => k >= 0);
          if (want.length === S.fin.length && want.every((k) => S.fin.includes(k))) { S.step = 3; draw(); return; }
          S.miss++;
          msg.replaceChildren(fb("bad", "Nicht ganz", h("p", null, "z", h("sub", null, "[w]"), " ist Endzustand genau dann, wenn w ∈ L – das hängt nicht vom gewählten Vertreter ab, weil x = ε zwei äquivalente Wörter nie trennt.")));
        } }, "Prüfen")) : null, msg);
      return card;
    };
    const step3 = () => {
      if (!S.recorded) { Progress.record("mn:" + t.id, S.miss === 0); S.recorded = true; }
      const of = (w) => S.cls.findIndex((c) => klass(c[0]) === klass(w));
      const ids = S.cls.map((_, k) => "k" + k);
      const dfa = { states: ids, sigma, start: ids[of("")], finals: S.cls.map((c, k) => (inL(c[0]) ? ids[k] : null)).filter(Boolean),
        delta: Object.fromEntries(S.cls.map((c, k) => [ids[k], Object.fromEntries(sigma.map((a) => [a, ids[of(rep(c) + a)]]))])),
        labels: Object.fromEntries(S.cls.map((c, k) => [ids[k], name(c)])) };
      return h("div", { class: "stack" },
        fb(S.miss ? "info" : "ok", S.miss ? "Geschafft – mit " + S.miss + " Fehlgriff" + (S.miss > 1 ? "en" : "") : "Fehlerfrei!",
          h("p", null, "Aus den Klassen entsteht der Minimalautomat: Start z", h("sub", null, "[ε]"), ", δ(z", h("sub", null, "[w]"), ", a) = z", h("sub", null, "[wa]"),
            ". Er hat " + S.cls.length + " Zustände – weniger geht nicht, weil Wörter aus verschiedenen Klassen in verschiedenen Zuständen landen müssen.")),
        h("div", { class: "card task" }, h("b", null, "3. Minimalautomat aus den Klassen"), diagramView(drawAutomaton(dfaSpec(dfa)).svg),
          deltaTable(ids, sigma, (q, a) => dfa.labels[dfa.delta[q][a]], { rowLabel: (q) => dfa.labels[q] })),
        h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => { mnDrafts[t.id] = fresh(); App.render(); } }, "Nochmal von vorn")));
    };
    view.append(box, out);
    draw();
  },
});

"use strict";
/* Übungsblatt 1 (WS 26/27): Relationen, Sprachpotenzen, Konkatenation, Quantoren, Ableitungen, Grammatik bauen.
   Erst die Zahlen vom Blatt, danach neue Beispiele. Oben je Aufgabe die Theorie (eingeklappt); geprüft wird exakt. */

const b1Drafts = {};
const theory = (html) => h("details", { class: "theory" }, h("summary", null, "Theorie dazu"), h("div", { class: "answer small", html }));
const byLL = (a, b) => a.length - b.length || (a < b ? -1 : a > b ? 1 : 0);
const SUPD = "⁰¹²³⁴⁵⁶⁷⁸⁹";
const fromSup = (s) => +[...s].map((d) => SUPD.indexOf(d)).join("");
/* „aa, a^3, a³, (ab)^2, ε“ → Wortmenge */
function parseWords(s) {
  const out = new Set();
  for (let tok of String(s).replace(/[{}]/g, " ").split(/[\s,;]+/)) {
    if (!tok) continue;
    if (/^(ε|eps|epsilon)$/i.test(tok)) { out.add(""); continue; }
    tok = tok.replace(/\(([a-z]+)\)\^(\d+)/g, (_, w, n) => w.repeat(+n)).replace(/\(([a-z]+)\)([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, (_, w, n) => w.repeat(fromSup(n)))
      .replace(/([a-z])\^(\d+)/g, (_, c, n) => c.repeat(+n)).replace(/([a-z])([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, (_, c, n) => c.repeat(fromSup(n)));
    out.add(tok);
  }
  return [...out];
}
const fmtSet = (ws) => (ws.length ? "{" + [...ws].sort(byLL).map(W).join(", ") + "}" : "∅");

function parseGrammar(text, sigma) {
  const P = [], errs = [];
  for (const raw of String(text).split(/\n|;/)) {
    const line = raw.trim();
    if (!line) continue;
    const m = line.match(/^([A-Z])\s*(?:->|→|::=|=)\s*(.*)$/);
    if (!m) { errs.push("„" + line + "“: erwartet wird „S → …“ mit genau einer Variable links."); continue; }
    for (let alt of m[2].split("|")) {
      alt = alt.replace(/\s+/g, "").replace(/ε|eps/g, "");
      const bad = [...new Set([...alt].filter((c) => !/[A-Z]/.test(c) && !sigma.includes(c)))];
      if (bad.length) errs.push("„" + (alt || "ε") + "“: " + bad.join(", ") + " ist weder in Σ noch eine Variable (Variablen: Großbuchstaben).");
      else P.push([m[1], alt]);
    }
  }
  if (!errs.length && !P.some(([A]) => A === "S")) errs.push("Es fehlt eine Regel für die Startvariable S.");
  return { P, errs };
}
function generate(P, max) {   // Linksableitungen bis Länge max; parent für die Ableitung
  const by = {};
  for (const [A, r] of P) (by[A] = by[A] || []).push(r);
  const words = new Set(), parent = new Map([["S", null]]), queue = ["S"];
  let steps = 0;
  while (queue.length && steps++ < 80000) {
    const f = queue.shift(), i = f.search(/[A-Z]/);
    if (i < 0) { words.add(f); continue; }
    for (const r of by[f[i]] || []) {
      const g = f.slice(0, i) + r + f.slice(i + 1), term = g.replace(/[A-Z]/g, "").length;
      if (term > max || g.length - term > max + 4 || parent.has(g)) continue;
      parent.set(g, f); queue.push(g);
    }
  }
  const path = (w) => { const out = []; for (let x = w; x != null; x = parent.get(x)) out.unshift(x); return out; };
  return { words, path, complete: !queue.length };
}
function grammarType(P) {
  const rhsHasS = P.some(([, r]) => r.includes("S"));
  const t3 = P.every(([A, r]) => /^[^A-Z]$/.test(r) || /^[^A-Z][A-Z]$/.test(r) || (r === "" && A === "S" && !rhsHasS));
  const bad = P.find(([A, r]) => !(/^[^A-Z]$/.test(r) || /^[^A-Z][A-Z]$/.test(r) || (r === "" && A === "S" && !rhsHasS)));
  return t3 ? "Typ 3 (regulär): jede Regel hat die Form A → a oder A → aB." : "Typ 2 (kontextfrei): links steht immer genau eine Variable. Nicht Typ 3 wegen „" + bad[0] + " → " + W(bad[1]) + "“.";
}

"use strict";
/* Prüfungssimulation: Claude prüft 10–30 Minuten quer durch die Kapitel, hakt nach und gibt am Ende eine Notentendenz.
   Ohne Claude (lokale Vorschau, kein Zugriff): dieselben Fragen mit Selbstcheck an den Kernpunkten. */

const SIM_GROUPS = [[3, 4], [2, 5], [6, 7], [8, 9], [1, 10]];
const SIM_TOPICS = { 10: 3, 20: 4, 30: 5 };
const NOTEN = [[90, "1,0"], [85, "1,3"], [80, "1,7"], [75, "2,0"], [70, "2,3"], [65, "2,7"], [60, "3,0"], [55, "3,3"], [50, "3,7"], [45, "4,0"], [0, "5,0"]];
const noteFor = (p) => NOTEN.find(([min]) => p >= min)[1];

function simPlan(n) {
  const maxK = Progress.pref("maxKap") || 10;
  // schwache und noch nie geübte Fragen zuerst, Prüfungshinweise der VL bevorzugt
  const w = (q) => { const o = Progress.oral(q.id); return (o.n ? 100 - (o.best || 0) : 110) + (q.klausur ? 25 : 0) + Math.random() * 30; };
  const best = (ks) => QUESTIONS.filter((q) => ks.includes(q.kap) && q.kap <= maxK).sort((a, b) => w(b) - w(a))[0];
  // die vier Hauptgebiete zuerst; Grundlagen/Zusammenhänge erst bei 30 Minuten
  const main = SIM_GROUPS.slice(0, 4).map(best).filter(Boolean).sort((a, b) => w(b) - w(a)).slice(0, n);
  const extra = n > main.length ? [best(SIM_GROUPS[4])].filter(Boolean) : [];
  return [...main, ...extra].slice(0, n).sort((a, b) => a.kap - b.kap);
}

function simContext(S) {
  const topics = S.plan.map((q) => `[${q.id}] ${q.kapitel}
Einstiegsfrage: ${q.frage_raw}
Kernpunkte der Musterlösung:
${q.antwort_raw.trim()}
Typische Nachfragen:
${q.nachfragen.map((x) => "- " + x.q_raw).join("\n") || "- (keine)"}`).join("\n\n");
  const log = S.log.map((x) => (x.who === "p" ? "Prüfer: " : "Student: ") + x.text).join("\n");
  const notes = S.notes.map((n) => `[${n.thema}] ${n.punkte} Punkte – ${n.notiz}`).join("\n");
  return `Du bist Prüfer in einer mündlichen Prüfung (${S.dur} Minuten) zur Vorlesung „Berechenbarkeit und Komplexität“ (Theoretische Informatik, FSU Jena). Die Prüfung findet auf Deutsch statt.
Notation der Vorlesung: DFA M = (Z, Σ, δ, z₀, F); NPDA mit Akzeptanz durch leeren Keller; TM M = (Z, Σ, Γ, □, δ, z₀, F, ⊗) mit Ablehnungszustand ⊗; Pumping-Lemma regulär w = pqr, kontextfrei w = p q₁ r q₂ s.
Die Antworten des Studenten wurden oft diktiert: Ignoriere Erkennungsfehler und fehlende Formelzeichen, solange der Inhalt erkennbar ist.

Themenplan (in dieser Reihenfolge, nur für dich):
${topics}

Bisheriger Verlauf:
${log}

Deine bisherigen privaten Notizen:
${notes || "(noch keine)"}
`;

function simTurnPrompt(S, left) {
  const time = left <= 0 ? "Die Zeit ist um: Beende die Prüfung jetzt mit einem kurzen, freundlichen Schlusssatz (ende = true)."
    : left < 150 ? `Noch etwa ${Math.max(1, Math.round(left / 60))} Minute(n): Schließe das aktuelle Thema mit höchstens einer Frage ab und beende dann.`
      : `Noch etwa ${Math.round(left / 60)} Minuten.`;
  return simContext(S) + `
${time}

Verhalte dich wie ein echter Prüfer an einer deutschen Universität: freundlich, sachlich, knapp. Während der Prüfung verrätst du keine Bewertung und keine Lösung – höchstens ein kurzes neutrales „Gut.“, „Okay.“ oder „Hm, nicht ganz.“. Dann stellst du GENAU EINE Frage: eine Nachfrage zur letzten Antwort (Begründung, Beispiel, Grenzfall, „Warum?“, „Was folgt daraus?“), oder du wechselst zum nächsten Thema des Plans. Pro Thema höchstens drei Nachfragen. Weiß der Student nicht weiter, gib einen kleinen Hinweis oder wechsle das Thema. Sind alle Themen behandelt, beende die Prüfung.

Antworte ausschließlich mit einem JSON-Objekt:
{"sagen": "<was du jetzt sagst: höchstens ein kurzer neutraler Satz zur letzten Antwort, dann genau eine Frage>", "thema": "<id des Themas, zu dem deine Frage gehört>", "punkte_letzte": <0 bis 100: fachliche Qualität der letzten Antwort des Studenten>, "notiz": "<private Notiz zur letzten Antwort, ein Satz>", "ende": <true oder false>}`;
}

function simFinalPrompt(S) {
  return simContext(S) + `
Die Prüfung ist beendet. Bewerte sie als Ganzes wie an einer deutschen Universität (Noten 1,0 1,3 1,7 2,0 2,3 2,7 3,0 3,3 3,7 4,0 5,0). Maßstab: fachliche Korrektheit, Vollständigkeit der Kernpunkte, Begründungen, Reaktion auf Nachfragen. Nicht behandelte Themen werden nicht bewertet und nicht in "themen" aufgeführt.

Antworte ausschließlich mit einem JSON-Objekt:
{"note": "<z. B. 2,3>", "urteil": "<2–3 Sätze direkt an den Studenten>", "staerken": ["<kurz>", ...], "luecken": ["<konkrete Lücke und was nachzulernen ist>", ...], "themen": [{"id": "<Themen-id>", "punkte": <0 bis 100>}], "tipp": "<ein konkreter Tipp für die echte Prüfung>"}`;
}

"use strict";
/* Tagesmix (verteiltes Wiederholen bis zur Prüfung) und Übersicht mit Schwachstellen pro Kapitel. */

const KAP_NAMES = { 1: "Grundlagen", 2: "Grammatiken, Chomsky-Hierarchie", 3: "Endliche Automaten", 4: "Pumping-Lemma, Myhill-Nerode, Minimierung", 5: "Kellerautomaten, kontextfreie Sprachen", 6: "Turingmaschinen, Berechenbarkeit", 7: "Halteproblem, Reduktion, Rice", 8: "Laufzeit, Landau, Mastertheorem", 9: "P, NP, EXP", 10: "Zusammenhänge" };
const MOD_KAP = { blatt1: 1, gram: 2, dfa: 3, nfa: 3, min: 4, mn: 4, plreg: 4, plcf: 5, cyk: 5, pda: 5, tm: 6, red: 7, sortlang: 2, sortcomp: 7, master: 8, landau: 8, redp: 9 };
const TASK_KAP = { "sortcomp:probleme": 9, "sortcomp:entscheidbar": 6, "sortcomp:folgerungen": 10 };
const EXAM_DEFAULT = "2027-02-01";              // „Februar 2027“, genaues Datum in den Einstellungen
const MIX_TASKS = 8, MIX_ORAL = 2;
const plain = (s) => String(s).replace(/\\\(|\\\)/g, "").replace(/[*_`]/g, "");

const Plan = {
  items() {
    const out = [];
    for (const m of App.mods) {
      if (m.counter) out.push({ key: m.id + ":gen", mod: m.id, kap: MOD_KAP[m.id], title: m.title, sub: "zufällige Aufgaben", open: { view: "mod", mod: m.id } });
      else if (!m.renderModule && m.tasks) m.tasks.forEach((t, pos) => {
        const key = m.id + ":" + t.id;
        out.push({ key, mod: m.id, pos, kap: t.kap || TASK_KAP[key] || MOD_KAP[m.id] || 10, title: t.title, sub: m.title, open: { view: "task", mod: m.id, task: t.id } });
      });
    }
    QUESTIONS.forEach((q, pos) => out.push({ key: "oral:" + q.id, mod: "oral", oral: q.id, pos: pos % 10, kap: q.kap, klausur: q.klausur, title: plain(q.frage_raw), sub: "Prüfungsfrage", open: { view: "mod", mod: "oral", q: q.id } }));
    return out;
  },
  // new = nie geübt, open = Schwachstelle (nicht gelöst bzw. < 70 %), due = Wiederholung fällig, later = sitzt gerade
  state(it) {
    const d = today();
    if (it.oral) {
      const o = Progress.oral(it.oral);
      return { doneToday: o.day === d, status: !o.n ? "new" : (o.best || 0) < 70 ? "open" : (o.due || "") <= d ? "due" : "later", fails: o.n && (o.best || 0) < 70 ? 100 - (o.best || 0) : 0 };
    }
    const p = Progress.task(it.key), fails = Math.min(p.fails || 0, 6) * 15;   // etwa vergleichbar mit 100 − Prozent bei Prüfungsfragen
    if (it.key.endsWith(":gen")) {          // Zufallsgeneratoren: Schwachstelle, wenn mehr falsch als richtig
      return { doneToday: p.okDay === d, status: !p.tries ? "new" : (p.fails || 0) > (p.correct || 0) ? "open" : (p.due || "") <= d ? "due" : "later", fails };
    }
    return { doneToday: p.okDay === d, status: !p.tries ? "new" : !p.done ? "open" : (p.due || "") <= d ? "due" : "later", fails };
  },
  build() {
    const maxK = Progress.pref("maxKap") || 10, rank = { open: 0, due: 1, new: 2 };
    const pool = this.items().filter((it) => it.kap <= maxK).map((it) => Object.assign({ st: this.state(it) }, it)).filter((it) => it.st.status !== "later");
    // Schwachstellen zuerst, dann fällige Wiederholungen, dann Neues – Neues in Kapitelreihenfolge, leichte Aufgaben eines Moduls zuerst
    const score = (it) => rank[it.st.status] * 1000 + (it.st.status === "new" ? it.kap * 50 + (it.pos || 0) * 3 : -it.st.fails) + (it.klausur ? -5 : 0) + Math.random() * 6;
    pool.sort((a, b) => score(a) - score(b));
    const pick = [], perMod = {};
    for (const it of pool) {
      if (it.oral ? pick.filter((x) => x.startsWith("oral:")).length >= MIX_ORAL : pick.length - pick.filter((x) => x.startsWith("oral:")).length >= MIX_TASKS) continue;
      if ((perMod[it.mod] || 0) >= (it.oral ? MIX_ORAL : 2)) continue;
      perMod[it.mod] = (perMod[it.mod] || 0) + 1;
      pick.push(it.key);
    }
    return pick;
  },
  todayList(rebuild) {
    const d = today(), days = Progress.data.days;
    if (rebuild || !days[d]) {
      for (const k of Object.keys(days)) if (daysBetween(k, d) > 21) delete days[k];
      days[d] = { items: this.build() };
      Progress.save();
    }
    const all = Object.fromEntries(this.items().map((it) => [it.key, it]));
    return days[d].items.map((k) => all[k]).filter(Boolean).map((it) => Object.assign({ st: this.state(it) }, it));
  },
  summary() {
    const list = this.todayList(), exam = Progress.pref("exam") || EXAM_DEFAULT, left = daysBetween(today(), exam);
    const label = Progress.pref("exam") ? new Date(exam + "T12:00:00").toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" }) : "Februar 2027";
    return { done: list.filter((it) => it.st.doneToday).length, total: list.length, left,
      countdown: left > 0 ? "noch " + left + " Tage bis zur Prüfung (" + label + ")" : left === 0 ? "Prüfung heute – viel Erfolg!" : "Prüfungstermin vorbei – Datum in den Einstellungen ändern" };
  },
};

const badge = (st, noToday) => st.doneToday && !noToday ? h("span", { class: "tag ok" }, "heute erledigt ✓")
  : st.status === "open" ? h("span", { class: "tag bad" }, "Schwachstelle")
    : st.status === "due" ? h("span", { class: "tag" }, "wiederholen") : h("span", { class: "tag new" }, "neu");

function itemButton(it, noToday) {
  return h("button", { class: "mod item", type: "button", onclick: () => App.show(Object.assign({}, it.open)) },
    h("div", { class: "row spread" }, h("span", { class: "small muted" }, "Kap. " + it.kap + " · " + it.sub), badge(it.st, noToday)),
    h("b", null, it.title));
}

    if (!list.length) view.append(fb("ok", "Heute ist nichts fällig", h("p", null, "Alles, was du geübt hast, sitzt gerade. Lust auf eine Prüfungssimulation?")));
    const open = list.filter((it) => !it.st.doneToday), done = list.filter((it) => it.st.doneToday);
    view.append(h("div", { class: "stack" }, [...open, ...done].map((it) => itemButton(it))));
    if (list.length && !open.length) view.append(h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => App.show({ view: "mod", mod: "sim" }) }, "Prüfungssimulation"),
      h("button", { class: "btn ghost", type: "button", onclick: () => { Plan.todayList(true); App.render(); } }, "Noch ein Paket")));
    const maxK = Progress.pref("maxKap") || 10;
    const dateIn = h("input", { type: "date", value: Progress.pref("exam") || EXAM_DEFAULT, "aria-label": "Prüfungstermin", onchange: (e) => { if (e.target.value) { Progress.pref("exam", e.target.value); App.render(); } } });
    view.append(h("details", null, h("summary", null, "Einstellungen"), h("div", { class: "stack", style: "margin-top:10px" },
      h("label", { class: "fld" }, h("span", { class: "small muted" }, "Prüfungstermin"), dateIn),
      h("div", { class: "fld" }, h("span", { class: "small muted" }, "Stoff bis Kapitel (was in der VL noch nicht dran war, bleibt draußen – gilt auch für die Simulation)"),
        h("div", { class: "row" }, [3, 4, 5, 6, 7, 8, 9, 10].map((k) => h("button", { class: "chip" + (maxK === k ? " on" : ""), type: "button", "aria-pressed": maxK === k ? "true" : "false",
          onclick: () => { Progress.pref("maxKap", k); Plan.todayList(true); App.render(); } }, k === 10 ? "alle" : "bis " + k)))),
      h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => { Plan.todayList(true); App.render(); } }, "Paket neu zusammenstellen")))));
  },
});

App.register({
  id: "stats", title: "Übersicht", chapter: "Fortschritt", desc: "Stand pro Kapitel und größte Baustellen",
  tasks: [],
  renderModule(view) {
    const items = Plan.items().map((it) => Object.assign({ st: Plan.state(it) }, it));
    view.append(h("div", { class: "hero" }, h("div", { class: "eyebrow" }, "Fortschritt"), h("h1", null, "Übersicht"),
      h("p", { class: "muted" }, "„Sitzt“ heißt: Aufgabe gelöst bzw. Prüfungsfrage mit mindestens 70 %. Schwachstellen sind Kapitel, in denen du schon geübt hast, aber weniger als die Hälfte sitzt.")));
    const rows = Object.keys(KAP_NAMES).map(Number).map((k) => {
      const its = items.filter((it) => it.kap === k), tasks = its.filter((it) => !it.oral), orals = its.filter((it) => it.oral);
      const ok = (it) => it.st.status === "due" || it.st.status === "later";
      const tried = its.filter((it) => it.st.status !== "new").length, good = its.filter(ok).length;
      const avg = orals.filter((it) => Progress.oral(it.oral).n).map((it) => Progress.oral(it.oral).best || 0);
      return { k, its, tasks, orals, tried, good, weak: tried >= 2 && good / its.length < 0.5 && its.some((it) => it.st.status === "open"),
        fails: tasks.reduce((a, it) => a + (Progress.task(it.key).fails || 0), 0), avg: avg.length ? Math.round(avg.reduce((a, b) => a + b, 0) / avg.length) : null };
    });
    view.append(h("div", { class: "stack" }, rows.map((r) => h("div", { class: "card task kaprow" },
      h("div", { class: "row spread" }, h("b", null, "Kap. " + r.k + " · " + KAP_NAMES[r.k]), r.weak ? h("span", { class: "tag bad" }, "Schwachstelle") : r.good === r.its.length && r.its.length ? h("span", { class: "tag ok" }, "sitzt ✓") : null),
      tapeCells(r.good, r.its.length),
      h("span", { class: "small muted" }, [
        r.tasks.length ? "Aufgaben " + r.tasks.filter((it) => Progress.done(it.key)).length + "/" + r.tasks.length : null,
        r.orals.length ? "Prüfungsfragen " + r.orals.filter((it) => (Progress.oral(it.oral).best || 0) >= 70).length + "/" + r.orals.length + (r.avg != null ? " (Ø bestes Ergebnis " + r.avg + " %)" : "") : null,
        r.fails ? r.fails + " Fehlversuche" : null,
      ].filter(Boolean).join(" · "))))));
    const worst = items.filter((it) => it.st.status === "open").sort((a, b) => b.st.fails - a.st.fails).slice(0, 6);
    view.append(h("div", { class: "group" }, h("div", { class: "eyebrow" }, "Größte Baustellen"),
      worst.length ? h("div", { class: "stack" }, worst.map((it) => itemButton(it, true))) : h("p", { class: "muted" }, "Noch keine – entweder alles gelöst oder noch nichts angefangen.")));
    const sims = Progress.data.sims.slice().reverse();
    view.append(h("div", { class: "group" }, h("div", { class: "eyebrow" }, "Prüfungssimulationen"),
      sims.length ? h("ul", { class: "plain" }, sims.map((s) => h("li", null, h("b", null, s.note), " · " + new Date(s.t).toLocaleDateString("de-DE") + " · " + s.dur + " min" + (s.mode === "selbst" ? " · Selbstcheck" : " · mit Claude"))))
        : h("div", { class: "row" }, h("span", { class: "muted" }, "Noch keine."), h("button", { class: "btn", type: "button", onclick: () => App.show({ view: "mod", mod: "sim" }) }, "Jetzt eine machen"))));
    view.append(h("div", { class: "group" }, h("div", { class: "eyebrow" }, "Anderes Gerät"),
      h("div", { class: "row" }, h("span", { class: "muted small" }, "Gespeichert: " + (Progress.where === "Konto" ? "im claude.ai-Konto" : "in diesem Browser") + "."),
        h("button", { class: "btn", type: "button", onclick: transferSheet }, "Fortschritt übertragen"))));
  },
});

App.start();
</script>
