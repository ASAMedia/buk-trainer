ort_raw":"\nBei endlichem Index: **Klassen = Zustände**.\n- Zustand \\(z_{[w]}\\) je Klasse, Start \\(z_{[\\varepsilon]}\\), Endzustände \\(\\{z_{[w]} \\mid w \\in L\\}\\)\n- \\(\\delta(z_{[w]}, a) = z_{[wa]}\\)\n- **Wohldefiniert:** Sind v, w in derselben Klasse, dann auch va und wa: Für jedes x gilt vax ∈ L ⇔ wax ∈ L (wähle ax als Suffix).\n- Induktion: \\(\\hat\\delta(z_{[\\varepsilon]}, w) = z_{[w]}\\), also w ∈ L(M) ⇔ \\(z_{[w]} \\in F\\) ⇔ w ∈ L.\n"},{"id":"mn-nichtregulaer","kap":4,"kapitel":"Kap. 4 · Pumping-Lemma, Myhill-Nerode, Minimierung","klausur":false,"erg":false,"frage":"<p>Wie zeigt man mit Myhill-Nerode, dass \\(\\{a^n b^n\\}\\) nicht regulär ist?<\/p>","antwort":"<ul><li>Betrachte die unendlich vielen Wörter \\(v_i = a^i\\), i ≥ 0.<\/li><li>Für i ≠ j trennt das Suffix \\(x = b^i\\): \\(a^i b^i \\in L\\), aber \\(a^j b^i \\notin L\\).<\/li><li>⇒ Alle \\(a^i\\) liegen in <b>paarweise verschiedenen<\/b> Klassen ⇒ Index unendlich ⇒ nicht regulär.<\/li><\/ul>","details":"","punkte":["Betrachte die unendlich vielen Wörter \\(v_i = a^i\\), i ≥ 0.","Für i ≠ j trennt das Suffix \\(x = b^i\\): \\(a^i b^i \\in L\\), aber \\(a^j b^i \\notin L\\).","⇒ Alle \\(a^i\\) liegen in <b>paarweise verschiedenen<\/b> Klassen ⇒ Index unendlich ⇒ nicht regulär."],"nachfragen":[{"q":"Was ist hier einfacher als beim PL?","a":"<p>Keine Fallunterscheidung über Zerlegungen. Man braucht nur unendlich viele paarweise trennbare Wörter und je ein trennendes Suffix.<\/p>","q_raw":"Was ist hier einfacher als beim PL?","a_raw":"Keine Fallunterscheidung über Zerlegungen. Man braucht nur unendlich viele paarweise trennbare Wörter und je ein trennendes Suffix."}],"frage_raw":"Wie zeigt man mit Myhill-Nerode, dass \\(\\{a^n b^n\\}\\) nicht regulär ist?","antwort_raw":"\n- Betrachte die unendlich vielen Wörter \\(v_i = a^i\\), i ≥ 0.\n- Für i ≠ j trennt das Suffix \\(x = b^i\\): \\(a^i b^i \\in L\\), aber \\(a^j b^i \\notin L\\).\n- ⇒ Alle \\(a^i\\) liegen in **paarweise verschiedenen** Klassen ⇒ Index unendlich ⇒ nicht regulär.\n"},{"id":"min-def","kap":4,"kapitel":"Kap. 4 · Pumping-Lemma, Myhill-Nerode, Minimierung","klausur":false,"erg":false,"frage":"<p>Was ist ein Minimalautomat, und wie erhält man ihn aus einem beliebigen DFA?<\/p>","antwort":"<ul><li>M ist <b>Minimalautomat<\/b> für L, wenn es keinen äquivalenten DFA mit weniger Zuständen gibt.<\/li><li>Zustandsäquivalenz: \\((z_i, z_j) \\in R_M \\iff L(M, z_i) = L(M, z_j)\\), wobei L(M, z) die akzeptierte Sprache ist, wenn z der Startzustand wäre.<\/li><li><b>Satz:<\/b> Streicht man alle <b>nicht erreichbaren<\/b> Zustände und <b>fasst äquivalente Zustände zusammen<\/b>, erhält man den Minimalautomaten.<\/li><\/ul>","details":"","punkte":["M ist <b>Minimalautomat<\/b> für L, wenn es keinen äquivalenten DFA mit weniger Zuständen gibt.","Zustandsäquivalenz: \\((z_i, z_j) \\in R_M \\iff L(M, z_i) = L(M, z_j)\\), wobei L(M, z) die akzeptierte Sprache ist, wenn z der Startzustand wäre.","<b>Satz:<\/b> Streicht man alle <b>nicht erreichbaren<\/b> Zustände und <b>fasst äquivalente Zustände zusammen<\/b>, erhält man den Minimalautomaten."],"nachfragen":[{"q":"Ist der Minimalautomat eindeutig?","a":"<p>Ja, bis auf Umbenennung der Zustände. Das folgt aus Myhill-Nerode: Seine Zustände entsprechen genau den Klassen von R<sub>L<\/sub>. (Ergänzung)<\/p>","q_raw":"Ist der Minimalautomat eindeutig?","a_raw":"Ja, bis auf Umbenennung der Zustände. Das folgt aus Myhill-Nerode: Seine Zustände entsprechen genau den Klassen von R_L. (Ergänzung)"},{"q":"Was gilt für Nachfolger äquivalenter Zustände?","a":"<p>Sind zᵢ und zⱼ äquivalent, dann auch δ(zᵢ, a) und δ(zⱼ, a) für jedes a. Deshalb darf man sie verschmelzen.<\/p>","q_raw":"Was gilt für Nachfolger äquivalenter Zustände?","a_raw":"Sind zᵢ und zⱼ äquivalent, dann auch δ(zᵢ, a) und δ(zⱼ, a) für jedes a. Deshalb darf man sie verschmelzen."}],"frage_raw":"Was ist ein Minimalautomat, und wie erhält man ihn aus einem beliebigen DFA?","antwort_raw":"\n- M ist **Minimalautomat** für L, wenn es keinen äquivalenten DFA mit weniger Zuständen gibt.\n- Zustandsäquivalenz: \\((z_i, z_j) \\in R_M \\iff L(M, z_i) = L(M, z_j)\\), wobei L(M, z) die akzeptierte Sprache ist, wenn z der Startzustand wäre.\n- **Satz:** Streicht man alle **nicht erreichbaren** Zustände und **fasst äquivalente Zustände zusammen**, erhält man den Minimalautomaten.\n"},{"id":"min-algo","kap":4,"kapitel":"Kap. 4 · Pumping-Lemma, Myhill-Nerode, Minimierung","klausur":false,"erg":false,"frage":"<p>Erklären Sie den Algorithmus zur Minimalautomaten-Konstruktion (Markierungsalgorithmus).<\/p>","antwort":"<ol><li>Nicht erreichbare Zustände löschen.<\/li><li>Tabelle aller <b>ungeordneten<\/b> Paare {z, z′}, z ≠ z′.<\/li><li>Alle Paare markieren, bei denen genau einer ein Endzustand ist.<\/li><li>Ein unmarkiertes Paar {z, z′} markieren, wenn für ein a ∈ Σ das Paar {δ(z, a), δ(z′, a)} schon markiert ist.<\/li><li>Schritt 4 wiederholen, bis sich nichts mehr ändert.<\/li><li>Unmarkierte Paare sind äquivalent und werden verschmolzen.<\/li><\/ol>","details":"","punkte":["Nicht erreichbare Zustände löschen.","Tabelle aller <b>ungeordneten<\/b> Paare {z, z′}, z ≠ z′.","Alle Paare markieren, bei denen genau einer ein Endzustand ist.","Ein unmarkiertes Paar {z, z′} markieren, wenn für ein a ∈ Σ das Paar {δ(z, a), δ(z′, a)} schon markiert ist.","Schritt 4 wiederholen, bis sich nichts mehr ändert.","Unmarkierte Paare sind äquivalent und werden verschmolzen."],"nachfragen":[{"q":"Was bedeutet eine Markierung?","a":"<p>„Diese beiden Zustände sind unterscheidbar“: Es gibt ein Wort, das von genau einem der beiden in einen Endzustand führt. Die Runde der Markierung entspricht der Länge des kürzesten trennenden Worts.<\/p>","q_raw":"Was bedeutet eine Markierung?","a_raw":"„Diese beiden Zustände sind unterscheidbar“: Es gibt ein Wort, das von genau einem der beiden in einen Endzustand führt. Die Runde der Markierung entspricht der Länge des kürzesten trennenden Worts."},{"q":"Warum terminiert der Algorithmus?","a":"<p>Es gibt endlich viele Paare, und in jeder Runde kommt mindestens eine Markierung dazu. Sonst bricht er ab.<\/p>","q_raw":"Warum terminiert der Algorithmus?","a_raw":"Es gibt endlich viele Paare, und in jeder Runde kommt mindestens eine Markierung dazu. Sonst bricht er ab."}],"frage_raw":"Erklären Sie den Algorithmus zur Minimalautomaten-Konstruktion (Markierungsalgorithmus).","antwort_raw":"\n1. Nicht erreichbare Zustände löschen.\n2. Tabelle aller **ungeordneten** Paare {z, z′}, z ≠ z′.\n3. Alle Paare markieren, bei denen genau einer ein Endzustand ist.\n4. Ein unmarkiertes Paar {z, z′} markieren, wenn für ein a ∈ Σ das Paar {δ(z, a), δ(z′, a)} schon markiert ist.\n5. Schritt 4 wiederholen, bis sich nichts mehr ändert.\n6. Unmarkierte Paare sind äquivalent und werden verschmolzen.\n"},{"id":"pda-motivation","kap":5,"kapitel":"Kap. 5 · Kellerautomaten und kontextfreie Sprachen","klausur":false,"erg":false,"frage":"<p>Warum führt man Kellerautomaten ein, und wie arbeiten sie?<\/p>","antwort":"<ul><li>DFAs haben keinen Speicher und scheitern deshalb z. B. an aⁿbⁿ.<\/li><li>Lösung: Der NFAε bekommt einen <b>Kellerspeicher<\/b> (Stack): unbegrenzt groß, <b>LIFO<\/b>, nur das <b>oberste<\/b> Zeichen ist sichtbar.<\/li><li>Pro Takt: Zeichen lesen (oder ε), oberstes Kellerzeichen lesen und <b>entfernen<\/b>, Zustand wechseln, ein Wort g ∈ Γ* auf den Keller schreiben. Das erste Zeichen von g liegt danach oben.<\/li><li>Die VL betrachtet von Anfang an <b>nichtdeterministische<\/b> Kellerautomaten (NPDA).<\/li><\/ul>","details":"","punkte":["DFAs haben keinen Speicher und scheitern deshalb z. B. an aⁿbⁿ.","Lösung: Der NFAε bekommt einen <b>Kellerspeicher<\/b> (Stack): unbegrenzt groß, <b>LIFO<\/b>, nur das <b>oberste<\/b> Zeichen ist sichtbar.","Pro Takt: Zeichen lesen (oder ε), oberstes Kellerzeichen lesen und <b>entfernen<\/b>, Zustand wechseln, ein Wort g ∈ Γ* auf den Keller schreiben. Das erste Zeichen von g liegt danach oben.","Die VL betrachtet von Anfang an <b>nichtdeterministische<\/b> Kellerautomaten (NPDA)."],"nachfragen":[{"q":"Wie realisiert man push, pop und „nichts tun“?","a":"<p>Mit dem Ersatzwort g: g = ε (pop), g = A bei oberstem A (unverändert), g = XA (X auf A legen = push).<\/p>","q_raw":"Wie realisiert man push, pop und „nichts tun“?","a_raw":"Mit dem Ersatzwort g: g = ε (pop), g = A bei oberstem A (unverändert), g = XA (X auf A legen = push)."}],"frage_raw":"Warum führt man Kellerautomaten ein, und wie arbeiten sie?","antwort_raw":"\n- DFAs haben keinen Speicher und scheitern deshalb z. B. an aⁿbⁿ.\n- Lösung: Der NFAε bekommt einen **Kellerspeicher** (Stack): unbegrenzt groß, **LIFO**, nur das **oberste** Zeichen ist sichtbar.\n- Pro Takt: Zeichen lesen (oder ε), oberstes Kellerzeichen lesen und **entfernen**, Zustand wechseln, ein Wort g ∈ Γ* auf den Keller schreiben. Das erste Zeichen von g liegt danach oben.\n- Die VL betrachtet von Anfang an **nichtdeterministische** Kellerautomaten (NPDA).\n"},{"id":"pda-def","kap":5,"kapitel":"Kap. 5 · Kellerautomaten und kontextfreie Sprachen","klausur":false,"erg":false,"frage":"<p>Definieren Sie den NPDA. Wann akzeptiert er ein Wort?<\/p>","antwort":"<p>NPDA M = (Z, Σ, Γ, δ, z₀, ⊥):<\/p><ul><li>Z Zustände, Σ Eingabealphabet, Γ Kelleralphabet<\/li><li><b>δ: Z × (Σ ∪ {ε}) × Γ → 𝒫(Z × Γ*)<\/b> (endliche Teilmengen)<\/li><li>z₀ Startzustand, <b>⊥ ∈ Γ<\/b> unterstes Kellerzeichen (am Anfang steht nur ⊥ im Keller)<\/li><li><b>Kein F!<\/b> Akzeptanz durch <b>leeren Keller<\/b>: w wird akzeptiert, wenn nach dem Lesen von w der Keller <b>komplett leer<\/b> ist, auch ⊥ entfernt.<\/li><\/ul>","details":"","punkte":["Z Zustände, Σ Eingabealphabet, Γ Kelleralphabet","<b>δ: Z × (Σ ∪ {ε}) × Γ → 𝒫(Z × Γ*)<\/b> (endliche Teilmengen)","z₀ Startzustand, <b>⊥ ∈ Γ<\/b> unterstes Kellerzeichen (am Anfang steht nur ⊥ im Keller)","<b>Kein F!<\/b> Akzeptanz durch <b>leeren Keller<\/b>: w wird akzeptiert, wenn nach dem Lesen von w der Keller <b>komplett leer<\/b> ist, auch ⊥ entfernt."],"nachfragen":[{"q":"Was ist eine Konfiguration?","a":"<p>(z, w, g) ∈ Z × Σ* × Γ*: Zustand, Resteingabe, Kellerinhalt (oberstes Zeichen links). Start (z₀, w, ⊥), akzeptierend (z, ε, ε).<\/p>","q_raw":"Was ist eine Konfiguration?","a_raw":"(z, w, g) ∈ Z × Σ* × Γ*: Zustand, Resteingabe, Kellerinhalt (oberstes Zeichen links). Start (z₀, w, ⊥), akzeptierend (z, ε, ε)."},{"q":"Wie ist L(M) formal definiert?","a":"<p>L(M) = {w | es gibt eine endliche Konfigurationsfolge (z₀, w, ⊥) ⊢ … ⊢ (z, ε, ε)}: <b>mindestens ein<\/b> Lauf leert den Keller.<\/p>","q_raw":"Wie ist L(M) formal definiert?","a_raw":"L(M) = {w | es gibt eine endliche Konfigurationsfolge (z₀, w, ⊥) ⊢ … ⊢ (z, ε, ε)}: **mindestens ein** Lauf leert den Keller."},{"q":"Was passiert, wenn kein Übergang existiert?","a":"<p>Dieser Lauf bricht ab und akzeptiert nicht. Andere nichtdeterministische Läufe können trotzdem akzeptieren.<\/p>","q_raw":"Was passiert, wenn kein Übergang existiert?","a_raw":"Dieser Lauf bricht ab und akzeptiert nicht. Andere nichtdeterministische Läufe können trotzdem akzeptieren."}],"frage_raw":"Definieren Sie den NPDA. Wann akzeptiert er ein Wort?","antwort_raw":"\nNPDA M = (Z, Σ, Γ, δ, z₀, ⊥):\n- Z Zustände, Σ Eingabealphabet, Γ Kelleralphabet\n- **δ: Z × (Σ ∪ {ε}) × Γ → 𝒫(Z × Γ*)** (endliche Teilmengen)\n- z₀ Startzustand, **⊥ ∈ Γ** unterstes Kellerzeichen (am Anfang steht nur ⊥ im Keller)\n- **Kein F!** Akzeptanz durch **leeren Keller**: w wird akzeptiert, wenn nach dem Lesen von w der Keller **komplett leer** ist, auch ⊥ entfernt.\n"},{"id":"pda-dpda","kap":5,"kapitel":"Kap. 5 · Kellerautomaten und kontextfreie Sprachen","klausur":false,"erg":false,"frage":"<p>Was ist ein DPDA? Wie unterscheidet er sich vom NPDA, und sind beide gleich mächtig?<\/p>","antwort":"<p>Drei Änderungen gegenüber dem NPDA:<\/p><ol><li>Endzustände <b>F ⊆ Z<\/b> kommen wieder hinzu.<\/li><li>Akzeptanz durch <b>Endzustand<\/b> nach dem Lesen von w (Kellerinhalt egal).<\/li><li>Determinismus: \\(|\\delta(z, a, A)| + |\\delta(z, \\varepsilon, A)| \\le 1\\) für alle z, a, A: höchstens eine Nachfolgekonfiguration.<\/li><\/ol><p><b>Nicht gleich mächtig:<\/b> NPDAs sind <b>echt mächtiger<\/b>. DPDAs erkennen die <b>deterministisch kontextfreien<\/b> Sprachen ⊊ Typ 2.<\/p>","details":"","punkte":["Endzustände <b>F ⊆ Z<\/b> kommen wieder hinzu.","Akzeptanz durch <b>Endzustand<\/b> nach dem Lesen von w (Kellerinhalt egal).","Determinismus: \\(|\\delta(z, a, A)| + |\\delta(z, \\varepsilon, A)| \\le 1\\) für alle z, a, A: höchstens eine Nachfolgekonfiguration."],"nachfragen":[{"q":"Beispiel für kontextfrei, aber nicht deterministisch kontextfrei?","a":"<p>Die Palindrome bzw. \\(\\{ww^R\\}\\): Ein PDA müsste die Mitte erkennen, ohne Markierung muss er sie <b>raten<\/b>. Mit Mittelmarkierung (\\(\\{wcw^R\\}\\)) geht es deterministisch.<\/p>","q_raw":"Beispiel für kontextfrei, aber nicht deterministisch kontextfrei?","a_raw":"Die Palindrome bzw. \\(\\{ww^R\\}\\): Ein PDA müsste die Mitte erkennen, ohne Markierung muss er sie **raten**. Mit Mittelmarkierung (\\(\\{wcw^R\\}\\)) geht es deterministisch."},{"q":"Warum steht in der Bedingung auch δ(z, ε, A)?","a":"<p>Sonst hätte der Automat die Wahl zwischen einem ε-Übergang und einem lesenden Übergang, und das wäre wieder Nichtdeterminismus.<\/p>","q_raw":"Warum steht in der Bedingung auch δ(z, ε, A)?","a_raw":"Sonst hätte der Automat die Wahl zwischen einem ε-Übergang und einem lesenden Übergang, und das wäre wieder Nichtdeterminismus."},{"q":"Ist der VL-Automat für aⁿbⁿ deterministisch?","a":"<p>Nein: In z₀ gibt es für ⊥ sowohl a, ⊥ → A⊥ als auch ε, ⊥ → ε. Außerdem akzeptiert er per leerem Keller. Die Sprache ist trotzdem deterministisch kontextfrei.<\/p>","q_raw":"Ist der VL-Automat für aⁿbⁿ deterministisch?","a_raw":"Nein: In z₀ gibt es für ⊥ sowohl a, ⊥ → A⊥ als auch ε, ⊥ → ε. Außerdem akzeptiert er per leerem Keller. Die Sprache ist trotzdem deterministisch kontextfrei."}],"frage_raw":"Was ist ein DPDA? Wie unterscheidet er sich vom NPDA, und sind beide gleich mächtig?","antwort_raw":"\nDrei Änderungen gegenüber dem NPDA:\n1. Endzustände **F ⊆ Z** kommen wieder hinzu.\n2. Akzeptanz durch **Endzustand** nach dem Lesen von w (Kellerinhalt egal).\n3. Determinismus: \\(|\\delta(z, a, A)| + |\\delta(z, \\varepsilon, A)| \\le 1\\) für alle z, a, A: höchstens eine Nachfolgekonfiguration.\n\n**Nicht gleich mächtig:** NPDAs sind **echt mächtiger**. DPDAs erkennen die **deterministisch kontextfreien** Sprachen ⊊ Typ 2.\n"},{"id":"pda-typ2","kap":5,"kapitel":"Kap. 5 · Kellerautomaten und kontextfreie Sprachen","klausur":false,"erg":false,"frage":"<p>Welche Sprachklasse erkennen NPDAs? Wie hängt das mit der Chomsky-Hierarchie zusammen?<\/p>","antwort":"<ul><li><b>Satz:<\/b> L ist <b>kontextfrei (Typ 2)<\/b> ⇔ L wird von einem <b>NPDA<\/b> akzeptiert.<\/li><li>Typ 3 ⊊ deterministisch kontextfrei ⊊ Typ 2.<\/li><li>Intuition: Der Keller kann <b>zwei<\/b> Gruppen von Zeichen vergleichen (aⁿbⁿ, wwᴿ), aber nicht drei gleichzeitig (aⁿbⁿcⁿ).<\/li><\/ul>","details":"","punkte":["<b>Satz:<\/b> L ist <b>kontextfrei (Typ 2)<\/b> ⇔ L wird von einem <b>NPDA<\/b> akzeptiert.","Typ 3 ⊊ deterministisch kontextfrei ⊊ Typ 2.","Intuition: Der Keller kann <b>zwei<\/b> Gruppen von Zeichen vergleichen (aⁿbⁿ, wwᴿ), aber nicht drei gleichzeitig (aⁿbⁿcⁿ)."],"nachfragen":[{"q":"Warum misst man die Laufzeit des Wortproblems für Typ 2 nicht über PDAs?","a":"<p>Viele ε-Übergänge ohne Fortschritt im Wort und Nichtdeterminismus machen das unpraktisch. Man nutzt Chomsky-Normalform und CYK: O(n³).<\/p>","q_raw":"Warum misst man die Laufzeit des Wortproblems für Typ 2 nicht über PDAs?","a_raw":"Viele ε-Übergänge ohne Fortschritt im Wort und Nichtdeterminismus machen das unpraktisch. Man nutzt Chomsky-Normalform und CYK: O(n³)."}],"frage_raw":"Welche Sprachklasse erkennen NPDAs? Wie hängt das mit der Chomsky-Hierarchie zusammen?","antwort_raw":"\n- **Satz:** L ist **kontextfrei (Typ 2)** ⇔ L wird von einem **NPDA** akzeptiert.\n- Typ 3 ⊊ deterministisch kontextfrei ⊊ Typ 2.\n- Intuition: Der Keller kann **zwei** Gruppen von Zeichen vergleichen (aⁿbⁿ, wwᴿ), aber nicht drei gleichzeitig (aⁿbⁿcⁿ).\n"},{"id":"plk-aussage","kap":5,"kapitel":"Kap. 5 · Kellerautomaten und kontextfreie Sprachen","klausur":false,"erg":false,"frage":"<p>Formulieren Sie das Pumping-Lemma für kontextfreie Sprachen. Was ist anders als beim regulären?<\/p>","antwort":"<p>Sei L kontextfrei. Dann gibt es N ∈ ℕ, sodass jedes w ∈ L mit |w| ≥ N zerlegbar ist als <b>w = p q₁ r q₂ s<\/b> mit<\/p><ol><li>\\(|q_1 q_2| \\ge 1\\)<\/li><li>\\(|q_1 r q_2| \\le N\\)<\/li><li>\\(p\\, q_1^i\\, r\\, q_2^i\\, s \\in L\\) für alle i ≥ 0<\/li><\/ol><p>Unterschied: Es wird an <b>zwei Stellen gleichzeitig<\/b> gepumpt, und das Fenster \\(q_1 r q_2\\) darf <b>irgendwo<\/b> im Wort liegen, nicht nur am Anfang. Auch dieses PL ist nur <b>notwendig<\/b>.<\/p>","details":"","punkte":["\\(|q_1 q_2| \\ge 1\\)","\\(|q_1 r q_2| \\le N\\)","\\(p\\, q_1^i\\, r\\, q_2^i\\, s \\in L\\) für alle i ≥ 0"],"nachfragen":[{"q":"Warum zwei Stellen?","a":"<p>Ein PDA (bzw. Ableitungsbaum) kann zwei Zeichengruppen zueinander in Beziehung setzen, z. B. a's und b's in aⁿbⁿ. Pumpt man, müssen beide Gruppen gleichzeitig wachsen.<\/p>","q_raw":"Warum zwei Stellen?","a_raw":"Ein PDA (bzw. Ableitungsbaum) kann zwei Zeichengruppen zueinander in Beziehung setzen, z. B. a's und b's in aⁿbⁿ. Pumpt man, müssen beide Gruppen gleichzeitig wachsen."},{"q":"Woher kommt das Lemma im Beweis?","a":"<p>VL: Wie beim regulären PL wiederholt sich bei langen Wörtern etwas (Zustand bzw. Variable im Ableitungsbaum). Standardbeweis (Ergänzung): Im Ableitungsbaum einer CNF-Grammatik kommt auf einem langen Pfad eine Variable doppelt vor; der Teilbaum dazwischen lässt sich wiederholen.<\/p>","q_raw":"Woher kommt das Lemma im Beweis?","a_raw":"VL: Wie beim regulären PL wiederholt sich bei langen Wörtern etwas (Zustand bzw. Variable im Ableitungsbaum). Standardbeweis (Ergänzung): Im Ableitungsbaum einer CNF-Grammatik kommt auf einem langen Pfad eine Variable doppelt vor; der Teilbaum dazwischen lässt sich wiederholen."}],"frage_raw":"Formulieren Sie das Pumping-Lemma für kontextfreie Sprachen. Was ist anders als beim regulären?","antwort_raw":"\nSei L kontextfrei. Dann gibt es N ∈ ℕ, sodass jedes w ∈ L mit |w| ≥ N zerlegbar ist als **w = p q₁ r q₂ s** mit\n1. \\(|q_1 q_2| \\ge 1\\)\n2. \\(|q_1 r q_2| \\le N\\)\n3. \\(p\\, q_1^i\\, r\\, q_2^i\\, s \\in L\\) für alle i ≥ 0\n\nUnterschied: Es wird an **zwei Stellen gleichzeitig** gepumpt, und das Fenster \\(q_1 r q_2\\) darf **irgendwo** im Wort liegen, nicht nur am Anfang. Auch dieses PL ist nur **notwendig**.\n"},{"id":"plk-anbncn","kap":5,"kapitel":"Kap. 5 · Kellerautomaten und kontextfreie Sprachen","klausur":false,"erg":false,"frage":"<p>Zeigen Sie: \\(\\{a^n b^n c^n \\mid n \\ge 0\\}\\) ist nicht kontextfrei.<\/p>","antwort":"<ul><li>Annahme: L kontextfrei, Pumping-Zahl N. Wähle \\(w = a^N b^N c^N\\), |w| = 3N ≥ N.<\/li><li>Wegen \\(|q_1 r q_2| \\le N\\) kann das Fenster nicht a's <b>und<\/b> c's enthalten (dazwischen liegen N b's). Es liegt also in a*b* oder in b*c*.<\/li><li>Wegen \\(|q_1q_2| \\ge 1\\) ändert Pumpen mit i = 2 (oder 0) die Anzahl von <b>höchstens zwei<\/b> Buchstabensorten, die dritte bleibt N.<\/li><li>⇒ Die Anzahlen sind nicht mehr gleich (oder die Reihenfolge ist zerstört, falls q₁ bzw. q₂ zwei Sorten enthält) ⇒ \\(\\notin L\\) ↯ □<\/li><\/ul>","details":"","punkte":["Annahme: L kontextfrei, Pumping-Zahl N. Wähle \\(w = a^N b^N c^N\\), |w| = 3N ≥ N.","Wegen \\(|q_1 r q_2| \\le N\\) kann das Fenster nicht a's <b>und<\/b> c's enthalten (dazwischen liegen N b's). Es liegt also in a*b* oder in b*c*.","Wegen \\(|q_1q_2| \\ge 1\\) ändert Pumpen mit i = 2 (oder 0) die Anzahl von <b>höchstens zwei<\/b> Buchstabensorten, die dritte bleibt N.","⇒ Die Anzahlen sind nicht mehr gleich (oder die Reihenfolge ist zerstört, falls q₁ bzw. q₂ zwei Sorten enthält) ⇒ \\(\\notin L\\) ↯ □"],"nachfragen":[{"q":"Welche Fälle muss man genau unterscheiden?","a":"<p>Das Fenster q₁rq₂ liegt in {a}*, {a,b}*, {b}*, {b,c}* oder {c}*. In jedem Fall bleibt eine Buchstabensorte unverändert.<\/p>","q_raw":"Welche Fälle muss man genau unterscheiden?","a_raw":"Das Fenster q₁rq₂ liegt in {a}*, {a,b}*, {b}*, {b,c}* oder {c}*. In jedem Fall bleibt eine Buchstabensorte unverändert."}],"frage_raw":"Zeigen Sie: \\(\\{a^n b^n c^n \\mid n \\ge 0\\}\\) ist nicht kontextfrei.","antwort_raw":"\n- Annahme: L kontextfrei, Pumping-Zahl N. Wähle \\(w = a^N b^N c^N\\), |w| = 3N ≥ N.\n- Wegen \\(|q_1 r q_2| \\le N\\) kann das Fenster nicht a's **und** c's enthalten (dazwischen liegen N b's). Es liegt also in a*b* oder in b*c*.\n- Wegen \\(|q_1q_2| \\ge 1\\) ändert Pumpen mit i = 2 (oder 0) die Anzahl von **höchstens zwei** Buchstabensorten, die dritte bleibt N.\n- ⇒ Die Anzahlen sind nicht mehr gleich (oder die Reihenfolge ist zerstört, falls q₁ bzw. q₂ zwei Sorten enthält) ⇒ \\(\\notin L\\) ↯ □\n"},{"id":"cyk-cnf","kap":5,"kapitel":"Kap. 5 · Kellerautomaten und kontextfreie Sprachen","klausur":false,"erg":false,"frage":"<p>Was ist die Chomsky-Normalform, und wozu braucht man sie?<\/p>","antwort":"<ul><li>Alle Regeln haben die Form <b>A → BC<\/b> oder <b>A → a<\/b> (A, B, C ∈ V, a ∈ Σ), ggf. S → ε.<\/li><li><b>Jede<\/b> kontextfreie Grammatik lässt sich in CNF umformen.<\/li><li>Nutzen: Ableitungsbäume sind <b>binär<\/b>, ein Wort der Länge n braucht genau 2n − 1 Regelanwendungen. Darauf baut der <b>CYK-Algorithmus<\/b> auf.<\/li><\/ul>","details":"","punkte":["Alle Regeln haben die Form <b>A → BC<\/b> oder <b>A → a<\/b> (A, B, C ∈ V, a ∈ Σ), ggf. S → ε.","<b>Jede<\/b> kontextfreie Grammatik lässt sich in CNF umformen.","Nutzen: Ableitungsbäume sind <b>binär<\/b>, ein Wort der Länge n braucht genau 2n − 1 Regelanwendungen. Darauf baut der <b>CYK-Algorithmus<\/b> auf."],"nachfragen":[{"q":"Wie wandelt man um? (Ergänzung)","a":"<p>ε-Regeln und Kettenregeln A → B entfernen, Terminale in langen rechten Seiten durch neue Variablen ersetzen (Xₐ → a), lange rechte Seiten in Ketten von Zweierregeln zerlegen.<\/p>","q_raw":"Wie wandelt man um? (Ergänzung)","a_raw":"ε-Regeln und Kettenregeln A → B entfernen, Terminale in langen rechten Seiten durch neue Variablen ersetzen (Xₐ → a), lange rechte Seiten in Ketten von Zweierregeln zerlegen."}],"frage_raw":"Was ist die Chomsky-Normalform, und wozu braucht man sie?","antwort_raw":"\n- Alle Regeln haben die Form **A → BC** oder **A → a** (A, B, C ∈ V, a ∈ Σ), ggf. S → ε.\n- **Jede** kontextfreie Grammatik lässt sich in CNF umformen.\n- Nutzen: Ableitungsbäume sind **binär**, ein Wort der Länge n braucht genau 2n − 1 Regelanwendungen. Darauf baut der **CYK-Algorithmus** auf.\n"},{"id":"cyk-algo","kap":5,"kapitel":"Kap. 5 · Kellerautomaten und kontextfreie Sprachen","klausur":false,"erg":false,"frage":"<p>Erklären Sie den CYK-Algorithmus. Welche Laufzeit hat er?<\/p>","antwort":"<p>Entscheidet das <b>Wortproblem für Typ 2<\/b> (Grammatik in CNF), w = a₁…aₙ:<\/p><ul><li>Tabelle V[i, j] = Menge der Variablen, die das Teilwort der Länge j ab Position i erzeugen.<\/li><li>Länge 1: V[i, 1] = {A | A → aᵢ}.<\/li><li>Länge j: A ∈ V[i, j], wenn A → BC mit B ∈ V[i, k], C ∈ V[i+k, j−k] für ein 1 ≤ k &lt; j.<\/li><li>w ∈ L(G) ⇔ <b>S ∈ V[1, n]<\/b>.<\/li><li><b>O(n³)<\/b>: O(n²) Tabellenfelder mit je O(n) Zerlegungspunkten k.<\/li><\/ul>","details":"","punkte":["Tabelle V[i, j] = Menge der Variablen, die das Teilwort der Länge j ab Position i erzeugen.","Länge 1: V[i, 1] = {A | A → aᵢ}.","Länge j: A ∈ V[i, j], wenn A → BC mit B ∈ V[i, k], C ∈ V[i+k, j−k] für ein 1 ≤ k &lt; j.","w ∈ L(G) ⇔ <b>S ∈ V[1, n]<\/b>.","<b>O(n³)<\/b>: O(n²) Tabellenfelder mit je O(n) Zerlegungspunkten k."],"nachfragen":[{"q":"Welches Prinzip steckt dahinter?","a":"<p><b>Dynamische Programmierung<\/b>: Ergebnisse für kurze Teilwörter werden wiederverwendet, um längere zu entscheiden.<\/p>","q_raw":"Welches Prinzip steckt dahinter?","a_raw":"**Dynamische Programmierung**: Ergebnisse für kurze Teilwörter werden wiederverwendet, um längere zu entscheiden."},{"q":"Warum braucht CYK die CNF?","a":"<p>Weil jede Regel A → BC das Wort genau an <b>einer<\/b> Stelle k in zwei Teile zerlegt. So reicht es, alle Zerlegungspunkte durchzugehen.<\/p>","q_raw":"Warum braucht CYK die CNF?","a_raw":"Weil jede Regel A → BC das Wort genau an **einer** Stelle k in zwei Teile zerlegt. So reicht es, alle Zerlegungspunkte durchzugehen."}],"frage_raw":"Erklären Sie den CYK-Algorithmus. Welche Laufzeit hat er?","antwort_raw":"\nEntscheidet das **Wortproblem für Typ 2** (Grammatik in CNF), w = a₁…aₙ:\n- Tabelle V[i, j] = Menge der Variablen, die das Teilwort der Länge j ab Position i erzeugen.\n- Länge 1: V[i, 1] = {A | A → aᵢ}.\n- Länge j: A ∈ V[i, j], wenn A → BC mit B ∈ V[i, k], C ∈ V[i+k, j−k] für ein 1 ≤ k < j.\n- w ∈ L(G) ⇔ **S ∈ V[1, n]**.\n- **O(n³)**: O(n²) Tabellenfelder mit je O(n) Zerlegungspunkten k.\n"},{"id":"cf-abschluss","kap":5,"kapitel":"Kap. 5 · Kellerautomaten und kontextfreie Sprachen","klausur":false,"erg":true,"frage":"<p>Unter welchen Operationen sind kontextfreie Sprachen abgeschlossen, unter welchen nicht?<\/p>","antwort":"<ul><li><b>Abgeschlossen<\/b> unter Vereinigung (S → S₁ | S₂), Konkatenation (S → S₁S₂) und Kleene-Stern (S → SS₁ | ε).<\/li><li><b>Nicht<\/b> unter <b>Schnitt<\/b>: \\(\\{a^nb^nc^m\\} \\cap \\{a^mb^nc^n\\} = \\{a^nb^nc^n\\}\\), beide kontextfrei, der Schnitt nicht.<\/li><li><b>Nicht<\/b> unter <b>Komplement<\/b>, sonst wegen De Morgan auch unter Schnitt.<\/li><li>Aber: Der Schnitt einer kontextfreien mit einer <b>regulären<\/b> Sprache ist kontextfrei.<\/li><\/ul>","details":"","punkte":["<b>Abgeschlossen<\/b> unter Vereinigung (S → S₁ | S₂), Konkatenation (S → S₁S₂) und Kleene-Stern (S → SS₁ | ε).","<b>Nicht<\/b> unter <b>Schnitt<\/b>: \\(\\{a^nb^nc^m\\} \\cap \\{a^mb^nc^n\\} = \\{a^nb^nc^n\\}\\), beide kontextfrei, der Schnitt nicht.","<b>Nicht<\/b> unter <b>Komplement<\/b>, sonst wegen De Morgan auch unter Schnitt.","Aber: Der Schnitt einer kontextfreien mit einer <b>regulären<\/b> Sprache ist kontextfrei."],"nachfragen":[],"frage_raw":"Unter welchen Operationen sind kontextfreie Sprachen abgeschlossen, unter welchen nicht?","antwort_raw":"\n- **Abgeschlossen** unter Vereinigung (S → S₁ | S₂), Konkatenation (S → S₁S₂) und Kleene-Stern (S → SS₁ | ε).\n- **Nicht** unter **Schnitt**: \\(\\{a^nb^nc^m\\} \\cap \\{a^mb^nc^n\\} = \\{a^nb^nc^n\\}\\), beide kontextfrei, der Schnitt nicht.\n- **Nicht** unter **Komplement**, sonst wegen De Morgan auch unter Schnitt.\n- Aber: Der Schnitt einer kontextfreien mit einer **regulären** Sprache ist kontextfrei.\n"},{"id":"tm-def","kap":6,"kapitel":"Kap. 6 · Turingmaschinen und Berechenbarkeit","klausur":false,"erg":false,"frage":"<p>Definieren Sie die (deterministische) Turingmaschine.<\/p>","antwort":"<p>M = (Z, Σ, Γ, □, δ, z₀, F, ⊗):<\/p><ul><li>Z endliche Zustände, Σ Eingabealphabet, <b>Γ ⊇ Σ<\/b> Bandalphabet<\/li><li><b>□ ∈ Γ \\ Σ<\/b> Blank (leeres Feld)<\/li><li><b>δ: Z × Γ → Z × Γ × {R, L, N}<\/b>: Zeichen überschreiben, Zustand wechseln, Kopf bewegen<\/li><li>z₀ Startzustand, F ⊆ Z Endzustände, <b>⊗ ∈ Z Ablehnungszustand<\/b><\/li><\/ul><p>Unterschied zu DFA/PDA: Das Band ist <b>unbegrenzt beschreibbar<\/b>, und der Kopf bewegt sich in <b>beide<\/b> Richtungen.<\/p>","details":"","punkte":["Z endliche Zustände, Σ Eingabealphabet, <b>Γ ⊇ Σ<\/b> Bandalphabet","<b>□ ∈ Γ \\ Σ<\/b> Blank (leeres Feld)","<b>δ: Z × Γ → Z × Γ × {R, L, N}<\/b>: Zeichen überschreiben, Zustand wechseln, Kopf bewegen","z₀ Startzustand, F ⊆ Z Endzustände, <b>⊗ ∈ Z Ablehnungszustand<\/b>"],"nachfragen":[{"q":"Wann hält eine TM?","a":"<p>Sobald sie einen Endzustand oder ⊗ erreicht, egal was auf dem Band steht und wo der Kopf ist. End- und Ablehnungszustände haben keine Übergänge.<\/p>","q_raw":"Wann hält eine TM?","a_raw":"Sobald sie einen Endzustand oder ⊗ erreicht, egal was auf dem Band steht und wo der Kopf ist. End- und Ablehnungszustände haben keine Übergänge."},{"q":"Muss δ total sein?","a":"<p>Für alle anderen Zustände: für <b>jedes<\/b> Zeichen aus Γ genau ein Übergang.<\/p>","q_raw":"Muss δ total sein?","a_raw":"Für alle anderen Zustände: für **jedes** Zeichen aus Γ genau ein Übergang."},{"q":"Was ist die Ausgabe?","a":"<p>Das Wort, das beim Halten auf dem Band steht. Eine TM kann also nicht nur entscheiden, sondern auch <b>rechnen<\/b>.<\/p>","q_raw":"Was ist die Ausgabe?","a_raw":"Das Wort, das beim Halten auf dem Band steht. Eine TM kann also nicht nur entscheiden, sondern auch **rechnen**."}],"frage_raw":"Definieren Sie die (deterministische) Turingmaschine.","antwort_raw":"\nM = (Z, Σ, Γ, □, δ, z₀, F, ⊗):\n- Z endliche Zustände, Σ Eingabealphabet, **Γ ⊇ Σ** Bandalphabet\n- **□ ∈ Γ \\ Σ** Blank (leeres Feld)\n- **δ: Z × Γ → Z × Γ × {R, L, N}**: Zeichen überschreiben, Zustand wechseln, Kopf bewegen\n- z₀ Startzustand, F ⊆ Z Endzustände, **⊗ ∈ Z Ablehnungszustand**\n\nUnterschied zu DFA/PDA: Das Band ist **unbegrenzt beschreibbar**, und der Kopf bewegt sich in **beide** Richtungen.\n"},{"id":"tm-verhalten","kap":6,"kapitel":"Kap. 6 · Turingmaschinen und Berechenbarkeit","klausur":false,"erg":false,"frage":"<p>Welche drei Verhaltensweisen kann eine TM bei Eingabe w zeigen? Warum ist das so wichtig?<\/p>","antwort":"<ol><li>Sie erreicht einen <b>Endzustand<\/b> und hält ⇒ akzeptiert.<\/li><li>Sie erreicht <b>⊗<\/b> und hält ⇒ lehnt ab.<\/li><li>Sie hält <b>nie<\/b> (Endlosschleife).<\/li><\/ol><p>Wichtig: Von außen kann man Fall 3 nicht von „rechnet noch“ unterscheiden. Daher kommen Semi-Entscheidbarkeit und das Halteproblem.<\/p>","details":"","punkte":["Sie erreicht einen <b>Endzustand<\/b> und hält ⇒ akzeptiert.","Sie erreicht <b>⊗<\/b> und hält ⇒ lehnt ab.","Sie hält <b>nie<\/b> (Endlosschleife)."],"nachfragen":[{"q":"Beispiel aus der VL?","a":"<p>Beispiel 2 pendelt bei Eingabe 011 endlos zwischen z₂ und z₃ hin und her (zwischen den Blanks).<\/p>","q_raw":"Beispiel aus der VL?","a_raw":"Beispiel 2 pendelt bei Eingabe 011 endlos zwischen z₂ und z₃ hin und her (zwischen den Blanks)."}],"frage_raw":"Welche drei Verhaltensweisen kann eine TM bei Eingabe w zeigen? Warum ist das so wichtig?","antwort_raw":"\n1. Sie erreicht einen **Endzustand** und hält ⇒ akzeptiert.\n2. Sie erreicht **⊗** und hält ⇒ lehnt ab.\n3. Sie hält **nie** (Endlosschleife).\n\nWichtig: Von außen kann man Fall 3 nicht von „rechnet noch“ unterscheiden. Daher kommen Semi-Entscheidbarkeit und das Halteproblem.\n"},{"id":"tm-semi","kap":6,"kapitel":"Kap. 6 · Turingmaschinen und Berechenbarkeit","klausur":false,"erg":false,"frage":"<p>Was ist der Unterschied zwischen semi-entscheidbar und entscheidbar?<\/p>","antwort":"<ul><li><b>Semi-entscheidbar<\/b> (rekursiv aufzählbar): Es gibt eine TM M mit L(M) = L, d. h. w ∈ L ⇒ M hält nach endlich vielen Schritten im Endzustand. Für w ∉ L darf M ablehnen <b>oder endlos laufen<\/b>.<\/li><li><b>Entscheidbar:<\/b> Es gibt eine TM M mit L(M) = L, die zusätzlich für <b>jedes<\/b> w ∉ L nach endlich vielen Schritten ⊗ erreicht, also <b>immer hält<\/b>.<\/li><li>Entscheidbar ⇒ semi-entscheidbar, aber nicht umgekehrt (Halteproblem).<\/li><\/ul>","details":"","punkte":["<b>Semi-entscheidbar<\/b> (rekursiv aufzählbar): Es gibt eine TM M mit L(M) = L, d. h. w ∈ L ⇒ M hält nach endlich vielen Schritten im Endzustand. Für w ∉ L darf M ablehnen <b>oder endlos laufen<\/b>.","<b>Entscheidbar:<\/b> Es gibt eine TM M mit L(M) = L, die zusätzlich für <b>jedes<\/b> w ∉ L nach endlich vielen Schritten ⊗ erreicht, also <b>immer hält<\/b>.","Entscheidbar ⇒ semi-entscheidbar, aber nicht umgekehrt (Halteproblem)."],"nachfragen":[{"q":"Warum „semi“?","a":"<p>Solange M rechnet, weiß man nicht, ob noch ein „Ja“ kommt oder ob sie endlos läuft. Man bekommt nur die positive Hälfte sicher.<\/p>","q_raw":"Warum „semi“?","a_raw":"Solange M rechnet, weiß man nicht, ob noch ein „Ja“ kommt oder ob sie endlos läuft. Man bekommt nur die positive Hälfte sicher."},{"q":"Welche Sprachen sind genau die semi-entscheidbaren?","a":"<p>Die <b>Typ-0-Sprachen<\/b>: L ist Typ 0 ⇔ L wird von einer TM akzeptiert.<\/p>","q_raw":"Welche Sprachen sind genau die semi-entscheidbaren?","a_raw":"Die **Typ-0-Sprachen**: L ist Typ 0 ⇔ L wird von einer TM akzeptiert."},{"q":"Wie hängen L und sein Komplement zusammen? (Ergänzung)","a":"<p>L ist entscheidbar ⇔ L <b>und<\/b> \\(\\overline{L}\\) sind semi-entscheidbar: Beide TMs schrittweise abwechselnd laufen lassen, eine hält sicher.<\/p>","q_raw":"Wie hängen L und sein Komplement zusammen? (Ergänzung)","a_raw":"L ist entscheidbar ⇔ L **und** \\(\\overline{L}\\) sind semi-entscheidbar: Beide TMs schrittweise abwechselnd laufen lassen, eine hält sicher."}],"frage_raw":"Was ist der Unterschied zwischen semi-entscheidbar und entscheidbar?","antwort_raw":"\n- **Semi-entscheidbar** (rekursiv aufzählbar): Es gibt eine TM M mit L(M) = L, d. h. w ∈ L ⇒ M hält nach endlich vielen Schritten im Endzustand. Für w ∉ L darf M ablehnen **oder endlos laufen**.\n- **Entscheidbar:** Es gibt eine TM M mit L(M) = L, die zusätzlich für **jedes** w ∉ L nach endlich vielen Schritten ⊗ erreicht, also **immer hält**.\n- Entscheidbar ⇒ semi-entscheidbar, aber nicht umgekehrt (Halteproblem).\n"},{"id":"tm-berechenbar","kap":6,"kapitel":"Kap. 6 · Turingmaschinen und Berechenbarkeit","klausur":false,"erg":false,"frage":"<p>Was bedeutet Turing-berechenbar? Was ist eine Konfiguration?<\/p>","antwort":"<ul><li><b>Konfiguration<\/b> k = (g, z, g′) ∈ Γ* × Z × Γ*: g links vom Kopf, z Zustand, g′ ab der Kopfposition. Schritt: k ⊢ k′.<\/li><li>Start (□, z₀, w) bzw. (ε, z₀, w), Endkonfiguration (g, zₑ, g′) mit zₑ ∈ F.<\/li><li><b>f: Σ* → Γ* ist Turing-berechenbar<\/b>, wenn es eine TM gibt, die für <b>jedes<\/b> w nach endlich vielen Schritten mit gg′ = f(w) im Endzustand hält.<\/li><li>Zahlenfunktionen ℕ → ℕ über eine Kodierung, z. B. <b>unär<\/b> (Σ = {1}) oder <b>binär<\/b>.<\/li><\/ul>","details":"","punkte":["<b>Konfiguration<\/b> k = (g, z, g′) ∈ Γ* × Z × Γ*: g links vom Kopf, z Zustand, g′ ab der Kopfposition. Schritt: k ⊢ k′.","Start (□, z₀, w) bzw. (ε, z₀, w), Endkonfiguration (g, zₑ, g′) mit zₑ ∈ F.","<b>f: Σ* → Γ* ist Turing-berechenbar<\/b>, wenn es eine TM gibt, die für <b>jedes<\/b> w nach endlich vielen Schritten mit gg′ = f(w) im Endzustand hält.","Zahlenfunktionen ℕ → ℕ über eine Kodierung, z. B. <b>unär<\/b> (Σ = {1}) oder <b>binär<\/b>."],"nachfragen":[{"q":"Beispiel aus der VL?","a":"<p>f(x) = 2x unär: erste 1 mit X markieren, ans Ende laufen und ein X anhängen, zurück zur nächsten 1, …; zum Schluss alle X in 1 umwandeln.<\/p>","q_raw":"Beispiel aus der VL?","a_raw":"f(x) = 2x unär: erste 1 mit X markieren, ans Ende laufen und ein X anhängen, zurück zur nächsten 1, …; zum Schluss alle X in 1 umwandeln."}],"frage_raw":"Was bedeutet Turing-berechenbar? Was ist eine Konfiguration?","antwort_raw":"\n- **Konfiguration** k = (g, z, g′) ∈ Γ* × Z × Γ*: g links vom Kopf, z Zustand, g′ ab der Kopfposition. Schritt: k ⊢ k′.\n- Start (□, z₀, w) bzw. (ε, z₀, w), Endkonfiguration (g, zₑ, g′) mit zₑ ∈ F.\n- **f: Σ* → Γ* ist Turing-berechenbar**, wenn es eine TM gibt, die für **jedes** w nach endlich vielen Schritten mit gg′ = f(w) im Endzustand hält.\n- Zahlenfunktionen ℕ → ℕ über eine Kodierung, z. B. **unär** (Σ = {1}) oder **binär**.\n"},{"id":"tm-chi","kap":6,"kapitel":"Kap. 6 · Turingmaschinen und Berechenbarkeit","klausur":false,"erg":false,"frage":"<p>Was ist die charakteristische Funktion einer Sprache, und welcher Zusammenhang besteht zur Entscheidbarkeit?<\/p>","antwort":"<ul><li>\\(\\chi_L: \\Sigma^* \\to \\{0, 1\\}\\) mit \\(\\chi_L(w) = 1\\) für w ∈ L, sonst 0.<\/li><li><b>Satz:<\/b> \\(\\chi_L\\) ist Turing-berechenbar ⇔ L ist entscheidbar.<\/li><li>⇒: Die TM schreibt 1 bzw. 0 und hält, also entsprechend in Endzustand bzw. ⊗ gehen. ⇐: Der Entscheider schreibt beim Halten 1 bzw. 0.<\/li><li>Deshalb sind „berechenbar“ und „entscheidbar“ äquivalente Begriffe. Entscheidbar bezieht sich auf Ja/Nein-Probleme wie das Wortproblem.<\/li><\/ul>","details":"","punkte":["\\(\\chi_L: \\Sigma^* \\to \\{0, 1\\}\\) mit \\(\\chi_L(w) = 1\\) für w ∈ L, sonst 0.","<b>Satz:<\/b> \\(\\chi_L\\) ist Turing-berechenbar ⇔ L ist entscheidbar.","⇒: Die TM schreibt 1 bzw. 0 und hält, also entsprechend in Endzustand bzw. ⊗ gehen. ⇐: Der Entscheider schreibt beim Halten 1 bzw. 0.","Deshalb sind „berechenbar“ und „entscheidbar“ äquivalente Begriffe. Entscheidbar bezieht sich auf Ja/Nein-Probleme wie das Wortproblem."],"nachfragen":[{"q":"Was ist mit der „halben“ charakteristischen Funktion? (Ergänzung)","a":"<p>Ist sie nur für w ∈ L definiert (1), sonst undefiniert, entspricht ihre Berechenbarkeit genau der Semi-Entscheidbarkeit.<\/p>","q_raw":"Was ist mit der „halben“ charakteristischen Funktion? (Ergänzung)","a_raw":"Ist sie nur für w ∈ L definiert (1), sonst undefiniert, entspricht ihre Berechenbarkeit genau der Semi-Entscheidbarkeit."}],"frage_raw":"Was ist die charakteristische Funktion einer Sprache, und welcher Zusammenhang besteht zur Entscheidbarkeit?","antwort_raw":"\n- \\(\\chi_L: \\Sigma^* \\to \\{0, 1\\}\\) mit \\(\\chi_L(w) = 1\\) für w ∈ L, sonst 0.\n- **Satz:** \\(\\chi_L\\) ist Turing-berechenbar ⇔ L ist entscheidbar.\n- ⇒: Die TM schreibt 1 bzw. 0 und hält, also entsprechend in Endzustand bzw. ⊗ gehen. ⇐: Der Entscheider schreibt beim Halten 1 bzw. 0.\n- Deshalb sind „berechenbar“ und „entscheidbar“ äquivalente Begriffe. Entscheidbar bezieht sich auf Ja/Nein-Probleme wie das Wortproblem.\n"},{"id":"tm-church","kap":6,"kapitel":"Kap. 6 · Turingmaschinen und Berechenbarkeit","klausur":false,"erg":false,"frage":"<p>Was besagt die Church-Turing-These? Warum ist sie kein Satz?<\/p>","antwort":"<ul><li><b>These:<\/b> Die Turing-berechenbaren Funktionen sind genau die <b>intuitiv berechenbaren<\/b> Funktionen (die, für die es einen Algorithmus gibt).<\/li><li>Ein <b>Algorithmus<\/b> ist eine endliche Folge endlicher Arbeitsschritte. Jeder Schritt lässt sich als Zustandsänderung einer TM umsetzen.<\/li><li><b>Kein Satz<\/b>, weil „intuitiv berechenbar“ kein mathematisch definierter Begriff ist. Man kann sie nicht beweisen, nur stützen.<\/li><\/ul>","details":"","punkte":["<b>These:<\/b> Die Turing-berechenbaren Funktionen sind genau die <b>intuitiv berechenbaren<\/b> Funktionen (die, für die es einen Algorithmus gibt).","Ein <b>Algorithmus<\/b> ist eine endliche Folge endlicher Arbeitsschritte. Jeder Schritt lässt sich als Zustandsänderung einer TM umsetzen.","<b>Kein Satz<\/b>, weil „intuitiv berechenbar“ kein mathematisch definierter Begriff ist. Man kann sie nicht beweisen, nur stützen."],"nachfragen":[{"q":"Was spricht für die These? (Ergänzung)","a":"<p>Alle bisher vorgeschlagenen Berechnungsmodelle (λ-Kalkül, WHILE-Programme, μ-rekursive Funktionen, Registermaschinen, Programmiersprachen) sind gleich mächtig wie TMs.<\/p>","q_raw":"Was spricht für die These? (Ergänzung)","a_raw":"Alle bisher vorgeschlagenen Berechnungsmodelle (λ-Kalkül, WHILE-Programme, μ-rekursive Funktionen, Registermaschinen, Programmiersprachen) sind gleich mächtig wie TMs."},{"q":"Was folgt daraus für die VL?","a":"<p>Aussagen über TMs gelten für <b>alle<\/b> Algorithmen: Was keine TM kann, kann kein Computer und keine Programmiersprache.<\/p>","q_raw":"Was folgt daraus für die VL?","a_raw":"Aussagen über TMs gelten für **alle** Algorithmen: Was keine TM kann, kann kein Computer und keine Programmiersprache."}],"frage_raw":"Was besagt die Church-Turing-These? Warum ist sie kein Satz?","antwort_raw":"\n- **These:** Die Turing-berechenbaren Funktionen sind genau die **intuitiv berechenbaren** Funktionen (die, für die es einen Algorithmus gibt).\n- Ein **Algorithmus** ist eine endliche Folge endlicher Arbeitsschritte. Jeder Schritt lässt sich als Zustandsänderung einer TM umsetzen.\n- **Kein Satz**, weil „intuitiv berechenbar“ kein mathematisch definierter Begriff ist. Man kann sie nicht beweisen, nur stützen.\n"},{"id":"diag-beweis","kap":6,"kapitel":"Kap. 6 · Turingmaschinen und Berechenbarkeit","klausur":true,"erg":false,"frage":"<p>Zeigen Sie mit Diagonalisierung, dass es nicht berechenbare Funktionen gibt.<\/p>","antwort":"<ul><li>𝔽₁ = Menge aller (totalen) berechenbaren Funktionen ℕ → ℕ. Abzählbar, also aufzählbar als f₁, f₂, f₃, …<\/li><li>Matrix: Zeile i = fᵢ, Spalte j = Argument, Eintrag fᵢ(j).<\/li><li>Definiere <b>g(x) = 0, falls fₓ(x) ≠ 0, und g(x) = 1, falls fₓ(x) = 0<\/b>. g ändert die Diagonale ab.<\/li><li>Dann gilt g ≠ fₓ für jedes x, weil g(x) ≠ fₓ(x). Also g ∉ 𝔽₁.<\/li><li>Wäre die Aufzählung berechenbar, wäre auch g berechenbar und müsste in 𝔽₁ vorkommen ↯. Ergebnis: <b>Es gibt mindestens eine nicht berechenbare Funktion.<\/b><\/li><\/ul>","details":"<p>Mitschrift: Stünde g in Zeile k, müsste g(k) = fₖ(k) gelten. Das ist nach Konstruktion von g unmöglich (aus 0 wird 1 und umgekehrt).<\/p>","punkte":["𝔽₁ = Menge aller (totalen) berechenbaren Funktionen ℕ → ℕ. Abzählbar, also aufzählbar als f₁, f₂, f₃, …","Matrix: Zeile i = fᵢ, Spalte j = Argument, Eintrag fᵢ(j).","Definiere <b>g(x) = 0, falls fₓ(x) ≠ 0, und g(x) = 1, falls fₓ(x) = 0<\/b>. g ändert die Diagonale ab.","Dann gilt g ≠ fₓ für jedes x, weil g(x) ≠ fₓ(x). Also g ∉ 𝔽₁.","Wäre die Aufzählung berechenbar, wäre auch g berechenbar und müsste in 𝔽₁ vorkommen ↯. Ergebnis: <b>Es gibt mindestens eine nicht berechenbare Funktion.<\/b>"],"nachfragen":[{"q":"Was ist die Kernaussage dahinter?","a":"<p>Es gibt nur <b>abzählbar<\/b> viele berechenbare Funktionen, aber <b>überabzählbar<\/b> viele Funktionen ℕ → ℕ.<\/p>","q_raw":"Was ist die Kernaussage dahinter?","a_raw":"Es gibt nur **abzählbar** viele berechenbare Funktionen, aber **überabzählbar** viele Funktionen ℕ → ℕ."},{"q":"Wo kommt Diagonalisierung noch vor?","a":"<p>Bei Cantor (ℝ überabzählbar) und beim <b>Halteproblem<\/b>: Dort tut die konstruierte TM M<sub>w<\/sub> das Gegenteil der Diagonale.<\/p>","q_raw":"Wo kommt Diagonalisierung noch vor?","a_raw":"Bei Cantor (ℝ überabzählbar) und beim **Halteproblem**: Dort tut die konstruierte TM M_w das Gegenteil der Diagonale."}],"frage_raw":"Zeigen Sie mit Diagonalisierung, dass es nicht berechenbare Funktionen gibt.","antwort_raw":"\n- 𝔽₁ = Menge aller (totalen) berechenbaren Funktionen ℕ → ℕ. Abzählbar, also aufzählbar als f₁, f₂, f₃, …\n- Matrix: Zeile i = fᵢ, Spalte j = Argument, Eintrag fᵢ(j).\n- Definiere **g(x) = 0, falls fₓ(x) ≠ 0, und g(x) = 1, falls fₓ(x) = 0**. g ändert die Diagonale ab.\n- Dann gilt g ≠ fₓ für jedes x, weil g(x) ≠ fₓ(x). Also g ∉ 𝔽₁.\n- Wäre die Aufzählung berechenbar, wäre auch g berechenbar und müsste in 𝔽₁ vorkommen ↯. Ergebnis: **Es gibt mindestens eine nicht berechenbare Funktion.**\n"},{"id":"diag-abzaehl","kap":6,"kapitel":"Kap. 6 · Turingmaschinen und Berechenbarkeit","klausur":false,"erg":false,"frage":"<p>Begründen Sie über die Church-Turing-These, warum es nur abzählbar viele berechenbare Funktionen gibt.<\/p>","antwort":"<ul><li>Jede berechenbare Funktion hat einen Algorithmus, also gibt es höchstens so viele berechenbare Funktionen wie Algorithmen.<\/li><li>Jeder Algorithmus ist ein <b>endlicher Text<\/b>, also ein Wort über einem festen Alphabet.<\/li><li>\\(\\Sigma^* = \\bigcup_i \\Sigma^i\\) ist abzählbar ⇒ nur abzählbar viele Algorithmen ⇒ nur abzählbar viele berechenbare Funktionen.<\/li><li>Die Menge aller Funktionen ℕ → ℕ ist überabzählbar ⇒ fast alle Funktionen sind nicht berechenbar.<\/li><\/ul>","details":"","punkte":["Jede berechenbare Funktion hat einen Algorithmus, also gibt es höchstens so viele berechenbare Funktionen wie Algorithmen.","Jeder Algorithmus ist ein <b>endlicher Text<\/b>, also ein Wort über einem festen Alphabet.","\\(\\Sigma^* = \\bigcup_i \\Sigma^i\\) ist abzählbar ⇒ nur abzählbar viele Algorithmen ⇒ nur abzählbar viele berechenbare Funktionen.","Die Menge aller Funktionen ℕ → ℕ ist überabzählbar ⇒ fast alle Funktionen sind nicht berechenbar."],"nachfragen":[],"frage_raw":"Begründen Sie über die Church-Turing-These, warum es nur abzählbar viele berechenbare Funktionen gibt.","antwort_raw":"\n- Jede berechenbare Funktion hat einen Algorithmus, also gibt es höchstens so viele berechenbare Funktionen wie Algorithmen.\n- Jeder Algorithmus ist ein **endlicher Text**, also ein Wort über einem festen Alphabet.\n- \\(\\Sigma^* = \\bigcup_i \\Sigma^i\\) ist abzählbar ⇒ nur abzählbar viele Algorithmen ⇒ nur abzählbar viele berechenbare Funktionen.\n- Die Menge aller Funktionen ℕ → ℕ ist überabzählbar ⇒ fast alle Funktionen sind nicht berechenbar.\n"},{"id":"utm","kap":6,"kapitel":"Kap. 6 · Turingmaschinen und Berechenbarkeit","klausur":false,"erg":false,"frage":"<p>Was ist eine universelle Turingmaschine, und wie ist sie aufgebaut?<\/p>","antwort":"<p>Eine TM U, die <b>jede<\/b> TM M auf jeder Eingabe w simulieren kann (das Modell eines programmierbaren Computers).<\/p><ul><li>Band 1: Kodierung von δ<sub>M<\/sub> als 5-Tupel (z, a, z′, b, X), getrennt durch □<\/li><li>Band 2: Eingabe w (wird während der Simulation verändert)<\/li><li>Band 3: aktueller Zustand von M<\/li><li><b>Simulationsschritt:<\/b> Zeichen a von Band 2 und Zustand z von Band 3 lesen. Ist z = zₑ oder ⊗, hält U. Sonst passendes Tupel (z, a, …) auf Band 1 suchen, Band 2 und 3 aktualisieren, Kopf auf Band 2 bewegen.<\/li><li>Hält M auf w, hält U; läuft M endlos, läuft auch U endlos.<\/li><\/ul>","details":"","punkte":["Band 1: Kodierung von δ<sub>M<\/sub> als 5-Tupel (z, a, z′, b, X), getrennt durch □","Band 2: Eingabe w (wird während der Simulation verändert)","Band 3: aktueller Zustand von M","<b>Simulationsschritt:<\/b> Zeichen a von Band 2 und Zustand z von Band 3 lesen. Ist z = zₑ oder ⊗, hält U. Sonst passendes Tupel (z, a, …) auf Band 1 suchen, Band 2 und 3 aktualisieren, Kopf auf Band 2 bewegen.","Hält M auf w, hält U; läuft M endlos, läuft auch U endlos."],"nachfragen":[{"q":"Warum genügt Σ = {0,1}, Γ = {0,1,□}?","a":"<p>Jedes Alphabet lässt sich binär kodieren; die Simulation bleibt korrekt.<\/p>","q_raw":"Warum genügt Σ = {0,1}, Γ = {0,1,□}?","a_raw":"Jedes Alphabet lässt sich binär kodieren; die Simulation bleibt korrekt."},{"q":"Was hat die UTM mit dem Halteproblem zu tun?","a":"<p>Mit U ist das Halteproblem <b>semi-entscheidbar<\/b>: c<sub>M<\/sub> $ w einlesen, M auf w simulieren, bei Halten akzeptieren. Entscheiden kann man es nicht (nächstes Kapitel).<\/p>","q_raw":"Was hat die UTM mit dem Halteproblem zu tun?","a_raw":"Mit U ist das Halteproblem **semi-entscheidbar**: c_M $ w einlesen, M auf w simulieren, bei Halten akzeptieren. Entscheiden kann man es nicht (nächstes Kapitel)."},{"q":"Warum ist eine Mehrband-TM erlaubt? (Ergänzung)","a":"<p>Jede k-Band-TM lässt sich durch eine 1-Band-TM simulieren (mit höchstens quadratischem Zeitaufwand). Die Mächtigkeit ändert sich nicht.<\/p>","q_raw":"Warum ist eine Mehrband-TM erlaubt? (Ergänzung)","a_raw":"Jede k-Band-TM lässt sich durch eine 1-Band-TM simulieren (mit höchstens quadratischem Zeitaufwand). Die Mächtigkeit ändert sich nicht."}],"frage_raw":"Was ist eine universelle Turingmaschine, und wie ist sie aufgebaut?","antwort_raw":"\nEine TM U, die **jede** TM M auf jeder Eingabe w simulieren kann (das Modell eines programmierbaren Computers).\n- Band 1: Kodierung von δ_M als 5-Tupel (z, a, z′, b, X), getrennt durch □\n- Band 2: Eingabe w (wird während der Simulation verändert)\n- Band 3: aktueller Zustand von M\n- **Simulationsschritt:** Zeichen a von Band 2 und Zustand z von Band 3 lesen. Ist z = zₑ oder ⊗, hält U. Sonst passendes Tupel (z, a, …) auf Band 1 suchen, Band 2 und 3 aktualisieren, Kopf auf Band 2 bewegen.\n- Hält M auf w, hält U; läuft M endlos, läuft auch U endlos.\n"},{"id":"tm-kodierung","kap":6,"kapitel":"Kap. 6 · Turingmaschinen und Berechenbarkeit","klausur":false,"erg":false,"frage":"<p>Wie kann man Turingmaschinen als Wörter darstellen, und wozu braucht man das?<\/p>","antwort":"<ul><li>Zustände und Zeichen durchnummerieren und binär kodieren; jeden Übergang δ(z, a) = (z′, b, X) als 5-Tupel schreiben, alle Tupel hintereinander. Das ergibt <b>c<sub>M<\/sub> ∈ {0,1}<\/b>*.<\/li><li>Folgen: TMs lassen sich <b>aufzählen<\/b> (M₁, M₂, …) und als <b>Eingabe<\/b> anderer TMs verwenden.<\/li><li>Grundlage für UTM, Diagonalisierung, Halteproblem (\\(c_M \\$ w\\)) und den Satz von Rice.<\/li><\/ul>","details":"","punkte":["Zustände und Zeichen durchnummerieren und binär kodieren; jeden Übergang δ(z, a) = (z′, b, X) als 5-Tupel schreiben, alle Tupel hintereinander. Das ergibt <b>c<sub>M<\/sub> ∈ {0,1}<\/b>*.","Folgen: TMs lassen sich <b>aufzählen<\/b> (M₁, M₂, …) und als <b>Eingabe<\/b> anderer TMs verwenden.","Grundlage für UTM, Diagonalisierung, Halteproblem (\\(c_M \\$ w\\)) und den Satz von Rice."],"nachfragen":[],"frage_raw":"Wie kann man Turingmaschinen als Wörter darstellen, und wozu braucht man das?","antwort_raw":"\n- Zustände und Zeichen durchnummerieren und binär kodieren; jeden Übergang δ(z, a) = (z′, b, X) als 5-Tupel schreiben, alle Tupel hintereinander. Das ergibt **c_M ∈ {0,1}***.\n- Folgen: TMs lassen sich **aufzählen** (M₁, M₂, …) und als **Eingabe** anderer TMs verwenden.\n- Grundlage für UTM, Diagonalisierung, Halteproblem (\\(c_M \\$ w\\)) und den Satz von Rice.\n"},{"id":"hp-def","kap":7,"kapitel":"Kap. 7 · Halteproblem, Reduktion, Satz von Rice","klausur":false,"erg":false,"frage":"<p>Formulieren Sie das Halteproblem informell und formal.<\/p>","antwort":"<ul><li>Informell: Gegeben ein Programm und eine Eingabe w. <b>Hält<\/b> das Programm bei Eingabe w an?<\/li><li>Formal mit Kodierung c<sub>M<\/sub> ∈ {0,1}* einer TM M und Trennsymbol $:<\/li><\/ul><p>\\[L_H = \\{c_M \\$ w \\mid c_M \\text{ kodiert eine TM } M \\text{ und } M \\text{ hält bei Eingabe } w \\text{ an}\\}\\]<\/p><ul><li>Als Wortproblem: Ist ein gegebenes Wort \\(c_M \\$ w \\in L_H\\)?<\/li><li><b>Satz:<\/b> L<sub>H<\/sub> ist <b>unentscheidbar<\/b>.<\/li><\/ul>","details":"","punkte":["Informell: Gegeben ein Programm und eine Eingabe w. <b>Hält<\/b> das Programm bei Eingabe w an?","Formal mit Kodierung c<sub>M<\/sub> ∈ {0,1}* einer TM M und Trennsymbol $:","Als Wortproblem: Ist ein gegebenes Wort \\(c_M \\$ w \\in L_H\\)?","<b>Satz:<\/b> L<sub>H<\/sub> ist <b>unentscheidbar<\/b>."],"nachfragen":[{"q":"Ist L<sub>H<\/sub> wenigstens semi-entscheidbar? (Ergänzung)","a":"<p>Ja: Mit der UTM M auf w simulieren und akzeptieren, sobald M hält. Hält M nie, läuft die Simulation endlos, und das ist bei Semi-Entscheidbarkeit erlaubt.<\/p>","q_raw":"Ist L_H wenigstens semi-entscheidbar? (Ergänzung)","a_raw":"Ja: Mit der UTM M auf w simulieren und akzeptieren, sobald M hält. Hält M nie, läuft die Simulation endlos, und das ist bei Semi-Entscheidbarkeit erlaubt."},{"q":"Was folgt dann für das Komplement? (Ergänzung)","a":"<p>\\(\\overline{L_H}\\) ist <b>nicht einmal semi-entscheidbar<\/b>: Sonst wären L<sub>H<\/sub> und sein Komplement semi-entscheidbar, und L<sub>H<\/sub> wäre entscheidbar ↯.<\/p>","q_raw":"Was folgt dann für das Komplement? (Ergänzung)","a_raw":"\\(\\overline{L_H}\\) ist **nicht einmal semi-entscheidbar**: Sonst wären L_H und sein Komplement semi-entscheidbar, und L_H wäre entscheidbar ↯."}],"frage_raw":"Formulieren Sie das Halteproblem informell und formal.","antwort_raw":"\n- Informell: Gegeben ein Programm und eine Eingabe w. **Hält** das Programm bei Eingabe w an?\n- Formal mit Kodierung c_M ∈ {0,1}* einer TM M und Trennsymbol $:\n\\[L_H = \\{c_M \\$ w \\mid c_M \\text{ kodiert eine TM } M \\text{ und } M \\text{ hält bei Eingabe } w \\text{ an}\\}\\]\n- Als Wortproblem: Ist ein gegebenes Wort \\(c_M \\$ w \\in L_H\\)?\n- **Satz:** L_H ist **unentscheidbar**.\n"},{"id":"hp-beweis","kap":7,"kapitel":"Kap. 7 · Halteproblem, Reduktion, Satz von Rice","klausur":true,"erg":false,"frage":"<p>Beweisen Sie, dass das Halteproblem unentscheidbar ist.<\/p>","antwort":"<ol><li><b>Annahme:<\/b> Eine TM M<sub>H<\/sub> entscheidet L<sub>H<\/sub> (hält immer).<\/li><li>Alle TMs M₁, M₂, … und alle Eingaben w₁, w₂, … lassen sich binär kodieren und aufzählen.<\/li><li>Mit M<sub>H<\/sub> ergibt sich eine (gedachte) Matrix \\(A_{i,j} = 1\\), falls \\(M_i\\) auf \\(w_j\\) hält, sonst 0. Betrachtet wird nur die <b>Diagonale<\/b>.<\/li><li>Konstruiere mit M<sub>H<\/sub> eine TM <b>M<sub>w<\/sub><\/b>: Bei Eingabe wᵢ berechnet sie \\(A_{i,i}\\) und geht in eine **Endlosschleife, falls \\(A_{i,i} = 1\\)<b>, und <\/b>hält, falls \\(A_{i,i} = 0\\)**.<\/li><li>M<sub>w<\/sub> ist eine TM, steht also in einer Zeile k. Was ist \\(A_{k,k}\\)?<ul><li>\\(A_{k,k} = 1\\) ⇒ M<sub>w<\/sub> müsste auf w<sub>k<\/sub> halten, läuft aber nach Konstruktion endlos.<\/li><li>\\(A_{k,k} = 0\\) ⇒ M<sub>w<\/sub> müsste endlos laufen, hält aber nach Konstruktion.<\/li><\/ul><\/li><li>Widerspruch ⇒ M<sub>H<\/sub> existiert nicht. □<\/li><\/ol>","details":"<p>Gleichwertige Kurzform (Selbstanwendung, Ergänzung): Konstruiere D: „Bei Eingabe c<sub>M<\/sub>: falls M<sub>H<\/sub>(c<sub>M<\/sub> $ c<sub>M<\/sub>) = ja, laufe endlos, sonst halte.“ Dann hält D auf c<sub>D<\/sub> genau dann, wenn D auf c<sub>D<\/sub> nicht hält ↯.<\/p>","punkte":["<b>Annahme:<\/b> Eine TM M<sub>H<\/sub> entscheidet L<sub>H<\/sub> (hält immer).","Alle TMs M₁, M₂, … und alle Eingaben w₁, w₂, … lassen sich binär kodieren und aufzählen.","Mit M<sub>H<\/sub> ergibt sich eine (gedachte) Matrix \\(A_{i,j} = 1\\), falls \\(M_i\\) auf \\(w_j\\) hält, sonst 0. Betrachtet wird nur die <b>Diagonale<\/b>.","Konstruiere mit M<sub>H<\/sub> eine TM <b>M<sub>w<\/sub><\/b>: Bei Eingabe wᵢ berechnet sie \\(A_{i,i}\\) und geht in eine **Endlosschleife, falls \\(A_{i,i} = 1\\)<b>, und <\/b>hält, falls \\(A_{i,i} = 0\\)**.","M<sub>w<\/sub> ist eine TM, steht also in einer Zeile k. Was ist \\(A_{k,k}\\)?<br>· \\(A_{k,k} = 1\\) ⇒ M<sub>w<\/sub> müsste auf w<sub>k<\/sub> halten, läuft aber nach Konstruktion endlos.<br>· \\(A_{k,k} = 0\\) ⇒ M<sub>w<\/sub> müsste endlos laufen, hält aber nach Konstruktion.","Widerspruch ⇒ M<sub>H<\/sub> existiert nicht. □"],"nachfragen":[{"q":"Warum ist M<sub>w<\/sub> eine gültige TM?","a":"<p>Sie benutzt nur M<sub>H<\/sub> (nach Annahme eine TM, die immer hält) als Unterprogramm plus eine triviale Endlosschleife. Das ist eine endliche Konstruktion.<\/p>","q_raw":"Warum ist M_w eine gültige TM?","a_raw":"Sie benutzt nur M_H (nach Annahme eine TM, die immer hält) als Unterprogramm plus eine triviale Endlosschleife. Das ist eine endliche Konstruktion."},{"q":"Was ist die Rolle der Diagonale?","a":"<p>Wie bei Cantor: Man konstruiert ein Objekt, das sich von jeder Zeile an der Diagonalstelle unterscheidet, also in keiner Zeile stehen kann. Es ist aber selbst eine TM und müsste vorkommen.<\/p>","q_raw":"Was ist die Rolle der Diagonale?","a_raw":"Wie bei Cantor: Man konstruiert ein Objekt, das sich von jeder Zeile an der Diagonalstelle unterscheidet, also in keiner Zeile stehen kann. Es ist aber selbst eine TM und müsste vorkommen."},{"q":"Was bedeutet das praktisch?","a":"<p>Es gibt kein allgemeines Verfahren, das für <b>jedes<\/b> Programm und <b>jede<\/b> Eingabe entscheidet, ob es terminiert. Für einzelne Programme kann man es oft trotzdem zeigen.<\/p>","q_raw":"Was bedeutet das praktisch?","a_raw":"Es gibt kein allgemeines Verfahren, das für **jedes** Programm und **jede** Eingabe entscheidet, ob es terminiert. Für einzelne Programme kann man es oft trotzdem zeigen."}],"frage_raw":"Beweisen Sie, dass das Halteproblem unentscheidbar ist.","antwort_raw":"\n1. **Annahme:** Eine TM M_H entscheidet L_H (hält immer).\n2. Alle TMs M₁, M₂, … und alle Eingaben w₁, w₂, … lassen sich binär kodieren und aufzählen.\n3. Mit M_H ergibt sich eine (gedachte) Matrix \\(A_{i,j} = 1\\), falls \\(M_i\\) auf \\(w_j\\) hält, sonst 0. Betrachtet wird nur die **Diagonale**.\n4. Konstruiere mit M_H eine TM **M_w**: Bei Eingabe wᵢ berechnet sie \\(A_{i,i}\\) und geht in eine **Endlosschleife, falls \\(A_{i,i} = 1\\)**, und **hält, falls \\(A_{i,i} = 0\\)**.\n5. M_w ist eine TM, steht also in einer Zeile k. Was ist \\(A_{k,k}\\)?\n   - \\(A_{k,k} = 1\\) ⇒ M_w müsste auf w_k halten, läuft aber nach Konstruktion endlos.\n   - \\(A_{k,k} = 0\\) ⇒ M_w müsste endlos laufen, hält aber nach Konstruktion.\n6. Widerspruch ⇒ M_H existiert nicht. □\n"},{"id":"red-def","kap":7,"kapitel":"Kap. 7 · Halteproblem, Reduktion, Satz von Rice","klausur":false,"erg":false,"frage":"<p>Was ist eine Reduktion L<sub>A<\/sub> ≤ L<sub>B<\/sub>? Welche Schlüsse erlaubt sie?<\/p>","antwort":"<ul><li><b>L<sub>A<\/sub> ≤ L<sub>B<\/sub><\/b>, wenn es eine <b>totale, berechenbare<\/b> Funktion f: Σ* → Σ* gibt mit<\/li><\/ul><p>\\[\\forall w \\in \\Sigma^*: \\ w \\in L_A \\iff f(w) \\in L_B\\]<\/p><ul><li>Folgerungen:<ul><li>L<sub>B<\/sub> entscheidbar ⇒ L<sub>A<\/sub> entscheidbar<\/li><li>L<sub>A<\/sub> unentscheidbar ⇒ L<sub>B<\/sub> unentscheidbar (Kontraposition)<\/li><\/ul><\/li><li>Lesart: „L<sub>A<\/sub> ist nicht schwerer als L<sub>B<\/sub>.“<\/li><\/ul>","details":"","punkte":["<b>L<sub>A<\/sub> ≤ L<sub>B<\/sub><\/b>, wenn es eine <b>totale, berechenbare<\/b> Funktion f: Σ* → Σ* gibt mit","Folgerungen:<br>· L<sub>B<\/sub> entscheidbar ⇒ L<sub>A<\/sub> entscheidbar<br>· L<sub>A<\/sub> unentscheidbar ⇒ L<sub>B<\/sub> unentscheidbar (Kontraposition)","Lesart: „L<sub>A<\/sub> ist nicht schwerer als L<sub>B<\/sub>.“"],"nachfragen":[{"q":"In welche Richtung reduziert man, um L<sub>B<\/sub> als unentscheidbar zu zeigen?","a":"<p>Ein <b>bekannt<\/b> unentscheidbares Problem (z. B. L<sub>H<\/sub>) <b>auf das neue<\/b> Problem L<sub>B<\/sub>: <b>L<sub>H<\/sub> ≤ L<sub>B<\/sub><\/b>. Die umgekehrte Richtung beweist nichts.<\/p>","q_raw":"In welche Richtung reduziert man, um L_B als unentscheidbar zu zeigen?","a_raw":"Ein **bekannt** unentscheidbares Problem (z. B. L_H) **auf das neue** Problem L_B: **L_H ≤ L_B**. Die umgekehrte Richtung beweist nichts."},{"q":"Warum muss f total und berechenbar sein?","a":"<p>Der Entscheider für L<sub>A<\/sub> berechnet zuerst f(w). Das muss immer in endlicher Zeit klappen, sonst hält er nicht.<\/p>","q_raw":"Warum muss f total und berechenbar sein?","a_raw":"Der Entscheider für L_A berechnet zuerst f(w). Das muss immer in endlicher Zeit klappen, sonst hält er nicht."},{"q":"Warum „w ∈ L<sub>A<\/sub> ⇔ f(w) ∈ L<sub>B<\/sub>“ und nicht nur „⇒“?","a":"<p>Auch Nein-Instanzen müssen auf Nein-Instanzen abgebildet werden, sonst würde der Entscheider falsche Ja-Antworten übernehmen.<\/p>","q_raw":"Warum „w ∈ L_A ⇔ f(w) ∈ L_B“ und nicht nur „⇒“?","a_raw":"Auch Nein-Instanzen müssen auf Nein-Instanzen abgebildet werden, sonst würde der Entscheider falsche Ja-Antworten übernehmen."}],"frage_raw":"Was ist eine Reduktion L_A ≤ L_B? Welche Schlüsse erlaubt sie?","antwort_raw":"\n- **L_A ≤ L_B**, wenn es eine **totale, berechenbare** Funktion f: Σ* → Σ* gibt mit\n\\[\\forall w \\in \\Sigma^*: \\ w \\in L_A \\iff f(w) \\in L_B\\]\n- Folgerungen:\n  - L_B entscheidbar ⇒ L_A entscheidbar\n  - L_A unentscheidbar ⇒ L_B unentscheidbar (Kontraposition)\n- Lesart: „L_A ist nicht schwerer als L_B.“\n"},{"id":"red-lemma","kap":7,"kapitel":"Kap. 7 · Halteproblem, Reduktion, Satz von Rice","klausur":false,"erg":false,"frage":"<p>Beweisen Sie: Ist L<sub>A<\/sub> ≤ L<sub>B<\/sub> und L<sub>B<\/sub> entscheidbar, dann ist L<sub>A<\/sub> entscheidbar.<\/p>","antwort":"<ul><li>Sei M<sub>B<\/sub> ein Entscheider für L<sub>B<\/sub> und f die Reduktionsfunktion (berechnet von einer TM M<sub>f<\/sub>).<\/li><li>Konstruiere M<sub>A<\/sub>: Bei Eingabe w berechne f(w) mit M<sub>f<\/sub> (hält, da f total und berechenbar), starte M<sub>B<\/sub> auf f(w) (hält immer) und übernimm die Antwort.<\/li><li><b>Korrekt:<\/b> M<sub>A<\/sub> akzeptiert w ⇔ M<sub>B<\/sub> akzeptiert f(w) ⇔ f(w) ∈ L<sub>B<\/sub> ⇔ w ∈ L<sub>A<\/sub>. M<sub>A<\/sub> hält immer ⇒ L<sub>A<\/sub> entscheidbar. □<\/li><li>Die zweite Aussage ist die Kontraposition.<\/li><\/ul>","details":"","punkte":["Sei M<sub>B<\/sub> ein Entscheider für L<sub>B<\/sub> und f die Reduktionsfunktion (berechnet von einer TM M<sub>f<\/sub>).","Konstruiere M<sub>A<\/sub>: Bei Eingabe w berechne f(w) mit M<sub>f<\/sub> (hält, da f total und berechenbar), starte M<sub>B<\/sub> auf f(w) (hält immer) und übernimm die Antwort.","<b>Korrekt:<\/b> M<sub>A<\/sub> akzeptiert w ⇔ M<sub>B<\/sub> akzeptiert f(w) ⇔ f(w) ∈ L<sub>B<\/sub> ⇔ w ∈ L<sub>A<\/sub>. M<sub>A<\/sub> hält immer ⇒ L<sub>A<\/sub> entscheidbar. □","Die zweite Aussage ist die Kontraposition."],"nachfragen":[],"frage_raw":"Beweisen Sie: Ist L_A ≤ L_B und L_B entscheidbar, dann ist L_A entscheidbar.","antwort_raw":"\n- Sei M_B ein Entscheider für L_B und f die Reduktionsfunktion (berechnet von einer TM M_f).\n- Konstruiere M_A: Bei Eingabe w berechne f(w) mit M_f (hält, da f total und berechenbar), starte M_B auf f(w) (hält immer) und übernimm die Antwort.\n- **Korrekt:** M_A akzeptiert w ⇔ M_B akzeptiert f(w) ⇔ f(w) ∈ L_B ⇔ w ∈ L_A. M_A hält immer ⇒ L_A entscheidbar. □\n- Die zweite Aussage ist die Kontraposition.\n"},{"id":"red-leeresband","kap":7,"kapitel":"Kap. 7 · Halteproblem, Reduktion, Satz von Rice","klausur":false,"erg":false,"frage":"<p>Zeigen Sie, dass das Halteproblem auf leerem Band unentscheidbar ist.<\/p>","antwort":"<p>\\(L_\\varepsilon = \\{c_M \\mid M \\text{ hält bei Eingabe } \\varepsilon\\}\\). Zeige <b>L<sub>H<\/sub> ≤ L<sub>ε<\/sub><\/b>:<\/p><ul><li>Zu M und w konstruiere <b>M<sub>x<\/sub><\/b>: Bei Eingabe x simuliert M<sub>x<\/sub> das Verhalten von M auf wx. Für x = ε verhält sich M<sub>x<\/sub> also wie M auf w. Konkret: w aufs Band schreiben, dann M starten.<\/li><li>f(c<sub>M<\/sub> $ w) = c<sub>M<sub>x<\/sub><\/sub> ist berechenbar (rein syntaktische Konstruktion).<\/li><li>c<sub>M<\/sub> $ w ∈ L<sub>H<\/sub> ⇔ M hält auf w ⇔ M<sub>x<\/sub> hält auf ε ⇔ c<sub>M<sub>x<\/sub><\/sub> ∈ L<sub>ε<\/sub>.<\/li><li>Wäre L<sub>ε<\/sub> entscheidbar, dann auch L<sub>H<\/sub> ↯ ⇒ L<sub>ε<\/sub> unentscheidbar. □<\/li><\/ul>","details":"","punkte":["Zu M und w konstruiere <b>M<sub>x<\/sub><\/b>: Bei Eingabe x simuliert M<sub>x<\/sub> das Verhalten von M auf wx. Für x = ε verhält sich M<sub>x<\/sub> also wie M auf w. Konkret: w aufs Band schreiben, dann M starten.","f(c<sub>M<\/sub> $ w) = c<sub>M<sub>x<\/sub><\/sub> ist berechenbar (rein syntaktische Konstruktion).","c<sub>M<\/sub> $ w ∈ L<sub>H<\/sub> ⇔ M hält auf w ⇔ M<sub>x<\/sub> hält auf ε ⇔ c<sub>M<sub>x<\/sub><\/sub> ∈ L<sub>ε<\/sub>.","Wäre L<sub>ε<\/sub> entscheidbar, dann auch L<sub>H<\/sub> ↯ ⇒ L<sub>ε<\/sub> unentscheidbar. □"],"nachfragen":[{"q":"Muss M<sub>x<\/sub> tatsächlich ausgeführt werden, um f zu berechnen?","a":"<p>Nein. f baut nur die <b>Beschreibung<\/b> von M<sub>x<\/sub> zusammen. Das hält immer, auch wenn M<sub>x<\/sub> selbst nie hält.<\/p>","q_raw":"Muss M_x tatsächlich ausgeführt werden, um f zu berechnen?","a_raw":"Nein. f baut nur die **Beschreibung** von M_x zusammen. Das hält immer, auch wenn M_x selbst nie hält."}],"frage_raw":"Zeigen Sie, dass das Halteproblem auf leerem Band unentscheidbar ist.","antwort_raw":"\n\\(L_\\varepsilon = \\{c_M \\mid M \\text{ hält bei Eingabe } \\varepsilon\\}\\). Zeige **L_H ≤ L_ε**:\n- Zu M und w konstruiere **M_x**: Bei Eingabe x simuliert M_x das Verhalten von M auf wx. Für x = ε verhält sich M_x also wie M auf w. Konkret: w aufs Band schreiben, dann M starten.\n- f(c_M $ w) = c_{M_x} ist berechenbar (rein syntaktische Konstruktion).\n- c_M $ w ∈ L_H ⇔ M hält auf w ⇔ M_x hält auf ε ⇔ c_{M_x} ∈ L_ε.\n- Wäre L_ε entscheidbar, dann auch L_H ↯ ⇒ L_ε unentscheidbar. □\n"},{"id":"rice-satz","kap":7,"kapitel":"Kap. 7 · Halteproblem, Reduktion, Satz von Rice","klausur":false,"erg":false,"frage":"<p>Formulieren Sie den Satz von Rice und skizzieren Sie den Beweis.<\/p>","antwort":"<ul><li>𝔽 = Menge der Turing-berechenbaren Funktionen, E ⊆ 𝔽 eine <b>nicht-triviale<\/b> Eigenschaft: <b>∅ ≠ E ≠ 𝔽<\/b>.<\/li><li><b>Satz:<\/b> \\(L_E = \\{c_M \\mid \\text{die von } M \\text{ berechnete Funktion liegt in } E\\}\\) ist <b>unentscheidbar<\/b>.<\/li><li><b>Beweisidee:<\/b> Reduktion vom Halteproblem. O. B. d. A. liegt die überall undefinierte Funktion Ω nicht in E (sonst Komplement betrachten). Wähle f ∈ E mit TM M<sub>f<\/sub>. Zu M, w baue M′: Bei Eingabe x zuerst M auf w simulieren, danach f(x) berechnen.<ul><li>M hält auf w ⇒ M′ berechnet f ∈ E<\/li><li>M hält nicht ⇒ M′ berechnet Ω ∉ E<\/li><\/ul><\/li><li>Also L<sub>H<\/sub> ≤ L<sub>E<\/sub> ⇒ L<sub>E<\/sub> unentscheidbar.<\/li><\/ul>","details":"<p>Zitat (H. G. Rice, 1953): „Es ist hoffnungslos, irgendeinen Aspekt des funktionalen Verhaltens einer Turing-Maschine algorithmisch zu bestimmen.“<\/p><p>Beispiele nicht-trivialer Eigenschaften: f ist konstant, f liefert nur gerade Zahlen, f ist bijektiv, f(0) = 0, …<\/p>","punkte":["𝔽 = Menge der Turing-berechenbaren Funktionen, E ⊆ 𝔽 eine <b>nicht-triviale<\/b> Eigenschaft: <b>∅ ≠ E ≠ 𝔽<\/b>.","<b>Satz:<\/b> \\(L_E = \\{c_M \\mid \\text{die von } M \\text{ berechnete Funktion liegt in } E\\}\\) ist <b>unentscheidbar<\/b>.","<b>Beweisidee:<\/b> Reduktion vom Halteproblem. O. B. d. A. liegt die überall undefinierte Funktion Ω nicht in E (sonst Komplement betrachten). Wähle f ∈ E mit TM M<sub>f<\/sub>. Zu M, w baue M′: Bei Eingabe x zuerst M auf w simulieren, danach f(x) berechnen.<br>· M hält auf w ⇒ M′ berechnet f ∈ E<br>· M hält nicht ⇒ M′ berechnet Ω ∉ E","Also L<sub>H<\/sub> ≤ L<sub>E<\/sub> ⇒ L<sub>E<\/sub> unentscheidbar."],"nachfragen":[{"q":"Was heißt „nicht-trivial“?","a":"<p>Mindestens eine berechenbare Funktion hat die Eigenschaft und mindestens eine nicht. Triviale Eigenschaften (alle oder keine) sind trivial entscheidbar.<\/p>","q_raw":"Was heißt „nicht-trivial“?","a_raw":"Mindestens eine berechenbare Funktion hat die Eigenschaft und mindestens eine nicht. Triviale Eigenschaften (alle oder keine) sind trivial entscheidbar."},{"q":"Wofür gilt Rice <b>nicht<\/b>?","a":"<p>Für <b>syntaktische<\/b> Eigenschaften der Maschine (z. B. „M hat 5 Zustände“, „M schreibt nie X“): Rice betrifft nur das <b>Ein-/Ausgabeverhalten<\/b>.<\/p>","q_raw":"Wofür gilt Rice **nicht**?","a_raw":"Für **syntaktische** Eigenschaften der Maschine (z. B. „M hat 5 Zustände“, „M schreibt nie X“): Rice betrifft nur das **Ein-/Ausgabeverhalten**."},{"q":"Heißt das, man kann kein einziges Programm verifizieren?","a":"<p>Nein. Es gibt nur <b>kein allgemeines Verfahren für alle<\/b> Programme. Für konkrete Programme sind Korrektheitsbeweise oft möglich.<\/p>","q_raw":"Heißt das, man kann kein einziges Programm verifizieren?","a_raw":"Nein. Es gibt nur **kein allgemeines Verfahren für alle** Programme. Für konkrete Programme sind Korrektheitsbeweise oft möglich."}],"frage_raw":"Formulieren Sie den Satz von Rice und skizzieren Sie den Beweis.","antwort_raw":"\n- 𝔽 = Menge der Turing-berechenbaren Funktionen, E ⊆ 𝔽 eine **nicht-triviale** Eigenschaft: **∅ ≠ E ≠ 𝔽**.\n- **Satz:** \\(L_E = \\{c_M \\mid \\text{die von } M \\text{ berechnete Funktion liegt in } E\\}\\) ist **unentscheidbar**.\n- **Beweisidee:** Reduktion vom Halteproblem. O. B. d. A. liegt die überall undefinierte Funktion Ω nicht in E (sonst Komplement betrachten). Wähle f ∈ E mit TM M_f. Zu M, w baue M′: Bei Eingabe x zuerst M auf w simulieren, danach f(x) berechnen.\n  - M hält auf w ⇒ M′ berechnet f ∈ E\n  - M hält nicht ⇒ M′ berechnet Ω ∉ E\n- Also L_H ≤ L_E ⇒ L_E unentscheidbar.\n"},{"id":"rice-folgen","kap":7,"kapitel":"Kap. 7 · Halteproblem, Reduktion, Satz von Rice","klausur":false,"erg":false,"frage":"<p>Welche praktisch wichtigen Probleme sind nach Rice unentscheidbar?<\/p>","antwort":"<ul><li><b>Äquivalenzproblem:<\/b> Gegeben M₁, M₂. Gilt L(M₁) = L(M₂) bzw. berechnen beide dasselbe?<\/li><li><b>Korrektheitsproblem:<\/b> Gegeben M und eine Spezifikation f. Berechnet M genau f?<\/li><li>Weitere: Ist L(M) leer? Ist L(M) endlich? Ist L(M) regulär? Hält M auf <b>allen<\/b> Eingaben?<\/li><li>Konsequenz für die Softwaretechnik: Vollautomatische Verifikation beliebiger Programme ist unmöglich. Werkzeuge arbeiten mit Näherungen (z. B. Abstraktion, Testen, interaktive Beweise).<\/li><\/ul>","details":"","punkte":["<b>Äquivalenzproblem:<\/b> Gegeben M₁, M₂. Gilt L(M₁) = L(M₂) bzw. berechnen beide dasselbe?","<b>Korrektheitsproblem:<\/b> Gegeben M und eine Spezifikation f. Berechnet M genau f?","Weitere: Ist L(M) leer? Ist L(M) endlich? Ist L(M) regulär? Hält M auf <b>allen<\/b> Eingaben?","Konsequenz für die Softwaretechnik: Vollautomatische Verifikation beliebiger Programme ist unmöglich. Werkzeuge arbeiten mit Näherungen (z. B. Abstraktion, Testen, interaktive Beweise)."],"nachfragen":[],"frage_raw":"Welche praktisch wichtigen Probleme sind nach Rice unentscheidbar?","antwort_raw":"\n- **Äquivalenzproblem:** Gegeben M₁, M₂. Gilt L(M₁) = L(M₂) bzw. berechnen beide dasselbe?\n- **Korrektheitsproblem:** Gegeben M und eine Spezifikation f. Berechnet M genau f?\n- Weitere: Ist L(M) leer? Ist L(M) endlich? Ist L(M) regulär? Hält M auf **allen** Eingaben?\n- Konsequenz für die Softwaretechnik: Vollautomatische Verifikation beliebiger Programme ist unmöglich. Werkzeuge arbeiten mit Näherungen (z. B. Abstraktion, Testen, interaktive Beweise).\n"},{"id":"lz-warum","kap":8,"kapitel":"Kap. 8 · Laufzeitanalyse, Landau, Mastertheorem","klausur":false,"erg":false,"frage":"<p>Wie misst man den Aufwand eines Algorithmus, und warum nicht einfach in Sekunden?<\/p>","antwort":"<ul><li>Physikalische Laufzeit hängt von Hardware, Programmiersprache und Implementierung ab: <b>kein guter Maßstab<\/b>.<\/li><li>Stattdessen: Anzahl <b>relevanter Rechenschritte<\/b> (Vergleiche, einfache arithmetische Operationen), jeder gleich teuer. Bei TMs: Kopfbewegungen.<\/li><li>In Abhängigkeit von der <b>Eingabegröße n<\/b>, im <b>schlimmsten Fall<\/b> (Worst Case) und <b>asymptotisch<\/b> (nur die Größenordnung zählt, Konstanten werden ignoriert).<\/li><li>Ressourcen: Zeit, Speicher, Kommunikation.<\/li><\/ul>","details":"","punkte":["Physikalische Laufzeit hängt von Hardware, Programmiersprache und Implementierung ab: <b>kein guter Maßstab<\/b>.","Stattdessen: Anzahl <b>relevanter Rechenschritte<\/b> (Vergleiche, einfache arithmetische Operationen), jeder gleich teuer. Bei TMs: Kopfbewegungen.","In Abhängigkeit von der <b>Eingabegröße n<\/b>, im <b>schlimmsten Fall<\/b> (Worst Case) und <b>asymptotisch<\/b> (nur die Größenordnung zählt, Konstanten werden ignoriert).","Ressourcen: Zeit, Speicher, Kommunikation."],"nachfragen":[{"q":"Warum Worst Case?","a":"<p>Er liefert eine <b>Garantie<\/b> für jede Eingabe der Größe n. Der Average Case braucht eine Annahme über die Eingabeverteilung.<\/p>","q_raw":"Warum Worst Case?","a_raw":"Er liefert eine **Garantie** für jede Eingabe der Größe n. Der Average Case braucht eine Annahme über die Eingabeverteilung."},{"q":"Beispiel Selection Sort?","a":"<p>(n−1) + (n−2) + … + 1 = n(n−1)/2 Vergleiche ⇒ Θ(n²), und zwar für <b>jede<\/b> Eingabe, weil immer alle Paare verglichen werden.<\/p>","q_raw":"Beispiel Selection Sort?","a_raw":"(n−1) + (n−2) + … + 1 = n(n−1)/2 Vergleiche ⇒ Θ(n²), und zwar für **jede** Eingabe, weil immer alle Paare verglichen werden."}],"frage_raw":"Wie misst man den Aufwand eines Algorithmus, und warum nicht einfach in Sekunden?","antwort_raw":"\n- Physikalische Laufzeit hängt von Hardware, Programmiersprache und Implementierung ab: **kein guter Maßstab**.\n- Stattdessen: Anzahl **relevanter Rechenschritte** (Vergleiche, einfache arithmetische Operationen), jeder gleich teuer. Bei TMs: Kopfbewegungen.\n- In Abhängigkeit von der **Eingabegröße n**, im **schlimmsten Fall** (Worst Case) und **asymptotisch** (nur die Größenordnung zählt, Konstanten werden ignoriert).\n- Ressourcen: Zeit, Speicher, Kommunikation.\n"},{"id":"lz-O","kap":8,"kapitel":"Kap. 8 · Laufzeitanalyse, Landau, Mastertheorem","klausur":false,"erg":false,"frage":"<p>Definieren Sie O, Ω und Θ. Was bedeuten c und n₀?<\/p>","antwort":"<ul><li>\\(O(g) = \\{f \\mid \\exists c &gt; 0\\ \\exists n_0\\ \\forall n \\ge n_0: f(n) \\le c \\cdot g(n)\\}\\): f wächst <b>höchstens<\/b> so schnell wie g (obere Schranke).<\/li><li>\\(\\Omega(g) = \\{f \\mid \\exists c &gt; 0\\ \\exists n_0\\ \\forall n \\ge n_0: f(n) \\ge c \\cdot g(n)\\}\\): <b>mindestens<\/b> so schnell (untere Schranke).<\/li><li>\\(\\Theta(g) = \\{f \\mid \\exists c_1, c_2 &gt; 0\\ \\exists n_0\\ \\forall n \\ge n_0: c_1 g(n) \\le f(n) \\le c_2 g(n)\\}\\): <b>gleich schnell<\/b>.<\/li><li>c schluckt konstante Faktoren (Hardware, Details), n₀ erlaubt Ausreißer für kleine n.<\/li><li>\\(f \\in \\Theta(g) \\iff f \\in O(g) \\wedge f \\in \\Omega(g)\\).<\/li><\/ul>","details":"","punkte":["\\(O(g) = \\{f \\mid \\exists c &gt; 0\\ \\exists n_0\\ \\forall n \\ge n_0: f(n) \\le c \\cdot g(n)\\}\\): f wächst <b>höchstens<\/b> so schnell wie g (obere Schranke).","\\(\\Omega(g) = \\{f \\mid \\exists c &gt; 0\\ \\exists n_0\\ \\forall n \\ge n_0: f(n) \\ge c \\cdot g(n)\\}\\): <b>mindestens<\/b> so schnell (untere Schranke).","\\(\\Theta(g) = \\{f \\mid \\exists c_1, c_2 &gt; 0\\ \\exists n_0\\ \\forall n \\ge n_0: c_1 g(n) \\le f(n) \\le c_2 g(n)\\}\\): <b>gleich schnell<\/b>.","c schluckt konstante Faktoren (Hardware, Details), n₀ erlaubt Ausreißer für kleine n.","\\(f \\in \\Theta(g) \\iff f \\in O(g) \\wedge f \\in \\Omega(g)\\)."],"nachfragen":[{"q":"Was ist an „T(n) = O(n²)“ formal unsauber?","a":"<p>O(n²) ist eine <b>Menge<\/b> von Funktionen. Korrekt ist T(n) ∈ O(n²). Das „=“ ist eine übliche Einbahn-Schreibweise.<\/p>","q_raw":"Was ist an „T(n) = O(n²)“ formal unsauber?","a_raw":"O(n²) ist eine **Menge** von Funktionen. Korrekt ist T(n) ∈ O(n²). Das „=“ ist eine übliche Einbahn-Schreibweise."},{"q":"Ist n ∈ O(n²)?","a":"<p>Ja, O ist nur eine obere Schranke. Man sucht aber meist die <b>kleinste<\/b> obere Schranke; n ∉ Θ(n²).<\/p>","q_raw":"Ist n ∈ O(n²)?","a_raw":"Ja, O ist nur eine obere Schranke. Man sucht aber meist die **kleinste** obere Schranke; n ∉ Θ(n²)."}],"frage_raw":"Definieren Sie O, Ω und Θ. Was bedeuten c und n₀?","antwort_raw":"\n- \\(O(g) = \\{f \\mid \\exists c > 0\\ \\exists n_0\\ \\forall n \\ge n_0: f(n) \\le c \\cdot g(n)\\}\\): f wächst **höchstens** so schnell wie g (obere Schranke).\n- \\(\\Omega(g) = \\{f \\mid \\exists c > 0\\ \\exists n_0\\ \\forall n \\ge n_0: f(n) \\ge c \\cdot g(n)\\}\\): **mindestens** so schnell (untere Schranke).\n- \\(\\Theta(g) = \\{f \\mid \\exists c_1, c_2 > 0\\ \\exists n_0\\ \\forall n \\ge n_0: c_1 g(n) \\le f(n) \\le c_2 g(n)\\}\\): **gleich schnell**.\n- c schluckt konstante Faktoren (Hardware, Details), n₀ erlaubt Ausreißer für kleine n.\n- \\(f \\in \\Theta(g) \\iff f \\in O(g) \\wedge f \\in \\Omega(g)\\).\n"},{"id":"lz-bsp-O","kap":8,"kapitel":"Kap. 8 · Laufzeitanalyse, Landau, Mastertheorem","klausur":false,"erg":false,"frage":"<p>Zeigen Sie: \\(T(n) = 3n^2 - 5n + 3\\log n + \\sin(\\cos n) \\in O(n^2)\\).<\/p>","antwort":"<p>Für n ≥ 1 gilt n² ≥ n ≥ log n und n² ≥ 1 ≥ |sin(…)|. Jeden Term nach oben abschätzen:<br>\\[T(n) \\le 3n^2 + 5n^2 + 3n^2 + n^2 = 12 n^2\\]<br>Also gilt T(n) ∈ O(n²) mit <b>c = 12, n₀ = 1<\/b>.<\/p>","details":"","punkte":["<p>Für n ≥ 1 gilt n² ≥ n ≥ log n und n² ≥ 1 ≥ |sin(…)|. Jeden Term nach oben abschätzen:<br>\\[T(n) \\le 3n^2 + 5n^2 + 3n^2 + n^2 = 12 n^2\\]<br>Also gilt T(n) ∈ O(n²) mit <b>c = 12, n₀ = 1<\/b>.<\/p>"],"nachfragen":[{"q":"Und Θ? Beispiel ½n² − 3n ∈ Θ(n²)?","a":"<p>Durch n² teilen: \\(c_1 \\le \\tfrac12 - \\tfrac3n \\le c_2\\). Für n ≥ 1 reicht c₂ = ½. Für n ≥ 7 gilt \\(\\tfrac12 - \\tfrac3n \\ge \\tfrac1{14}\\), also c₁ = 1/14 und n₀ = 7.<\/p>","q_raw":"Und Θ? Beispiel ½n² − 3n ∈ Θ(n²)?","a_raw":"Durch n² teilen: \\(c_1 \\le \\tfrac12 - \\tfrac3n \\le c_2\\). Für n ≥ 1 reicht c₂ = ½. Für n ≥ 7 gilt \\(\\tfrac12 - \\tfrac3n \\ge \\tfrac1{14}\\), also c₁ = 1/14 und n₀ = 7."}],"frage_raw":"Zeigen Sie: \\(T(n) = 3n^2 - 5n + 3\\log n + \\sin(\\cos n) \\in O(n^2)\\).","antwort_raw":"\nFür n ≥ 1 gilt n² ≥ n ≥ log n und n² ≥ 1 ≥ |sin(…)|. Jeden Term nach oben abschätzen:\n\\[T(n) \\le 3n^2 + 5n^2 + 3n^2 + n^2 = 12 n^2\\]\nAlso gilt T(n) ∈ O(n²) mit **c = 12, n₀ = 1**.\n"},{"id":"lz-wachstum","kap":8,"kapitel":"Kap. 8 · Laufzeitanalyse, Landau, Mastertheorem","klausur":false,"erg":false,"frage":"<p>Ordnen Sie die typischen Wachstumsraten. Wie kann man zwei Funktionen vergleichen?<\/p>","antwort":"<p>\\[1 \\prec \\log\\log n \\prec \\log n \\prec n^\\varepsilon \\prec n^c \\prec n^{\\log n} \\prec c^n \\prec n^n \\prec c^{c^n}\\]<br>(0 &lt; ε &lt; 1 ≤ c). Dabei bedeutet f ≺ g: \\(\\lim_{n\\to\\infty} f(n)/g(n) = 0\\).<\/p><p><b>Grenzwertkriterium:<\/b> lim f/g = 0 ⇒ f ∈ O(g), aber nicht Θ; lim f/g = k ∈ (0, ∞) ⇒ f ∈ Θ(g); lim f/g = ∞ ⇒ f ∈ Ω(g), aber nicht O(g).<\/p>","details":"","punkte":["<p>\\[1 \\prec \\log\\log n \\prec \\log n \\prec n^\\varepsilon \\prec n^c \\prec n^{\\log n} \\prec c^n \\prec n^n \\prec c^{c^n}\\]<br>(0 &lt; ε &lt; 1 ≤ c). Dabei bedeutet f ≺ g: \\(\\lim_{n\\to\\infty} f(n)/g(n) = 0\\).<\/p>","<p><b>Grenzwertkriterium:<\/b> lim f/g = 0 ⇒ f ∈ O(g), aber nicht Θ; lim f/g = k ∈ (0, ∞) ⇒ f ∈ Θ(g); lim f/g = ∞ ⇒ f ∈ Ω(g), aber nicht O(g).<\/p>"],"nachfragen":[{"q":"Ist \\(2^{n+1} \\in O(2^n)\\)? Und \\(2^{2n}\\)?","a":"<p>\\(2^{n+1} = 2 \\cdot 2^n\\), also ja (c = 2). \\(2^{2n} = 4^n\\), und \\(4^n / 2^n = 2^n \\to \\infty\\), also nein.<\/p>","q_raw":"Ist \\(2^{n+1} \\in O(2^n)\\)? Und \\(2^{2n}\\)?","a_raw":"\\(2^{n+1} = 2 \\cdot 2^n\\), also ja (c = 2). \\(2^{2n} = 4^n\\), und \\(4^n / 2^n = 2^n \\to \\infty\\), also nein."},{"q":"Spielt die Basis des Logarithmus eine Rolle?","a":"<p>Nein: \\(\\log_a n = \\log_b n / \\log_b a\\) unterscheidet sich nur um einen konstanten Faktor.<\/p>","q_raw":"Spielt die Basis des Logarithmus eine Rolle?","a_raw":"Nein: \\(\\log_a n = \\log_b n / \\log_b a\\) unterscheidet sich nur um einen konstanten Faktor."}],"frage_raw":"Ordnen Sie die typischen Wachstumsraten. Wie kann man zwei Funktionen vergleichen?","antwort_raw":"\n\\[1 \\prec \\log\\log n \\prec \\log n \\prec n^\\varepsilon \\prec n^c \\prec n^{\\log n} \\prec c^n \\prec n^n \\prec c^{c^n}\\]\n(0 < ε < 1 ≤ c). Dabei bedeutet f ≺ g: \\(\\lim_{n\\to\\infty} f(n)/g(n) = 0\\).\n\n**Grenzwertkriterium:** lim f/g = 0 ⇒ f ∈ O(g), aber nicht Θ; lim f/g = k ∈ (0, ∞) ⇒ f ∈ Θ(g); lim f/g = ∞ ⇒ f ∈ Ω(g), aber nicht O(g).\n"},{"id":"lz-regeln","kap":8,"kapitel":"Kap. 8 · Laufzeitanalyse, Landau, Mastertheorem","klausur":false,"erg":false,"frage":"<p>Welche Rechenregeln gelten für die O-Notation bei der Analyse von Programmen?<\/p>","antwort":"<ul><li>Hintereinander: \\(O(f) + O(g) = O(\\max(f, g))\\)<\/li><li>Produkt: \\(O(f) \\cdot O(g) = O(f \\cdot g)\\); verschachtelt: \\(O(O(f)) = O(f)\\)<\/li><li>Elementaroperation: O(1); Fallunterscheidung: Kosten des <b>teuersten<\/b> Zweigs (plus Test)<\/li><li><b>Schleife:<\/b> Anzahl der Durchläufe × Kosten des teuersten Durchlaufs; verschachtelte Schleifen multiplizieren sich<\/li><li><b>Rekursion:<\/b> Rekurrenz aufstellen (Tiefe der Aufrufkette × Kosten), dann z. B. Mastertheorem<\/li><\/ul>","details":"","punkte":["Hintereinander: \\(O(f) + O(g) = O(\\max(f, g))\\)","Produkt: \\(O(f) \\cdot O(g) = O(f \\cdot g)\\); verschachtelt: \\(O(O(f)) = O(f)\\)","Elementaroperation: O(1); Fallunterscheidung: Kosten des <b>teuersten<\/b> Zweigs (plus Test)","<b>Schleife:<\/b> Anzahl der Durchläufe × Kosten des teuersten Durchlaufs; verschachtelte Schleifen multiplizieren sich","<b>Rekursion:<\/b> Rekurrenz aufstellen (Tiefe der Aufrufkette × Kosten), dann z. B. Mastertheorem"],"nachfragen":[],"frage_raw":"Welche Rechenregeln gelten für die O-Notation bei der Analyse von Programmen?","antwort_raw":"\n- Hintereinander: \\(O(f) + O(g) = O(\\max(f, g))\\)\n- Produkt: \\(O(f) \\cdot O(g) = O(f \\cdot g)\\); verschachtelt: \\(O(O(f)) = O(f)\\)\n- Elementaroperation: O(1); Fallunterscheidung: Kosten des **teuersten** Zweigs (plus Test)\n- **Schleife:** Anzahl der Durchläufe × Kosten des teuersten Durchlaufs; verschachtelte Schleifen multiplizieren sich\n- **Rekursion:** Rekurrenz aufstellen (Tiefe der Aufrufkette × Kosten), dann z. B. Mastertheorem\n"},{"id":"lz-mergesort","kap":8,"kapitel":"Kap. 8 · Laufzeitanalyse, Landau, Mastertheore
