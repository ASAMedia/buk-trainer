<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><meta property="og:title" content="BuK-Trainer"><meta property="og:url" content="https://asamedia.github.io/buk-trainer/"><meta property="og:image" content="https://asamedia.github.io/buk-trainer/icon-512.png"><meta property="og:description" content="Übungen zu Berechenbarkeit und Komplexität: Automaten, Pumping-Lemma, Reduktionen, Prüfungsfragen"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2847a8"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body><title>BuK-Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interaktiver Übungstrainer für Berechenbarkeit und Komplexität">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: eine ruhige Spalte wie ein Übungsblatt auf Karopapier; Bandzellen (Turingband) als Fortschrittsanzeige. */
:root {
  --paper: #f6f7fa; --grid: #e7eaf1; --card: #ffffff; --ink: #1a2030; --muted: #5b6475; --line: #d6dbe5;
  --accent: #2847a8; --accent-ink: #ffffff; --accent-soft: #e3e9f8; --head: #ffcd57; --head-ink: #3a2a00;
  --ok: #1d7448; --ok-soft: #e1f2e8; --bad: #b0382a; --bad-soft: #f8e3df; --seg-q: #ffe08a; --seg-q2: #c9dbff;
  --f-display: "IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Roboto Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11151e; --grid: #171c27; --card: #181e2a; --ink: #e6e9f1; --muted: #9aa3b5; --line: #2b3344;
  --accent: #8eaefc; --accent-ink: #0f1424; --accent-soft: #1d2741; --head: #b8901f; --head-ink: #1a1300;
  --ok: #67c793; --ok-soft: #173126; --bad: #f08c7c; --bad-soft: #3a1d19; --seg-q: #6b5714; --seg-q2: #24406f;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #11151e; --grid: #171c27; --card: #181e2a; --ink: #e6e9f1; --muted: #9aa3b5; --line: #2b3344;
  --accent: #8eaefc; --accent-ink: #0f1424; --accent-soft: #1d2741; --head: #b8901f; --head-ink: #1a1300;
  --ok: #67c793; --ok-soft: #173126; --bad: #f08c7c; --bad-soft: #3a1d19; --seg-q: #6b5714; --seg-q2: #24406f;
  color-scheme: dark; }

html, body { background: var(--paper); color: var(--ink); }
body {
  font: 16px/1.5 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
* { box-sizing: border-box; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1.15; }
h2 { font-size: 22px; line-height: 1.2; }
h3 { font-size: 18px; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.mono { font-family: var(--f-mono); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.eyebrow { font-family: var(--f-display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.bar .title { font-family: var(--f-display); font-weight: 600; font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .save { font-size: 12px; color: var(--muted); white-space: nowrap; }
.back { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 15px; }

/* surfaces */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.card.task { display: flex; flex-direction: column; gap: 10px; }
.hero { padding-block: 22px 6px; display: flex; flex-direction: column; gap: 8px; }
.group { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.mod { text-align: left; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
.mod:hover, .mod:focus-visible { border-color: var(--accent); }
.mod b { font-family: var(--f-display); font-size: 17px; font-weight: 600; }
.mod span { font-size: 14px; color: var(--muted); }

/* tape-cell progress */
.tape { display: flex; flex-wrap: wrap; gap: 0; }
.tape i { width: 14px; height: 14px; border: 1px solid var(--line); margin-right: -1px; background: var(--card); }
.tape i.on { background: var(--accent); border-color: var(--accent); }
.tape i.half { background: var(--accent-soft); }

/* buttons, inputs */
.btn { font: inherit; font-size: 15px; border-radius: 8px; padding: 7px 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .mod:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { font: inherit; font-size: 14px; border-radius: 999px; padding: 4px 11px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.chip.done::after { content: " ✓"; color: var(--ok); }
input[type=text], input[type=number], textarea, select {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
textarea { width: 100%; min-height: 140px; resize: vertical; }
input.word { font-family: var(--f-mono); flex: 1 1 160px; }
select { padding: 5px 4px; }

/* tables */
.scroll { overflow-x: auto; max-width: 100%; }
table.ed { border-collapse: collapse; font-size: 15px; }
table.ed th, table.ed td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; white-space: nowrap; }
table.ed th { font-family: var(--f-display); font-weight: 600; background: var(--accent-soft); }
table.ed td.ok { background: var(--ok-soft); }
table.ed td.bad { background: var(--bad-soft); }
table.ed td.cell { cursor: pointer; min-width: 52px; font-family: var(--f-mono); }
table.tri td.cell { min-width: 40px; height: 36px; font-size: 18px; }
table.tri td.x { color: var(--ink); font-weight: 700; }
table.tri td.na { border: none; background: transparent; }

/* feedback */
.fb { border-radius: var(--r); padding: 10px 12px; border: 1px solid var(--line); }
.fb.ok { background: var(--ok-soft); border-color: var(--ok); }
.fb.bad { background: var(--bad-soft); border-color: var(--bad); }
.fb.info { background: var(--accent-soft); border-color: var(--accent); }
.fb b.t { display: block; font-family: var(--f-display); font-size: 17px; margin-bottom: 2px; }
.ok-t { color: var(--ok); } .bad-t { color: var(--bad); }

/* words & tapes */
.wordview { font-family: var(--f-mono); font-size: 20px; letter-spacing: 1px; word-break: break-all; }
.seg { padding: 1px 0; border-radius: 3px; }
.seg.q { background: var(--seg-q); }
.seg.q2 { background: var(--seg-q2); }
.seg-l { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.tapeview { display: flex; overflow-x: auto; font-family: var(--f-mono); font-size: 19px; }
.tapeview span { min-width: 1.5em; text-align: center; border: 1px solid var(--line); margin-right: -1px; padding: 2px 0; background: var(--card); }
.tapeview span.h { background: var(--head); color: var(--head-ink); font-weight: 700; }
.log { font-family: var(--f-mono); font-size: 13px; color: var(--muted); max-height: 180px; overflow-y: auto; white-space: pre-wrap; }

/* diagrams */
svg.auto { width: 100%; height: auto; display: block; color: var(--ink); }
svg.auto .st > ellipse { fill: var(--card); stroke: currentColor; stroke-width: 1.6; }
svg.auto .st.act > ellipse:first-child { fill: var(--head); }
svg.auto .st > ellipse.ring { fill: none; }
svg.auto .st.rej > ellipse { stroke-dasharray: 4 3; }
svg.auto .edge { fill: none; stroke: currentColor; stroke-width: 1.4; }
svg.auto .ah { fill: currentColor; }
svg.auto text { fill: currentColor; font-family: var(--f-body); }
svg.auto .lbl { font-size: 13px; paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
svg.auto .stl { font-size: 14px; }
.diagram { border: 1px dashed var(--line); border-radius: var(--r); padding: 4px; background: var(--card); }

/* sorting */
.sortcard { font-size: 18px; text-align: center; padding: 18px 14px; }
.buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.buckets .btn { padding: 10px 8px; }

/* bottom sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line);
  box-shadow: 0 -6px 24px rgb(0 0 0 / .18); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-top: 14px; }
.sheet .wrap { display: flex; flex-direction: column; gap: 10px; padding-block: 0; }

/* oral */
.points li { margin: 4px 0; }
.points label { display: flex; gap: 8px; align-items: flex-start; }
.ai { white-space: pre-wrap; }
details { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; background: var(--card); }
details > summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.answer ul, .answer ol { padding-left: 1.2em; margin: 4px 0; }
.answer table { border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; }
.answer td, .answer th { border: 1px solid var(--line); padding: 3px 6px; }
@media (prefers-reduced-motion: no-preference) { .fb { animation: pop .18s ease-out; } @keyframes pop { from { transform: translateY(4px); opacity: .6 } to { transform: none; opacity: 1 } } }

/* Tagesmix, Übersicht */
.row.spread { justify-content: space-between; }
.card.today { border-color: var(--accent); }
.mod.item { gap: 4px; }
.mod.item b { font-family: var(--f-body); font-size: 16px; font-weight: 600; }
.tag { font-size: 12px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.tag.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.tag.new { color: var(--accent); border-color: var(--accent); }
ul.plain { list-style: none; padding: 0; margin: 4px 0 0; display: flex; flex-direction: column; gap: 6px; }
.fld { display: flex; flex-direction: column; gap: 3px; }
input[type=date] { font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 220px; }

/* Beweis-Puzzles */
ol.proof { list-style: none; counter-reset: s; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pstep { counter-increment: s; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px; }
.pstep::before { content: counter(s) ". "; font-weight: 700; font-family: var(--f-display); }
.pstep .row { justify-content: flex-end; margin-top: 2px; }
.pstep .btn { padding: 2px 10px; }
.pool { display: flex; flex-direction: column; gap: 8px; }
.piece { background: var(--card); border: 1px dashed var(--muted); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.piece:hover, .piece:focus-visible { border-color: var(--accent); border-style: solid; outline: none; }
.pstep select, .piece select { font-size: 15px; padding: 1px 4px; margin: 0 2px; max-width: 100%; }

/* Prüfungssimulation */
.simbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 4; background: var(--paper); padding-block: 6px; border-bottom: 1px solid var(--line); }
.timer { font-size: 18px; font-weight: 600; }
.timer.late { color: var(--bad); }
.chat { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.bubble { max-width: 88%; border-radius: 12px; padding: 8px 12px; border: 1px solid var(--line); background: var(--card); }
.bubble.exam { align-self: flex-start; border-bottom-left-radius: 3px; }
.bubble.me { align-self: flex-end; background: var(--accent-soft); border-color: var(--accent); border-bottom-right-radius: 3px; }
.bubble p { white-space: pre-wrap; }
.grade { font-family: var(--f-display); font-size: 34px; font-weight: 600; color: var(--accent); }

/* Diagramm bearbeiten */
.diagram.edit svg.auto .st { cursor: pointer; }
.diagram.edit svg.auto .st:focus { outline: none; }
.diagram.edit svg.auto .st:focus-visible > ellipse:first-child { stroke: var(--accent); stroke-width: 3; }
svg.auto .st.sel > ellipse:first-child { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 3; }
.tapbar { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-soft); }
.mod.item .row.spread { flex-wrap: nowrap; }
.mod.item .row.spread > .small { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Diagramm: Zoom, Rückgängig */
.diagbox { display: flex; flex-direction: column; gap: 4px; }
.diagtools { gap: 4px; }
.diagtools .row { gap: 4px; }
.diagtools .btn { padding: 2px 10px; font-size: 14px; }
.diagram { touch-action: pan-x pan-y; }
.diagram.zoomed { overflow: auto; max-height: 70vh; }

/* Fortschritt übertragen, Teilen, Startseite */
.sheet.tall { max-height: 88vh; overflow-y: auto; }
textarea.code { min-height: 0; font-family: var(--f-mono); font-size: 12px; word-break: break-all; }
.qr { display: flex; justify-content: center; }
.qr svg { width: 200px; height: 200px; background: #fff; padding: 8px; border-radius: 8px; }
button.save { background: none; border: 0; padding: 4px 0; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.card.intro ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }
.group.foot { margin-top: 30px; }

/* Reduktionen: Schritte mit Auswahl */
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; font: inherit; font-size: 15px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.choice:hover:not(:disabled), .choice:focus-visible { border-color: var(--accent); }
.choice:disabled { cursor: default; }
.choice.no { background: var(--bad-soft); border-color: var(--bad); color: var(--muted); text-decoration: line-through; text-decoration-color: var(--bad); }
.choice.yes { background: var(--ok-soft); border-color: var(--ok); font-weight: 600; }

/* kleine Graphen */
svg.graph { width: 100%; max-width: 200px; height: auto; display: block; margin: 0 auto; color: var(--ink); }
svg.graph.wide { max-width: 340px; }
svg.graph .ge { stroke: var(--muted); stroke-width: 1.6; }
svg.graph .ge.thin { stroke-width: 1; opacity: .45; }
svg.graph .ge.on { stroke: var(--accent); stroke-width: 3; opacity: 1; }
svg.graph .ge.bad { stroke: var(--bad); stroke-width: 2.4; stroke-dasharray: 5 3; }
svg.graph .gn circle, svg.graph .gn rect { fill: var(--card); stroke: currentColor; stroke-width: 1.5; }
svg.graph .gn.hl circle { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
svg.graph .gn.sel circle, svg.graph .gn.sel rect { fill: var(--head); stroke: var(--head-ink); }
svg.graph .gn.sel text { fill: var(--head-ink); }
svg.graph text { fill: currentColor; font-family: var(--f-body); font-size: 13px; font-weight: 600; }
svg.graph .gn[role=button] { cursor: pointer; }
svg.graph .gn:focus { outline: none; }
svg.graph .gn:focus-visible circle { stroke: var(--accent); stroke-width: 3; }
.graphs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.graphs figure { margin: 0; display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; }
.satcols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.satcol { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.chip.clash { background: var(--bad-soft); border-color: var(--bad); }

/* Myhill-Nerode */
.mncls { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.mnc { border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 64px; background: var(--paper); }
.mnc.target { border: 2px dashed var(--accent); background: var(--accent-soft); cursor: pointer; }

/* Übungsblatt 1 */
details.theory { background: var(--accent-soft); border-color: var(--accent); }
details.theory .answer { margin-top: 6px; line-height: 1.55; }
.proprow { display: flex; flex-direction: column; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.proprow .row.spread { flex-wrap: wrap; }
table.rel td { min-width: 34px; height: 30px; font-size: 16px; }
table.rel td.on { color: var(--accent); }
table.rel td.cell { cursor: pointer; }
table.rel td.add { background: var(--head); color: var(--head-ink); font-weight: 700; }
table.calc th { text-align: left; white-space: nowrap; }
table.calc td { text-align: left; white-space: normal; word-break: break-word; }
.chip.wordchip.in { background: var(--ok-soft); border-color: var(--ok); }
.chip.wordchip.out { background: var(--bad-soft); border-color: var(--bad); }
textarea.gram { min-height: 96px; font-size: 15px; }

</style>

<script>window.BUK_Q = [{"id":"g-motivation","kap":1,"kapitel":"Kap. 1 · Motivation und Grundlagen","klausur":false,"erg":false,"frage":"<p>Was sind die beiden Leitfragen der Vorlesung – und wie hängen sie zusammen?<\/p>","antwort":"<ul><li><b>Berechenbarkeit:<\/b> Ist ein Problem überhaupt algorithmisch lösbar – unabhängig von heutigen oder künftigen Computern?<\/li><li><b>Komplexität:<\/b> Wie schwer ist ein lösbares Problem? Gemessen an den <b>Ressourcen Zeit und Speicher<\/b> für eine Eingabe, nicht daran, wie schwer es ist, einen Algorithmus zu finden.<\/li><li>Einteilung: unlösbar | lösbar, aber nicht effizient („praktisch unlösbar“) | effizient lösbar.<\/li><\/ul>","details":"<p>Historisch erste Frage der Informatik: Gibt es wohldefinierte Probleme, die prinzipiell nicht automatisch lösbar sind? <b>Ja<\/b> – Alan Turing 1936 (Halteproblem).<\/p><p>Beispiele aus der VL: „Wird mein Programm jemals enden?“ (Halteproblem), „Leistet mein Programm, was es soll?“ (Korrektheit).<\/p>","punkte":["<b>Berechenbarkeit:<\/b> Ist ein Problem überhaupt algorithmisch lösbar – unabhängig von heutigen oder künftigen Computern?","<b>Komplexität:<\/b> Wie schwer ist ein lösbares Problem? Gemessen an den <b>Ressourcen Zeit und Speicher<\/b> für eine Eingabe, nicht daran, wie schwer es ist, einen Algorithmus zu finden.","Einteilung: unlösbar | lösbar, aber nicht effizient („praktisch unlösbar“) | effizient lösbar."],"nachfragen":[{"q":"Was heißt „unlösbar“ genau?","a":"<p>Es ist <b>bewiesen<\/b>, dass <b>kein<\/b> Algorithmus existieren kann – nicht bloß, dass noch keiner gefunden wurde.<\/p>","q_raw":"Was heißt „unlösbar“ genau?","a_raw":"Es ist **bewiesen**, dass **kein** Algorithmus existieren kann – nicht bloß, dass noch keiner gefunden wurde."},{"q":"Warum braucht man dafür formale Modelle?","a":"<p>Lösbarkeit zeigt man mit <b>einem<\/b> Algorithmus. Unlösbarkeit ist eine Aussage über <b>alle<\/b> denkbaren Algorithmen – das geht nur mit präzisen mathematischen Modellen (Automaten, Turingmaschinen).<\/p>","q_raw":"Warum braucht man dafür formale Modelle?","a_raw":"Lösbarkeit zeigt man mit **einem** Algorithmus. Unlösbarkeit ist eine Aussage über **alle** denkbaren Algorithmen – das geht nur mit präzisen mathematischen Modellen (Automaten, Turingmaschinen)."},{"q":"Welchen Zielkonflikt haben diese Modelle?","a":"<p>Nah an realen Computern sein (präzise Aussagen) und zugleich unabhängig von konkreter Technik (allgemeingültige Aussagen).<\/p>","q_raw":"Welchen Zielkonflikt haben diese Modelle?","a_raw":"Nah an realen Computern sein (präzise Aussagen) und zugleich unabhängig von konkreter Technik (allgemeingültige Aussagen)."}],"frage_raw":"Was sind die beiden Leitfragen der Vorlesung – und wie hängen sie zusammen?","antwort_raw":"\n- **Berechenbarkeit:** Ist ein Problem überhaupt algorithmisch lösbar – unabhängig von heutigen oder künftigen Computern?\n- **Komplexität:** Wie schwer ist ein lösbares Problem? Gemessen an den **Ressourcen Zeit und Speicher** für eine Eingabe, nicht daran, wie schwer es ist, einen Algorithmus zu finden.\n- Einteilung: unlösbar | lösbar, aber nicht effizient („praktisch unlösbar“) | effizient lösbar.\n"},{"id":"g-grammatik-vs-automat","kap":1,"kapitel":"Kap. 1 · Motivation und Grundlagen","klausur":false,"erg":false,"frage":"<p>Welche Rolle spielen formale Sprachen, Grammatiken und Automaten in der Vorlesung?<\/p>","antwort":"<ul><li><b>Formale Sprachen<\/b> sind die gemeinsame Sprache: Probleme werden als <b>Wortproblem<\/b> „Ist w ∈ L?“ formuliert.<\/li><li><b>Grammatiken<\/b> sind Abstraktionen von Programmiersprachen: Sie <b>erzeugen<\/b> Sprachen.<\/li><li><b>Automaten<\/b> sind Abstraktionen von Computern: Sie <b>akzeptieren<\/b> bzw. verwerfen Wörter.<\/li><li>Rote Linie: Je mächtiger das Modell (DFA → Kellerautomat → TM), desto größer die Sprachklasse (Chomsky-Hierarchie).<\/li><\/ul>","details":"","punkte":["<b>Formale Sprachen<\/b> sind die gemeinsame Sprache: Probleme werden als <b>Wortproblem<\/b> „Ist w ∈ L?“ formuliert.","<b>Grammatiken<\/b> sind Abstraktionen von Programmiersprachen: Sie <b>erzeugen<\/b> Sprachen.","<b>Automaten<\/b> sind Abstraktionen von Computern: Sie <b>akzeptieren<\/b> bzw. verwerfen Wörter.","Rote Linie: Je mächtiger das Modell (DFA → Kellerautomat → TM), desto größer die Sprachklasse (Chomsky-Hierarchie)."],"nachfragen":[{"q":"Warum gerade Sprachen?","a":"<p>Weil wir mit Computern über (Text-)Sprachen kommunizieren und sich fast jedes Problem – Graphen, Zahlen, Programme – als Wort kodieren lässt.<\/p>","q_raw":"Warum gerade Sprachen?","a_raw":"Weil wir mit Computern über (Text-)Sprachen kommunizieren und sich fast jedes Problem – Graphen, Zahlen, Programme – als Wort kodieren lässt."}],"frage_raw":"Welche Rolle spielen formale Sprachen, Grammatiken und Automaten in der Vorlesung?","antwort_raw":"\n- **Formale Sprachen** sind die gemeinsame Sprache: Probleme werden als **Wortproblem** „Ist w ∈ L?“ formuliert.\n- **Grammatiken** sind Abstraktionen von Programmiersprachen: Sie **erzeugen** Sprachen.\n- **Automaten** sind Abstraktionen von Computern: Sie **akzeptieren** bzw. verwerfen Wörter.\n- Rote Linie: Je mächtiger das Modell (DFA → Kellerautomat → TM), desto größer die Sprachklasse (Chomsky-Hierarchie).\n"},{"id":"g-alphabet-wort","kap":1,"kapitel":"Kap. 1 · Motivation und Grundlagen","klausur":false,"erg":false,"frage":"<p>Definieren Sie Alphabet, Wort, ε, Σⁱ und Σ*.<\/p>","antwort":"<ul><li><b>Alphabet<\/b> Σ: endliche, <b>nichtleere<\/b> Menge von Zeichen.<\/li><li><b>Wort<\/b> über Σ: endliche Folge von Zeichen aus Σ; Länge |w|.<\/li><li><b>ε<\/b>: das leere Wort, |ε| = 0. Es ist ein Wort, aber kein Zeichen aus Σ.<\/li><li>\\(\\Sigma^0 = \\{\\varepsilon\\}\\), \\(\\Sigma^1 = \\Sigma\\), \\(\\Sigma^{i+1} = \\{xy \\mid x \\in \\Sigma^i,\\ y \\in \\Sigma^1\\}\\).<\/li><li>\\(\\Sigma^* = \\bigcup_{i \\ge 0} \\Sigma^i\\): alle Wörter über Σ (inklusive ε).<\/li><\/ul>","details":"","punkte":["<b>Alphabet<\/b> Σ: endliche, <b>nichtleere<\/b> Menge von Zeichen.","<b>Wort<\/b> über Σ: endliche Folge von Zeichen aus Σ; Länge |w|.","<b>ε<\/b>: das leere Wort, |ε| = 0. Es ist ein Wort, aber kein Zeichen aus Σ.","\\(\\Sigma^0 = \\{\\varepsilon\\}\\), \\(\\Sigma^1 = \\Sigma\\), \\(\\Sigma^{i+1} = \\{xy \\mid x \\in \\Sigma^i,\\ y \\in \\Sigma^1\\}\\).","\\(\\Sigma^* = \\bigcup_{i \\ge 0} \\Sigma^i\\): alle Wörter über Σ (inklusive ε)."],"nachfragen":[{"q":"Ist Σ* endlich?","a":"<p>Nein, <b>abzählbar unendlich<\/b> (für jedes Σ ≠ ∅): man kann die Wörter der Länge nach aufzählen.<\/p>","q_raw":"Ist Σ* endlich?","a_raw":"Nein, **abzählbar unendlich** (für jedes Σ ≠ ∅): man kann die Wörter der Länge nach aufzählen."},{"q":"Unterschied ∅, {ε} und ε?","a":"<p>∅ ist die leere Sprache (kein Wort), {ε} ist die Sprache mit genau einem Wort, ε ist das leere Wort selbst.<\/p>","q_raw":"Unterschied ∅, {ε} und ε?","a_raw":"∅ ist die leere Sprache (kein Wort), {ε} ist die Sprache mit genau einem Wort, ε ist das leere Wort selbst."}],"frage_raw":"Definieren Sie Alphabet, Wort, ε, Σⁱ und Σ*.","antwort_raw":"\n- **Alphabet** Σ: endliche, **nichtleere** Menge von Zeichen.\n- **Wort** über Σ: endliche Folge von Zeichen aus Σ; Länge |w|.\n- **ε**: das leere Wort, |ε| = 0. Es ist ein Wort, aber kein Zeichen aus Σ.\n- \\(\\Sigma^0 = \\{\\varepsilon\\}\\), \\(\\Sigma^1 = \\Sigma\\), \\(\\Sigma^{i+1} = \\{xy \\mid x \\in \\Sigma^i,\\ y \\in \\Sigma^1\\}\\).\n- \\(\\Sigma^* = \\bigcup_{i \\ge 0} \\Sigma^i\\): alle Wörter über Σ (inklusive ε).\n"},{"id":"g-sprache-ueberabzaehlbar","kap":1,"kapitel":"Kap. 1 · Motivation und Grundlagen","klausur":false,"erg":false,"frage":"<p>Was ist eine formale Sprache? Warum gibt es überabzählbar viele – und was folgt daraus?<\/p>","antwort":"<ul><li><b>Formale Sprache:<\/b> jede Teilmenge L ⊆ Σ*.<\/li><li>Σ* ist abzählbar unendlich, also ist die Menge aller Sprachen \\(\\mathcal{P}(\\Sigma^*)\\) <b>überabzählbar<\/b> (Cantor).<\/li><li>Grammatiken, Automaten und Programme sind <b>endliche<\/b> Beschreibungen, davon gibt es nur <b>abzählbar<\/b> viele.<\/li><li><b>Folgerung:<\/b> Es gibt Sprachen, die von keiner Grammatik erzeugt und von keiner TM erkannt werden.<\/li><\/ul>","details":"<p>Das ist das gleiche Abzählargument wie bei den unberechenbaren Funktionen (Kap. 6): abzählbar viele Beschreibungen gegen überabzählbar viele Objekte.<\/p>","punkte":["<b>Formale Sprache:<\/b> jede Teilmenge L ⊆ Σ*.","Σ* ist abzählbar unendlich, also ist die Menge aller Sprachen \\(\\mathcal{P}(\\Sigma^*)\\) <b>überabzählbar<\/b> (Cantor).","Grammatiken, Automaten und Programme sind <b>endliche<\/b> Beschreibungen, davon gibt es nur <b>abzählbar<\/b> viele.","<b>Folgerung:<\/b> Es gibt Sprachen, die von keiner Grammatik erzeugt und von keiner TM erkannt werden."],"nachfragen":[],"frage_raw":"Was ist eine formale Sprache? Warum gibt es überabzählbar viele – und was folgt daraus?","antwort_raw":"\n- **Formale Sprache:** jede Teilmenge L ⊆ Σ*.\n- Σ* ist abzählbar unendlich, also ist die Menge aller Sprachen \\(\\mathcal{P}(\\Sigma^*)\\) **überabzählbar** (Cantor).\n- Grammatiken, Automaten und Programme sind **endliche** Beschreibungen, davon gibt es nur **abzählbar** viele.\n- **Folgerung:** Es gibt Sprachen, die von keiner Grammatik erzeugt und von keiner TM erkannt werden.\n"},{"id":"g-konkatenation","kap":1,"kapitel":"Kap. 1 · Motivation und Grundlagen","klausur":false,"erg":false,"frage":"<p>Wie sind Konkatenation, Potenz und Kleene-Abschluss für Sprachen definiert?<\/p>","antwort":"<ul><li>Wörter: x ∘ y = xy; assoziativ, ε ist neutral (εw = wε = w).<\/li><li>Sprachen: \\(L_1 \\circ L_2 = \\{w_1 w_2 \\mid w_1 \\in L_1,\\ w_2 \\in L_2\\}\\).<\/li><li>Potenzen: \\(L^0 = \\{\\varepsilon\\}\\), \\(L^{i+1} = L^i \\circ L\\).<\/li><li><b>Kleene-Abschluss:<\/b> \\(L^* = \\bigcup_{i \\ge 0} L^i = L^0 \\cup L^1 \\cup L^2 \\cup \\dots\\)<\/li><\/ul>","details":"<p>Beispiel aus der VL: L₁ = {aa, ab}, L₂ = {aa, b} ⇒ L₁L₂ = {aaaa, aab, abaa, abb}.<\/p><p>Allgemein gilt \\(|L^i| \\le |L|^i\\). Gleichheit gilt, wenn keine zwei verschiedenen Zerlegungen dasselbe Wort liefern. Beispiel L = {a, aa}: a∘aa = aa∘a, deshalb hat \\(L^n\\) nur n + 1 Wörter.<\/p>","punkte":["Wörter: x ∘ y = xy; assoziativ, ε ist neutral (εw = wε = w).","Sprachen: \\(L_1 \\circ L_2 = \\{w_1 w_2 \\mid w_1 \\in L_1,\\ w_2 \\in L_2\\}\\).","Potenzen: \\(L^0 = \\{\\varepsilon\\}\\), \\(L^{i+1} = L^i \\circ L\\).","<b>Kleene-Abschluss:<\/b> \\(L^* = \\bigcup_{i \\ge 0} L^i = L^0 \\cup L^1 \\cup L^2 \\cup \\dots\\)"],"nachfragen":[{"q":"Ist ∅* leer?","a":"<p>Nein: \\(\\emptyset^* = \\{\\varepsilon\\}\\), weil \\(L^0 = \\{\\varepsilon\\}\\) immer dazugehört.<\/p>","q_raw":"Ist ∅* leer?","a_raw":"Nein: \\(\\emptyset^* = \\{\\varepsilon\\}\\), weil \\(L^0 = \\{\\varepsilon\\}\\) immer dazugehört."},{"q":"Ist die Konkatenation kommutativ?","a":"<p>Nein, z. B. ab ≠ ba. Für Sprachen: {a}{b} = {ab} ≠ {ba} = {b}{a}.<\/p>","q_raw":"Ist die Konkatenation kommutativ?","a_raw":"Nein, z. B. ab ≠ ba. Für Sprachen: {a}{b} = {ab} ≠ {ba} = {b}{a}."}],"frage_raw":"Wie sind Konkatenation, Potenz und Kleene-Abschluss für Sprachen definiert?","antwort_raw":"\n- Wörter: x ∘ y = xy; assoziativ, ε ist neutral (εw = wε = w).\n- Sprachen: \\(L_1 \\circ L_2 = \\{w_1 w_2 \\mid w_1 \\in L_1,\\ w_2 \\in L_2\\}\\).\n- Potenzen: \\(L^0 = \\{\\varepsilon\\}\\), \\(L^{i+1} = L^i \\circ L\\).\n- **Kleene-Abschluss:** \\(L^* = \\bigcup_{i \\ge 0} L^i = L^0 \\cup L^1 \\cup L^2 \\cup \\dots\\)\n"},{"id":"g-relationen","kap":1,"kapitel":"Kap. 1 · Motivation und Grundlagen","klausur":false,"erg":false,"frage":"<p>Welche Eigenschaften von Relationen kennen Sie? Was ist eine Äquivalenzrelation, was eine Halbordnung?<\/p>","antwort":"<p>Für R ⊆ M × M:<\/p><ul><li><b>reflexiv:<\/b> (x, x) ∈ R für alle x<\/li><li><b>symmetrisch:<\/b> (x, y) ∈ R ⇒ (y, x) ∈ R<\/li><li><b>antisymmetrisch:<\/b> (x, y) ∈ R ∧ (y, x) ∈ R ⇒ x = y<\/li><li><b>transitiv:<\/b> (x, y), (y, z) ∈ R ⇒ (x, z) ∈ R<\/li><\/ul><p><b>Äquivalenzrelation<\/b> = reflexiv + symmetrisch + transitiv. <b>Halbordnung<\/b> (Ordnungsrelation) = reflexiv + antisymmetrisch + transitiv, z. B. ≤ auf ℝ.<\/p>","details":"","punkte":["<b>reflexiv:<\/b> (x, x) ∈ R für alle x","<b>symmetrisch:<\/b> (x, y) ∈ R ⇒ (y, x) ∈ R","<b>antisymmetrisch:<\/b> (x, y) ∈ R ∧ (y, x) ∈ R ⇒ x = y","<b>transitiv:<\/b> (x, y), (y, z) ∈ R ⇒ (x, z) ∈ R"],"nachfragen":[{"q":"Wo kommen Äquivalenzrelationen in der VL vor?","a":"<p>Bei Myhill-Nerode (R<sub>L<\/sub> auf Wörtern, Index = Anzahl der Klassen) und beim Minimalautomaten (Zustandsäquivalenz R<sub>M<\/sub>).<\/p>","q_raw":"Wo kommen Äquivalenzrelationen in der VL vor?","a_raw":"Bei Myhill-Nerode (R_L auf Wörtern, Index = Anzahl der Klassen) und beim Minimalautomaten (Zustandsäquivalenz R_M)."},{"q":"Schließen sich symmetrisch und antisymmetrisch aus?","a":"<p>Nein, die Identität {(x, x)} ist beides.<\/p>","q_raw":"Schließen sich symmetrisch und antisymmetrisch aus?","a_raw":"Nein, die Identität {(x, x)} ist beides."},{"q":"Wie widerlegt man eine Eigenschaft?","a":"<p>Mit <b>einem<\/b> konkreten Gegenbeispiel-Paar, z. B. (1,2), (2,3) ∈ R, aber (1,3) ∉ R ⇒ nicht transitiv.<\/p>","q_raw":"Wie widerlegt man eine Eigenschaft?","a_raw":"Mit **einem** konkreten Gegenbeispiel-Paar, z. B. (1,2), (2,3) ∈ R, aber (1,3) ∉ R ⇒ nicht transitiv."}],"frage_raw":"Welche Eigenschaften von Relationen kennen Sie? Was ist eine Äquivalenzrelation, was eine Halbordnung?","antwort_raw":"\nFür R ⊆ M × M:\n- **reflexiv:** (x, x) ∈ R für alle x\n- **symmetrisch:** (x, y) ∈ R ⇒ (y, x) ∈ R\n- **antisymmetrisch:** (x, y) ∈ R ∧ (y, x) ∈ R ⇒ x = y\n- **transitiv:** (x, y), (y, z) ∈ R ⇒ (x, z) ∈ R\n\n**Äquivalenzrelation** = reflexiv + symmetrisch + transitiv. **Halbordnung** (Ordnungsrelation) = reflexiv + antisymmetrisch + transitiv, z. B. ≤ auf ℝ.\n"},{"id":"gr-def","kap":2,"kapitel":"Kap. 2 · Grammatiken und Chomsky-Hierarchie","klausur":false,"erg":false,"frage":"<p>Definieren Sie eine Grammatik, eine Ableitung und die erzeugte Sprache.<\/p>","antwort":"<ul><li><b>Grammatik<\/b> G = (V, Σ, P, S):<ul><li>V endliche Menge von <b>Variablen<\/b>, Σ Terminalalphabet mit V ∩ Σ = ∅<\/li><li>P endliche Menge von <b>Regeln<\/b> p → q mit p, q ∈ (V ∪ Σ)*; <b>p enthält mindestens eine Variable<\/b><\/li><li>S ∈ V <b>Startvariable<\/b><\/li><\/ul><\/li><li><b>Ableitungsschritt<\/b> \\(w_1 \\vdash_G w_2\\): \\(w_1 = xpz\\), \\(w_2 = xqz\\) für eine Regel p → q. Mehrere Schritte: \\(\\vdash_G^*\\).<\/li><li><b>Erzeugte Sprache:<\/b> \\(L(G) = \\{w \\in \\Sigma^* \\mid S \\vdash_G^* w\\}\\), nur Wörter aus <b>Terminalen<\/b>.<\/li><\/ul>","details":"","punkte":["<b>Grammatik<\/b> G = (V, Σ, P, S):<br>· V endliche Menge von <b>Variablen<\/b>, Σ Terminalalphabet mit V ∩ Σ = ∅<br>· P endliche Menge von <b>Regeln<\/b> p → q mit p, q ∈ (V ∪ Σ)*; <b>p enthält mindestens eine Variable<\/b><br>· S ∈ V <b>Startvariable<\/b>","<b>Ableitungsschritt<\/b> \\(w_1 \\vdash_G w_2\\): \\(w_1 = xpz\\), \\(w_2 = xqz\\) für eine Regel p → q. Mehrere Schritte: \\(\\vdash_G^*\\).","<b>Erzeugte Sprache:<\/b> \\(L(G) = \\{w \\in \\Sigma^* \\mid S \\vdash_G^* w\\}\\), nur Wörter aus <b>Terminalen<\/b>."],"nachfragen":[{"q":"Warum muss links eine Variable stehen?","a":"<p>Sonst könnten bereits fertige Terminalwörter weiter umgeschrieben werden. Die Ableitung soll nur an Variablen weiterarbeiten.<\/p>","q_raw":"Warum muss links eine Variable stehen?","a_raw":"Sonst könnten bereits fertige Terminalwörter weiter umgeschrieben werden. Die Ableitung soll nur an Variablen weiterarbeiten."},{"q":"Wie viele Grammatiken gibt es zu einer Sprache?","a":"<p>Unendlich viele, z. B. durch nutzlose zusätzliche Variablen und Regeln.<\/p>","q_raw":"Wie viele Grammatiken gibt es zu einer Sprache?","a_raw":"Unendlich viele, z. B. durch nutzlose zusätzliche Variablen und Regeln."},{"q":"Was ist das Besondere an Grammatiken?","a":"<p>Ein <b>endliches<\/b> Objekt beschreibt eine möglicherweise <b>unendliche<\/b> Sprache.<\/p>","q_raw":"Was ist das Besondere an Grammatiken?","a_raw":"Ein **endliches** Objekt beschreibt eine möglicherweise **unendliche** Sprache."}],"frage_raw":"Definieren Sie eine Grammatik, eine Ableitung und die erzeugte Sprache.","antwort_raw":"\n- **Grammatik** G = (V, Σ, P, S):\n  - V endliche Menge von **Variablen**, Σ Terminalalphabet mit V ∩ Σ = ∅\n  - P endliche Menge von **Regeln** p → q mit p, q ∈ (V ∪ Σ)*; **p enthält mindestens eine Variable**\n  - S ∈ V **Startvariable**\n- **Ableitungsschritt** \\(w_1 \\vdash_G w_2\\): \\(w_1 = xpz\\), \\(w_2 = xqz\\) für eine Regel p → q. Mehrere Schritte: \\(\\vdash_G^*\\).\n- **Erzeugte Sprache:** \\(L(G) = \\{w \\in \\Sigma^* \\mid S \\vdash_G^* w\\}\\), nur Wörter aus **Terminalen**.\n"},{"id":"gr-chomsky","kap":2,"kapitel":"Kap. 2 · Grammatiken und Chomsky-Hierarchie","klausur":false,"erg":false,"frage":"<p>Erklären Sie die Chomsky-Hierarchie: Typen, Regelbedingungen, Automatenmodelle.<\/p>","antwort":"<table class='tab'><tr><th>Typ<\/th><th>Name<\/th><th>Bedingung an jede Regel p → q<\/th><th>Automat<\/th><\/tr><tr><td>0<\/td><td>Phrasenstruktur<\/td><td>keine<\/td><td>Turingmaschine<\/td><\/tr><tr><td>1<\/td><td>kontextsensitiv<\/td><td>\\(|p| \\le |q|\\) (Ausnahme S → ε, wenn S nie rechts steht)<\/td><td>linear beschränkte TM<\/td><\/tr><tr><td>2<\/td><td>kontextfrei<\/td><td>p ∈ V<\/td><td>Kellerautomat (NPDA)<\/td><\/tr><tr><td>3<\/td><td>regulär<\/td><td>p ∈ V, q ∈ Σ ∪ ΣV (A → a, A → aB)<\/td><td>DFA / NFA<\/td><\/tr><\/table><p>Echte Inklusionen: Typ 3 ⊊ Typ 2 ⊊ Typ 1 ⊊ Typ 0. Eine Sprache ist vom Typ k, wenn <b>eine<\/b> Grammatik vom Typ k sie erzeugt.<\/p>","details":"<p>Wortproblem-Aufwand laut VL: Typ 3 in O(n), Typ 2 in O(n³) mit CYK, Typ 1 in O(kⁿ) (k = |Σ|), Typ 0 im Allgemeinen <b>unentscheidbar<\/b>.<\/p><p>Trennende Beispiele: aⁿbⁿ ist Typ 2, nicht Typ 3. aⁿbⁿcⁿ ist Typ 1, nicht Typ 2. L<sub>H<\/sub> ist Typ 0, aber nicht Typ 1, denn Typ-1-Sprachen sind entscheidbar.<\/p>","punkte":["<table class='tab'><tr><th>Typ<\/th><th>Name<\/th><th>Bedingung an jede Regel p → q<\/th><th>Automat<\/th><\/tr><tr><td>0<\/td><td>Phrasenstruktur<\/td><td>keine<\/td><td>Turingmaschine<\/td><\/tr><tr><td>1<\/td><td>kontextsensitiv<\/td><td>\\(|p| \\le |q|\\) (Ausnahme S → ε, wenn S nie rechts steht)<\/td><td>linear beschränkte TM<\/td><\/tr><tr><td>2<\/td><td>kontextfrei<\/td><td>p ∈ V<\/td><td>Kellerautomat (NPDA)<\/td><\/tr><tr><td>3<\/td><td>regulär<\/td><td>p ∈ V, q ∈ Σ ∪ ΣV (A → a, A → aB)<\/td><td>DFA / NFA<\/td><\/tr><\/table>","<p>Echte Inklusionen: Typ 3 ⊊ Typ 2 ⊊ Typ 1 ⊊ Typ 0. Eine Sprache ist vom Typ k, wenn <b>eine<\/b> Grammatik vom Typ k sie erzeugt.<\/p>"],"nachfragen":[{"q":"Wonach ordnet die Hierarchie?","a":"<p>Nach der <b>Struktur der Produktionsregeln<\/b>: je strenger die Regelform, desto kleiner die Sprachklasse.<\/p>","q_raw":"Wonach ordnet die Hierarchie?","a_raw":"Nach der **Struktur der Produktionsregeln**: je strenger die Regelform, desto kleiner die Sprachklasse."},{"q":"Warum heißt Typ 2 „kontextfrei“?","a":"<p>Eine Variable A darf unabhängig von ihren Nachbarn ersetzt werden. Bei Typ 1 können Regeln wie aAb → aCb vom Kontext abhängen.<\/p>","q_raw":"Warum heißt Typ 2 „kontextfrei“?","a_raw":"Eine Variable A darf unabhängig von ihren Nachbarn ersetzt werden. Bei Typ 1 können Regeln wie aAb → aCb vom Kontext abhängen."},{"q":"Liegt jede Sprache in der Hierarchie?","a":"<p>Nein. Es gibt überabzählbar viele Sprachen, aber nur abzählbar viele Grammatiken. Das Komplement des Halteproblems ist nicht einmal Typ 0.<\/p>","q_raw":"Liegt jede Sprache in der Hierarchie?","a_raw":"Nein. Es gibt überabzählbar viele Sprachen, aber nur abzählbar viele Grammatiken. Das Komplement des Halteproblems ist nicht einmal Typ 0."}],"frage_raw":"Erklären Sie die Chomsky-Hierarchie: Typen, Regelbedingungen, Automatenmodelle.","antwort_raw":"\n| Typ | Name | Bedingung an jede Regel p → q | Automat |\n|---|---|---|---|\n| 0 | Phrasenstruktur | keine | Turingmaschine |\n| 1 | kontextsensitiv | \\(|p| \\le |q|\\) (Ausnahme S → ε, wenn S nie rechts steht) | linear beschränkte TM |\n| 2 | kontextfrei | p ∈ V | Kellerautomat (NPDA) |\n| 3 | regulär | p ∈ V, q ∈ Σ ∪ ΣV (A → a, A → aB) | DFA / NFA |\n\nEchte Inklusionen: Typ 3 ⊊ Typ 2 ⊊ Typ 1 ⊊ Typ 0. Eine Sprache ist vom Typ k, wenn **eine** Grammatik vom Typ k sie erzeugt.\n"},{"id":"gr-typ-grammatik-sprache","kap":2,"kapitel":"Kap. 2 · Grammatiken und Chomsky-Hierarchie","klausur":false,"erg":false,"frage":"<p>Was ist der Unterschied zwischen dem Typ einer Grammatik und dem Typ einer Sprache?<\/p>","antwort":"<ul><li>Der <b>Grammatik-Typ<\/b> ergibt sich aus der Form <b>ihrer<\/b> Regeln: der höchste Typ, dessen Bedingung alle Regeln erfüllen.<\/li><li>Der <b>Sprach-Typ<\/b> ist der höchste Typ, für den <b>irgendeine<\/b> Grammatik die Sprache erzeugt.<\/li><li>Eine Typ-2-Grammatik kann eine reguläre Sprache erzeugen, z. B. S → aSa | aa | a erzeugt a⁺. Die Grammatik ist kontextfrei, die Sprache regulär.<\/li><\/ul>","details":"","punkte":["Der <b>Grammatik-Typ<\/b> ergibt sich aus der Form <b>ihrer<\/b> Regeln: der höchste Typ, dessen Bedingung alle Regeln erfüllen.","Der <b>Sprach-Typ<\/b> ist der höchste Typ, für den <b>irgendeine<\/b> Grammatik die Sprache erzeugt.","Eine Typ-2-Grammatik kann eine reguläre Sprache erzeugen, z. B. S → aSa | aa | a erzeugt a⁺. Die Grammatik ist kontextfrei, die Sprache regulär."],"nachfragen":[{"q":"Wie bestimmt man den Typ einer gegebenen Grammatik?","a":"<p>Von Typ 3 abwärts prüfen und die erste Regel nennen, die die strengere Bedingung verletzt.<\/p>","q_raw":"Wie bestimmt man den Typ einer gegebenen Grammatik?","a_raw":"Von Typ 3 abwärts prüfen und die erste Regel nennen, die die strengere Bedingung verletzt."}],"frage_raw":"Was ist der Unterschied zwischen dem Typ einer Grammatik und dem Typ einer Sprache?","antwort_raw":"\n- Der **Grammatik-Typ** ergibt sich aus der Form **ihrer** Regeln: der höchste Typ, dessen Bedingung alle Regeln erfüllen.\n- Der **Sprach-Typ** ist der höchste Typ, für den **irgendeine** Grammatik die Sprache erzeugt.\n- Eine Typ-2-Grammatik kann eine reguläre Sprache erzeugen, z. B. S → aSa | aa | a erzeugt a⁺. Die Grammatik ist kontextfrei, die Sprache regulär.\n"},{"id":"gr-epsilon","kap":2,"kapitel":"Kap. 2 · Grammatiken und Chomsky-Hierarchie","klausur":false,"erg":false,"frage":"<p>Warum gibt es bei Typ 1 die Sonderregel für S → ε?<\/p>","antwort":"<ul><li>Typ 1 verlangt nicht verkürzende Regeln (\\(|p| \\le |q|\\)), also könnte ε nie erzeugt werden.<\/li><li>Damit Sprachen mit ε trotzdem Typ 1 sein können, ist <b>S → ε erlaubt, wenn S auf keiner rechten Regelseite vorkommt<\/b>.<\/li><li>Die Bedingung verhindert, dass ε „mitten in einer Ableitung“ Wörter verkürzt.<\/li><\/ul>","details":"","punkte":["Typ 1 verlangt nicht verkürzende Regeln (\\(|p| \\le |q|\\)), also könnte ε nie erzeugt werden.","Damit Sprachen mit ε trotzdem Typ 1 sein können, ist <b>S → ε erlaubt, wenn S auf keiner rechten Regelseite vorkommt<\/b>.","Die Bedingung verhindert, dass ε „mitten in einer Ableitung“ Wörter verkürzt."],"nachfragen":[{"q":"Ist eine Grammatik mit S → ε und S → aSb vom Typ 1?","a":"<p>Formal <b>nicht<\/b>, weil S rechts vorkommt. Sie ist Typ 2. Die Sprache aⁿbⁿ (n ≥ 0) ist trotzdem Typ 1, mit einer neuen Startvariable S′ → ε | S.<\/p>","q_raw":"Ist eine Grammatik mit S → ε und S → aSb vom Typ 1?","a_raw":"Formal **nicht**, weil S rechts vorkommt. Sie ist Typ 2. Die Sprache aⁿbⁿ (n ≥ 0) ist trotzdem Typ 1, mit einer neuen Startvariable S′ → ε | S."}],"frage_raw":"Warum gibt es bei Typ 1 die Sonderregel für S → ε?","antwort_raw":"\n- Typ 1 verlangt nicht verkürzende Regeln (\\(|p| \\le |q|\\)), also könnte ε nie erzeugt werden.\n- Damit Sprachen mit ε trotzdem Typ 1 sein können, ist **S → ε erlaubt, wenn S auf keiner rechten Regelseite vorkommt**.\n- Die Bedingung verhindert, dass ε „mitten in einer Ableitung“ Wörter verkürzt.\n"},{"id":"gr-wortproblem","kap":2,"kapitel":"Kap. 2 · Grammatiken und Chomsky-Hierarchie","klausur":false,"erg":false,"frage":"<p>Was ist das Wortproblem? Wie schwer ist es für die einzelnen Chomsky-Typen?<\/p>","antwort":"<ul><li><b>Wortproblem:<\/b> Gegeben G und w ∈ Σ*. Ist w ∈ L(G)?<\/li><li>Typ 3: <b>O(n)<\/b> (DFA liest jedes Zeichen einmal)<\/li><li>Typ 2: <b>O(n³)<\/b> (CYK-Algorithmus, Grammatik in Chomsky-Normalform)<\/li><li>Typ 1: entscheidbar, aber nur durch systematisches Ausprobieren, <b>O(kⁿ)<\/b>. Wegen \\(|p| \\le |q|\\) reicht es, Satzformen bis Länge n zu betrachten.<\/li><li>Typ 0: im Allgemeinen <b>unentscheidbar<\/b> (Halteproblem).<\/li><\/ul>","details":"","punkte":["<b>Wortproblem:<\/b> Gegeben G und w ∈ Σ*. Ist w ∈ L(G)?","Typ 3: <b>O(n)<\/b> (DFA liest jedes Zeichen einmal)","Typ 2: <b>O(n³)<\/b> (CYK-Algorithmus, Grammatik in Chomsky-Normalform)","Typ 1: entscheidbar, aber nur durch systematisches Ausprobieren, <b>O(kⁿ)<\/b>. Wegen \\(|p| \\le |q|\\) reicht es, Satzformen bis Länge n zu betrachten.","Typ 0: im Allgemeinen <b>unentscheidbar<\/b> (Halteproblem)."],"nachfragen":[{"q":"Warum ist das Wortproblem für Typ 1 überhaupt entscheidbar?","a":"<p>Ableitungen werden nie kürzer. Es gibt nur endlich viele Satzformen der Länge ≤ |w|, also kann man alle durchsuchen.<\/p>","q_raw":"Warum ist das Wortproblem für Typ 1 überhaupt entscheidbar?","a_raw":"Ableitungen werden nie kürzer. Es gibt nur endlich viele Satzformen der Länge ≤ |w|, also kann man alle durchsuchen."}],"frage_raw":"Was ist das Wortproblem? Wie schwer ist es für die einzelnen Chomsky-Typen?","antwort_raw":"\n- **Wortproblem:** Gegeben G und w ∈ Σ*. Ist w ∈ L(G)?\n- Typ 3: **O(n)** (DFA liest jedes Zeichen einmal)\n- Typ 2: **O(n³)** (CYK-Algorithmus, Grammatik in Chomsky-Normalform)\n- Typ 1: entscheidbar, aber nur durch systematisches Ausprobieren, **O(kⁿ)**. Wegen \\(|p| \\le |q|\\) reicht es, Satzformen bis Länge n zu betrachten.\n- Typ 0: im Allgemeinen **unentscheidbar** (Halteproblem).\n"},{"id":"gr-regulaer-dfa","kap":2,"kapitel":"Kap. 2 · Grammatiken und Chomsky-Hierarchie","klausur":false,"erg":false,"frage":"<p>Wie hängen reguläre Grammatiken und DFAs zusammen?<\/p>","antwort":"<p>Beide beschreiben genau die Typ-3-Sprachen; man kann direkt übersetzen:<\/p><ul><li>Variablen ↔ Zustände, Startvariable ↔ Startzustand<\/li><li>δ(A, a) = B ↦ Regel <b>A → aB<\/b>; ist zusätzlich B ∈ F, dann auch <b>A → a<\/b><\/li><li>ist der Startzustand final: S → ε (S darf rechts nicht vorkommen, sonst neue Startvariable)<\/li><li>Umgekehrt: aus A → aB eine Kante A –a→ B, aus A → a eine Kante in einen neuen Endzustand. Das ergibt zunächst einen NFA.<\/li><\/ul>","details":"","punkte":["Variablen ↔ Zustände, Startvariable ↔ Startzustand","δ(A, a) = B ↦ Regel <b>A → aB<\/b>; ist zusätzlich B ∈ F, dann auch <b>A → a<\/b>","ist der Startzustand final: S → ε (S darf rechts nicht vorkommen, sonst neue Startvariable)","Umgekehrt: aus A → aB eine Kante A –a→ B, aus A → a eine Kante in einen neuen Endzustand. Das ergibt zunächst einen NFA."],"nachfragen":[{"q":"Warum ist jede endliche Sprache regulär?","a":"<p>Für jedes Wort a₁…aₖ eine eigene Regelkette S → a₁X₁, X₁ → a₂X₂, …, Xₖ₋₁ → aₖ. Das ist Typ 3. Alternativ: Präfixbaum als DFA mit Müllzustand.<\/p>","q_raw":"Warum ist jede endliche Sprache regulär?","a_raw":"Für jedes Wort a₁…aₖ eine eigene Regelkette S → a₁X₁, X₁ → a₂X₂, …, Xₖ₋₁ → aₖ. Das ist Typ 3. Alternativ: Präfixbaum als DFA mit Müllzustand."}],"frage_raw":"Wie hängen reguläre Grammatiken und DFAs zusammen?","antwort_raw":"\nBeide beschreiben genau die Typ-3-Sprachen; man kann direkt übersetzen:\n- Variablen ↔ Zustände, Startvariable ↔ Startzustand\n- δ(A, a) = B ↦ Regel **A → aB**; ist zusätzlich B ∈ F, dann auch **A → a**\n- ist der Startzustand final: S → ε (S darf rechts nicht vorkommen, sonst neue Startvariable)\n- Umgekehrt: aus A → aB eine Kante A –a→ B, aus A → a eine Kante in einen neuen Endzustand. Das ergibt zunächst einen NFA.\n"},{"id":"ea-dfa-def","kap":3,"kapitel":"Kap. 3 · Endliche Automaten","klausur":false,"erg":false,"frage":"<p>Definieren Sie einen DFA und erklären Sie seine Arbeitsweise.<\/p>","antwort":"<p>DFA M = (Z, Σ, δ, z₀, F):<\/p><ul><li>Z endliche Zustandsmenge, Σ Eingabealphabet (Z ∩ Σ = ∅)<\/li><li><b>δ: Z × Σ → Z<\/b> Übergangsfunktion, <b>total<\/b>: für jeden Zustand und jedes Zeichen genau ein Übergang<\/li><li>z₀ ∈ Z Startzustand, F ⊆ Z Endzustände<\/li><\/ul><p>Arbeitsweise: Der Lesekopf geht Zeichen für Zeichen <b>nur nach rechts<\/b>; pro Takt wechselt der Zustand gemäß δ. Am Wortende zählt nur der Zustand: in F ⇒ akzeptiert, sonst abgelehnt.<\/p>","details":"","punkte":["Z endliche Zustandsmenge, Σ Eingabealphabet (Z ∩ Σ = ∅)","<b>δ: Z × Σ → Z<\/b> Übergangsfunktion, <b>total<\/b>: für jeden Zustand und jedes Zeichen genau ein Übergang","z₀ ∈ Z Startzustand, F ⊆ Z Endzustände"],"nachfragen":[{"q":"Was bedeutet „deterministisch“?","a":"<p>Zu jedem Zeitpunkt ist eindeutig bestimmt, in welchem Zustand der Automat ist und wohin er geht.<\/p>","q_raw":"Was bedeutet „deterministisch“?","a_raw":"Zu jedem Zeitpunkt ist eindeutig bestimmt, in welchem Zustand der Automat ist und wohin er geht."},{"q":"Hat ein DFA Speicher?","a":"<p>Nur seine <b>endlich vielen Zustände<\/b>: keine Variablen, kein Band zum Schreiben. Genau das begrenzt seine Mächtigkeit.<\/p>","q_raw":"Hat ein DFA Speicher?","a_raw":"Nur seine **endlich vielen Zustände**: keine Variablen, kein Band zum Schreiben. Genau das begrenzt seine Mächtigkeit."},{"q":"Was ist ein Müllzustand?","a":"<p>Ein Nicht-Endzustand, aus dem man nie mehr herauskommt. Er macht δ total, wenn ein Präfix schon „verloren“ ist.<\/p>","q_raw":"Was ist ein Müllzustand?","a_raw":"Ein Nicht-Endzustand, aus dem man nie mehr herauskommt. Er macht δ total, wenn ein Präfix schon „verloren“ ist."}],"frage_raw":"Definieren Sie einen DFA und erklären Sie seine Arbeitsweise.","antwort_raw":"\nDFA M = (Z, Σ, δ, z₀, F):\n- Z endliche Zustandsmenge, Σ Eingabealphabet (Z ∩ Σ = ∅)\n- **δ: Z × Σ → Z** Übergangsfunktion, **total**: für jeden Zustand und jedes Zeichen genau ein Übergang\n- z₀ ∈ Z Startzustand, F ⊆ Z Endzustände\n\nArbeitsweise: Der Lesekopf geht Zeichen für Zeichen **nur nach rechts**; pro Takt wechselt der Zustand gemäß δ. Am Wortende zählt nur der Zustand: in F ⇒ akzeptiert, sonst abgelehnt.\n"},{"id":"ea-dachhat","kap":3,"kapitel":"Kap. 3 · Endliche Automaten","klausur":false,"erg":false,"frage":"<p>Was ist die erweiterte Übergangsfunktion \\(\\hat\\delta\\), und wie definiert man damit L(M) und reguläre Sprachen?<\/p>","antwort":"<p>\\(\\hat\\delta: Z \\times \\Sigma^* \\to Z\\) rekursiv:<\/p><ul><li>\\(\\hat\\delta(z, \\varepsilon) = z\\)<\/li><li>\\(\\hat\\delta(z, a) = \\delta(z, a)\\)<\/li><li>\\(\\hat\\delta(z, aw) = \\hat\\delta(\\delta(z, a), w)\\)<\/li><\/ul><p>\\(L(M) = \\{w \\in \\Sigma^* \\mid \\hat\\delta(z_0, w) \\in F\\}\\). Eine Sprache heißt <b>regulär<\/b>, wenn ein DFA sie akzeptiert (das sind genau die Typ-3-Sprachen).<\/p>","details":"","punkte":["\\(\\hat\\delta(z, \\varepsilon) = z\\)","\\(\\hat\\delta(z, a) = \\delta(z, a)\\)","\\(\\hat\\delta(z, aw) = \\hat\\delta(\\delta(z, a), w)\\)"],"nachfragen":[{"q":"Wird ε von einem DFA akzeptiert?","a":"<p>Genau dann, wenn z₀ ∈ F, denn \\(\\hat\\delta(z_0, \\varepsilon) = z_0\\).<\/p>","q_raw":"Wird ε von einem DFA akzeptiert?","a_raw":"Genau dann, wenn z₀ ∈ F, denn \\(\\hat\\delta(z_0, \\varepsilon) = z_0\\)."}],"frage_raw":"Was ist die erweiterte Übergangsfunktion \\(\\hat\\delta\\), und wie definiert man damit L(M) und reguläre Sprachen?","antwort_raw":"\n\\(\\hat\\delta: Z \\times \\Sigma^* \\to Z\\) rekursiv:\n- \\(\\hat\\delta(z, \\varepsilon) = z\\)\n- \\(\\hat\\delta(z, a) = \\delta(z, a)\\)\n- \\(\\hat\\delta(z, aw) = \\hat\\delta(\\delta(z, a), w)\\)\n\n\\(L(M) = \\{w \\in \\Sigma^* \\mid \\hat\\delta(z_0, w) \\in F\\}\\). Eine Sprache heißt **regulär**, wenn ein DFA sie akzeptiert (das sind genau die Typ-3-Sprachen).\n"},{"id":"ea-anbn-intuition","kap":3,"kapitel":"Kap. 3 · Endliche Automaten","klausur":false,"erg":false,"frage":"<p>Warum kann kein DFA die Sprache \\(\\{a^n b^n \\mid n \\in \\mathbb{N}\\}\\) erkennen? (Intuition)<\/p>","antwort":"<ul><li>Der DFA müsste sich die Anzahl der gelesenen a merken, um sie später mit den b zu vergleichen.<\/li><li>Sein einziger „Speicher“ sind die Zustände, und davon gibt es nur <b>endlich viele<\/b>.<\/li><li>Bei beliebig großem n bräuchte er beliebig viele Zustände ↯.<\/li><li>Formal zeigt man das mit dem <b>Pumping-Lemma<\/b> oder mit <b>Myhill-Nerode<\/b> (Kap. 4).<\/li><\/ul>","details":"","punkte":["Der DFA müsste sich die Anzahl der gelesenen a merken, um sie später mit den b zu vergleichen.","Sein einziger „Speicher“ sind die Zustände, und davon gibt es nur <b>endlich viele<\/b>.","Bei beliebig großem n bräuchte er beliebig viele Zustände ↯.","Formal zeigt man das mit dem <b>Pumping-Lemma<\/b> oder mit <b>Myhill-Nerode<\/b> (Kap. 4)."],"nachfragen":[{"q":"Ist {aⁿbⁿ | n ≤ 1000} regulär?","a":"<p>Ja: Jede endliche Sprache ist regulär. Das Problem entsteht erst durch unbeschränktes n.<\/p>","q_raw":"Ist {aⁿbⁿ | n ≤ 1000} regulär?","a_raw":"Ja: Jede endliche Sprache ist regulär. Das Problem entsteht erst durch unbeschränktes n."}],"frage_raw":"Warum kann kein DFA die Sprache \\(\\{a^n b^n \\mid n \\in \\mathbb{N}\\}\\) erkennen? (Intuition)","antwort_raw":"\n- Der DFA müsste sich die Anzahl der gelesenen a merken, um sie später mit den b zu vergleichen.\n- Sein einziger „Speicher“ sind die Zustände, und davon gibt es nur **endlich viele**.\n- Bei beliebig großem n bräuchte er beliebig viele Zustände ↯.\n- Formal zeigt man das mit dem **Pumping-Lemma** oder mit **Myhill-Nerode** (Kap. 4).\n"},{"id":"ea-komplement","kap":3,"kapitel":"Kap. 3 · Endliche Automaten","klausur":false,"erg":false,"frage":"<p>Wie erhält man einen DFA für das Komplement einer regulären Sprache? Warum ist dabei wichtig, dass δ total ist?<\/p>","antwort":"<ul><li>Gegeben DFA M für L. Für \\(\\overline{L} = \\Sigma^* \\setminus L\\) <b>End- und Nicht-Endzustände tauschen<\/b>: F′ = Z \\ F.<\/li><li>Das klappt, weil jedes Wort genau einen Lauf hat, der in genau einem Zustand endet.<\/li><li>δ muss <b>total<\/b> sein: Fehlte ein Übergang, würde das Wort in beiden Automaten verworfen. Der Müllzustand wird im Komplement-DFA zum Endzustand.<\/li><\/ul>","details":"","punkte":["Gegeben DFA M für L. Für \\(\\overline{L} = \\Sigma^* \\setminus L\\) <b>End- und Nicht-Endzustände tauschen<\/b>: F′ = Z \\ F.","Das klappt, weil jedes Wort genau einen Lauf hat, der in genau einem Zustand endet.","δ muss <b>total<\/b> sein: Fehlte ein Übergang, würde das Wort in beiden Automaten verworfen. Der Müllzustand wird im Komplement-DFA zum Endzustand."],"nachfragen":[{"q":"Funktioniert das Tauschen auch bei NFAs?","a":"<p><b>Nein.<\/b> Ein NFA akzeptiert, wenn <b>irgendein<\/b> Lauf in F endet. Nach dem Tauschen kann ein Wort immer noch einen Lauf in den neuen Endzuständen haben. Man muss erst determinisieren (Rabin-Scott).<\/p>","q_raw":"Funktioniert das Tauschen auch bei NFAs?","a_raw":"**Nein.** Ein NFA akzeptiert, wenn **irgendein** Lauf in F endet. Nach dem Tauschen kann ein Wort immer noch einen Lauf in den neuen Endzuständen haben. Man muss erst determinisieren (Rabin-Scott)."}],"frage_raw":"Wie erhält man einen DFA für das Komplement einer regulären Sprache? Warum ist dabei wichtig, dass δ total ist?","antwort_raw":"\n- Gegeben DFA M für L. Für \\(\\overline{L} = \\Sigma^* \\setminus L\\) **End- und Nicht-Endzustände tauschen**: F′ = Z \\ F.\n- Das klappt, weil jedes Wort genau einen Lauf hat, der in genau einem Zustand endet.\n- δ muss **total** sein: Fehlte ein Übergang, würde das Wort in beiden Automaten verworfen. Der Müllzustand wird im Komplement-DFA zum Endzustand.\n"},{"id":"ea-abschluss","kap":3,"kapitel":"Kap. 3 · Endliche Automaten","klausur":false,"erg":true,"frage":"<p>Unter welchen Operationen sind reguläre Sprachen abgeschlossen? Wie zeigt man das?<\/p>","antwort":"<ul><li><b>Komplement:<\/b> Endzustände tauschen (δ total).<\/li><li><b>Schnitt:<\/b> <b>Produktautomat<\/b> mit Zuständen (z, z′), parallele Simulation, Endzustände F × F′.<\/li><li><b>Vereinigung:<\/b> Produktautomat mit Endzuständen „z ∈ F oder z′ ∈ F′“, oder per De Morgan aus Komplement und Schnitt.<\/li><li><b>Konkatenation, Kleene-Stern:<\/b> mit NFAε (ε-Kanten von Endzuständen zum nächsten Start bzw. zurück), danach Rabin-Scott.<\/li><\/ul>","details":"","punkte":["<b>Komplement:<\/b> Endzustände tauschen (δ total).","<b>Schnitt:<\/b> <b>Produktautomat<\/b> mit Zuständen (z, z′), parallele Simulation, Endzustände F × F′.","<b>Vereinigung:<\/b> Produktautomat mit Endzuständen „z ∈ F oder z′ ∈ F′“, oder per De Morgan aus Komplement und Schnitt.","<b>Konkatenation, Kleene-Stern:<\/b> mit NFAε (ε-Kanten von Endzuständen zum nächsten Start bzw. zurück), danach Rabin-Scott."],"nachfragen":[{"q":"Wozu sind Abschlusseigenschaften nützlich?","a":"<p>Für Nicht-Regularitätsbeweise: Wäre L regulär, dann auch L ∩ a*b*. Ist das schon nicht regulär (z. B. aⁿbⁿ), ist L nicht regulär.<\/p>","q_raw":"Wozu sind Abschlusseigenschaften nützlich?","a_raw":"Für Nicht-Regularitätsbeweise: Wäre L regulär, dann auch L ∩ a*b*. Ist das schon nicht regulär (z. B. aⁿbⁿ), ist L nicht regulär."}],"frage_raw":"Unter welchen Operationen sind reguläre Sprachen abgeschlossen? Wie zeigt man das?","antwort_raw":"\n- **Komplement:** Endzustände tauschen (δ total).\n- **Schnitt:** **Produktautomat** mit Zuständen (z, z′), parallele Simulation, Endzustände F × F′.\n- **Vereinigung:** Produktautomat mit Endzuständen „z ∈ F oder z′ ∈ F′“, oder per De Morgan aus Komplement und Schnitt.\n- **Konkatenation, Kleene-Stern:** mit NFAε (ε-Kanten von Endzuständen zum nächsten Start bzw. zurück), danach Rabin-Scott.\n"},{"id":"ea-nfa-def","kap":3,"kapitel":"Kap. 3 · Endliche Automaten","klausur":false,"erg":false,"frage":"<p>Was ist ein NFA? Worin unterscheidet er sich vom DFA, und wann akzeptiert er?<\/p>","antwort":"<p>NFA M = (Z, Σ, δ, z₀, F) wie beim DFA, aber <b>δ: Z × Σ → 𝒫(Z)<\/b>: Für ein Zeichen kann es <b>mehrere oder gar keinen<\/b> Folgezustand geben.<\/p><ul><li>\\(\\hat\\delta(z, \\varepsilon) = \\{z\\}\\), \\(\\hat\\delta(z, aw) = \\bigcup_{z' \\in \\delta(z,a)} \\hat\\delta(z', w)\\)<\/li><li>\\(L(M) = \\{w \\mid \\hat\\delta(z_0, w) \\cap F \\neq \\emptyset\\}\\)<\/li><li>Informell: Ein NFA akzeptiert w, wenn er die <b>Chance<\/b> hat, in einem Endzustand zu landen (es gibt <b>mindestens einen<\/b> akzeptierenden Lauf).<\/li><\/ul>","details":"","punkte":["\\(\\hat\\delta(z, \\varepsilon) = \\{z\\}\\), \\(\\hat\\delta(z, aw) = \\bigcup_{z' \\in \\delta(z,a)} \\hat\\delta(z', w)\\)","\\(L(M) = \\{w \\mid \\hat\\delta(z_0, w) \\cap F \\neq \\emptyset\\}\\)","Informell: Ein NFA akzeptiert w, wenn er die <b>Chance<\/b> hat, in einem Endzustand zu landen (es gibt <b>mindestens einen<\/b> akzeptierenden Lauf)."],"nachfragen":[{"q":"Wozu NFAs, wenn es echten Nichtdeterminismus nicht gibt?","a":"<p>Sie sind oft viel <b>kompakter<\/b> (keine Müllzustände, weniger Zustände), lassen sich leichter konstruieren und spielen eine zentrale Rolle in der Komplexitätstheorie (NP).<\/p>","q_raw":"Wozu NFAs, wenn es echten Nichtdeterminismus nicht gibt?","a_raw":"Sie sind oft viel **kompakter** (keine Müllzustände, weniger Zustände), lassen sich leichter konstruieren und spielen eine zentrale Rolle in der Komplexitätstheorie (NP)."},{"q":"Sind NFAs mächtiger als DFAs?","a":"<p><b>Nein<\/b>, nach Rabin-Scott erkennen beide genau die regulären Sprachen. Sie sind nur kompakter.<\/p>","q_raw":"Sind NFAs mächtiger als DFAs?","a_raw":"**Nein**, nach Rabin-Scott erkennen beide genau die regulären Sprachen. Sie sind nur kompakter."}],"frage_raw":"Was ist ein NFA? Worin unterscheidet er sich vom DFA, und wann akzeptiert er?","antwort_raw":"\nNFA M = (Z, Σ, δ, z₀, F) wie beim DFA, aber **δ: Z × Σ → 𝒫(Z)**: Für ein Zeichen kann es **mehrere oder gar keinen** Folgezustand geben.\n\n- \\(\\hat\\delta(z, \\varepsilon) = \\{z\\}\\), \\(\\hat\\delta(z, aw) = \\bigcup_{z' \\in \\delta(z,a)} \\hat\\delta(z', w)\\)\n- \\(L(M) = \\{w \\mid \\hat\\delta(z_0, w) \\cap F \\neq \\emptyset\\}\\)\n- Informell: Ein NFA akzeptiert w, wenn er die **Chance** hat, in einem Endzustand zu landen (es gibt **mindestens einen** akzeptierenden Lauf).\n"},{"id":"ea-rabin-scott","kap":3,"kapitel":"Kap. 3 · Endliche Automaten","klausur":true,"erg":false,"frage":"<p>Satz von Rabin und Scott: Aussage und Beweisidee (Potenzmengenkonstruktion).<\/p>","antwort":"<p><b>Satz:<\/b> Zu jedem NFA gibt es einen äquivalenten DFA.<\/p><p><b>Idee:<\/b> Der DFA merkt sich die <b>Menge aller Zustände, in denen der NFA gerade sein könnte<\/b>.<\/p><ul><li>\\(\\tilde Z = \\mathcal{P}(Z)\\), Start \\(\\tilde z_0 = \\{z_0\\}\\)<\/li><li>\\(\\tilde\\delta(T, a) = \\bigcup_{z \\in T} \\delta(z, a)\\): wieder eine Teilmenge, also ein Zustand<\/li><li>\\(\\tilde F = \\{T \\subseteq Z \\mid T \\cap F \\neq \\emptyset\\}\\)<\/li><li>Korrektheit: Nach w ist der DFA im Zustand \\(\\hat\\delta(z_0, w)\\) (Induktion über |w|), und er akzeptiert genau dann, wenn diese Menge einen Endzustand enthält, also genau wie der NFA.<\/li><\/ul>","details":"<p>In der Praxis konstruiert man nur die von {z₀} aus <b>erreichbaren<\/b> Teilmengen (Tabelle). ∅ ist ein gültiger Zustand und wirkt als Müllzustand.<\/p><p>Folgerung: L regulär ⇔ L wird von einem DFA akzeptiert ⇔ L wird von einem NFA akzeptiert.<\/p>","punkte":["\\(\\tilde Z = \\mathcal{P}(Z)\\), Start \\(\\tilde z_0 = \\{z_0\\}\\)","\\(\\tilde\\delta(T, a) = \\bigcup_{z \\in T} \\delta(z, a)\\): wieder eine Teilmenge, also ein Zustand","\\(\\tilde F = \\{T \\subseteq Z \\mid T \\cap F \\neq \\emptyset\\}\\)","Korrektheit: Nach w ist der DFA im Zustand \\(\\hat\\delta(z_0, w)\\) (Induktion über |w|), und er akzeptiert genau dann, wenn diese Menge einen Endzustand enthält, also genau wie der NFA."],"nachfragen":[{"q":"Wie groß kann der DFA werden?","a":"<p>Bis zu \\(2^{|Z|}\\) Zustände. Das ist auch nötig: Für „das k-letzte Zeichen ist 0“ reicht ein NFA mit k + 1 Zuständen, jeder DFA braucht aber mindestens \\(2^k\\) (er muss sich die letzten k Zeichen merken).<\/p>","q_raw":"Wie groß kann der DFA werden?","a_raw":"Bis zu \\(2^{|Z|}\\) Zustände. Das ist auch nötig: Für „das k-letzte Zeichen ist 0“ reicht ein NFA mit k + 1 Zuständen, jeder DFA braucht aber mindestens \\(2^k\\) (er muss sich die letzten k Zeichen merken)."},{"q":"Warum ist δ̃ wohldefiniert und total?","a":"<p>Die Vereinigung von Teilmengen von Z ist wieder eine Teilmenge von Z, auch ∅. Also gibt es für jede Menge und jedes Zeichen genau einen Folgezustand.<\/p>","q_raw":"Warum ist δ̃ wohldefiniert und total?","a_raw":"Die Vereinigung von Teilmengen von Z ist wieder eine Teilmenge von Z, auch ∅. Also gibt es für jede Menge und jedes Zeichen genau einen Folgezustand."},{"q":"Was ist bei NFAε anders?","a":"<p>Man bildet zusätzlich die <b>ε-Hülle<\/b>: am Start und nach jedem Schritt alle per ε erreichbaren Zustände dazunehmen.<\/p>","q_raw":"Was ist bei NFAε anders?","a_raw":"Man bildet zusätzlich die **ε-Hülle**: am Start und nach jedem Schritt alle per ε erreichbaren Zustände dazunehmen."}],"frage_raw":"Satz von Rabin und Scott: Aussage und Beweisidee (Potenzmengenkonstruktion).","antwort_raw":"\n**Satz:** Zu jedem NFA gibt es einen äquivalenten DFA.\n\n**Idee:** Der DFA merkt sich die **Menge aller Zustände, in denen der NFA gerade sein könnte**.\n- \\(\\tilde Z = \\mathcal{P}(Z)\\), Start \\(\\tilde z_0 = \\{z_0\\}\\)\n- \\(\\tilde\\delta(T, a) = \\bigcup_{z \\in T} \\delta(z, a)\\): wieder eine Teilmenge, also ein Zustand\n- \\(\\tilde F = \\{T \\subseteq Z \\mid T \\cap F \\neq \\emptyset\\}\\)\n- Korrektheit: Nach w ist der DFA im Zustand \\(\\hat\\delta(z_0, w)\\) (Induktion über |w|), und er akzeptiert genau dann, wenn diese Menge einen Endzustand enthält, also genau wie der NFA.\n"},{"id":"ea-nfae","kap":3,"kapitel":"Kap. 3 · Endliche Automaten","klausur":false,"erg":false,"frage":"<p>Was ist ein NFAε, und warum ist er nicht mächtiger als ein NFA?<\/p>","antwort":"<ul><li>Einzige Änderung: <b>δ: Z × (Σ ∪ {ε}) → 𝒫(Z)<\/b>. Der Automat darf den Zustand wechseln, ohne ein Zeichen zu lesen.<\/li><li>Praktisch zum Zusammensetzen von Automaten (Konkatenation, Stern).<\/li><li>Nicht mächtiger: Man ersetzt ε-Übergänge über die <b>ε-Hülle<\/b> (alle Zustände, die von z nur mit ε erreichbar sind) und erhält einen NFA bzw. per Potenzmenge einen DFA.<\/li><\/ul>","details":"","punkte":["Einzige Änderung: <b>δ: Z × (Σ ∪ {ε}) → 𝒫(Z)<\/b>. Der Automat darf den Zustand wechseln, ohne ein Zeichen zu lesen.","Praktisch zum Zusammensetzen von Automaten (Konkatenation, Stern).","Nicht mächtiger: Man ersetzt ε-Übergänge über die <b>ε-Hülle<\/b> (alle Zustände, die von z nur mit ε erreichbar sind) und erhält einen NFA bzw. per Potenzmenge einen DFA."],"nachfragen":[{"q":"Beispiel aus der VL?","a":"<p>aⁱbʲcᵏ: drei Zustände mit a-, b- bzw. c-Schleife, verbunden durch ε-Kanten, alle final.<\/p>","q_raw":"Beispiel aus der VL?","a_raw":"aⁱbʲcᵏ: drei Zustände mit a-, b- bzw. c-Schleife, verbunden durch ε-Kanten, alle final."}],"frage_raw":"Was ist ein NFAε, und warum ist er nicht mächtiger als ein NFA?","antwort_raw":"\n- Einzige Änderung: **δ: Z × (Σ ∪ {ε}) → 𝒫(Z)**. Der Automat darf den Zustand wechseln, ohne ein Zeichen zu lesen.\n- Praktisch zum Zusammensetzen von Automaten (Konkatenation, Stern).\n- Nicht mächtiger: Man ersetzt ε-Übergänge über die **ε-Hülle** (alle Zustände, die von z nur mit ε erreichbar sind) und erhält einen NFA bzw. per Potenzmenge einen DFA.\n"},{"id":"pl-aussage","kap":4,"kapitel":"Kap. 4 · Pumping-Lemma, Myhill-Nerode, Minimierung","klausur":false,"erg":false,"frage":"<p>Formulieren Sie das Pumping-Lemma für reguläre Sprachen.<\/p>","antwort":"<p>Sei L regulär. Dann gibt es eine <b>Pumping-Zahl N ∈ ℕ<\/b>, sodass sich <b>jedes<\/b> Wort w ∈ L mit |w| ≥ N zerlegen lässt als <b>w = pqr<\/b> mit<\/p><ol><li>|pq| ≤ N<\/li><li>|q| ≥ 1<\/li><li>\\(p q^i r \\in L\\) für <b>alle<\/b> i ≥ 0<\/li><\/ol><p>Quantoren: ∃N ∀w ∈ L (|w| ≥ N) ∃ Zerlegung pqr mit (1), (2) ∀i ≥ 0: pqⁱr ∈ L.<\/p>","details":"","punkte":["|pq| ≤ N","|q| ≥ 1","\\(p q^i r \\in L\\) für <b>alle<\/b> i ≥ 0"],"nachfragen":[{"q":"Was ist N anschaulich?","a":"<p>Die Anzahl der Zustände eines DFA für L.<\/p>","q_raw":"Was ist N anschaulich?","a_raw":"Die Anzahl der Zustände eines DFA für L."},{"q":"Warum ist i = 0 erlaubt?","a":"<p>„Herauspumpen“: Die Schleife wird gar nicht durchlaufen, pr ∈ L. Oft ist i = 0 der einfachste Widerspruch.<\/p>","q_raw":"Warum ist i = 0 erlaubt?","a_raw":"„Herauspumpen“: Die Schleife wird gar nicht durchlaufen, pr ∈ L. Oft ist i = 0 der einfachste Widerspruch."}],"frage_raw":"Formulieren Sie das Pumping-Lemma für reguläre Sprachen.","antwort_raw":"\nSei L regulär. Dann gibt es eine **Pumping-Zahl N ∈ ℕ**, sodass sich **jedes** Wort w ∈ L mit |w| ≥ N zerlegen lässt als **w = pqr** mit\n1. |pq| ≤ N\n2. |q| ≥ 1\n3. \\(p q^i r \\in L\\) für **alle** i ≥ 0\n\nQuantoren: ∃N ∀w ∈ L (|w| ≥ N) ∃ Zerlegung pqr mit (1), (2) ∀i ≥ 0: pqⁱr ∈ L.\n"},{"id":"pl-beweis","kap":4,"kapitel":"Kap. 4 · Pumping-Lemma, Myhill-Nerode, Minimierung","klausur":false,"erg":false,"frage":"<p>Beweisen Sie das Pumping-Lemma für reguläre Sprachen.<\/p>","antwort":"<ul><li>L regulär ⇒ DFA M = (Z, Σ, δ, z₀, F) mit L(M) = L. Wähle <b>N = |Z|<\/b>.<\/li><li>Für w ∈ L mit |w| ≥ N durchläuft M beim Lesen der ersten N Zeichen N + 1 Zustände ⇒ nach dem <b>Schubfachprinzip<\/b> wiederholt sich ein Zustand.<\/li><li>Zerlege w = pqr so, dass \\(\\hat\\delta(z_0, p) = \\hat\\delta(z_0, pq) = z\\) (erste Wiederholung): dann |pq| ≤ N und |q| ≥ 1.<\/li><li>q führt von z nach z, ist also eine <b>Schleife<\/b>. Man kann sie beliebig oft (auch 0-mal) durchlaufen: \\(\\hat\\delta(z_0, pq^i r) = \\hat\\delta(z, r) \\in F\\) für alle i ⇒ \\(pq^ir \\in L\\). □<\/li><\/ul>","details":"","punkte":["L regulär ⇒ DFA M = (Z, Σ, δ, z₀, F) mit L(M) = L. Wähle <b>N = |Z|<\/b>.","Für w ∈ L mit |w| ≥ N durchläuft M beim Lesen der ersten N Zeichen N + 1 Zustände ⇒ nach dem <b>Schubfachprinzip<\/b> wiederholt sich ein Zustand.","Zerlege w = pqr so, dass \\(\\hat\\delta(z_0, p) = \\hat\\delta(z_0, pq) = z\\) (erste Wiederholung): dann |pq| ≤ N und |q| ≥ 1.","q führt von z nach z, ist also eine <b>Schleife<\/b>. Man kann sie beliebig oft (auch 0-mal) durchlaufen: \\(\\hat\\delta(z_0, pq^i r) = \\hat\\delta(z, r) \\in F\\) für alle i ⇒ \\(pq^ir \\in L\\). □"],"nachfragen":[{"q":"Wo steckt das Schubfachprinzip?","a":"<p>N + 1 besuchte Zustände (inklusive Start) bei nur N verschiedenen Zuständen ⇒ mindestens einer kommt doppelt vor.<\/p>","q_raw":"Wo steckt das Schubfachprinzip?","a_raw":"N + 1 besuchte Zustände (inklusive Start) bei nur N verschiedenen Zuständen ⇒ mindestens einer kommt doppelt vor."},{"q":"Warum |pq| ≤ N?","a":"<p>Weil man die <b>erste<\/b> Wiederholung nimmt: Sie tritt spätestens nach N Zeichen auf.<\/p>","q_raw":"Warum |pq| ≤ N?","a_raw":"Weil man die **erste** Wiederholung nimmt: Sie tritt spätestens nach N Zeichen auf."}],"frage_raw":"Beweisen Sie das Pumping-Lemma für reguläre Sprachen.","antwort_raw":"\n- L regulär ⇒ DFA M = (Z, Σ, δ, z₀, F) mit L(M) = L. Wähle **N = |Z|**.\n- Für w ∈ L mit |w| ≥ N durchläuft M beim Lesen der ersten N Zeichen N + 1 Zustände ⇒ nach dem **Schubfachprinzip** wiederholt sich ein Zustand.\n- Zerlege w = pqr so, dass \\(\\hat\\delta(z_0, p) = \\hat\\delta(z_0, pq) = z\\) (erste Wiederholung): dann |pq| ≤ N und |q| ≥ 1.\n- q führt von z nach z, ist also eine **Schleife**. Man kann sie beliebig oft (auch 0-mal) durchlaufen: \\(\\hat\\delta(z_0, pq^i r) = \\hat\\delta(z, r) \\in F\\) für alle i ⇒ \\(pq^ir \\in L\\). □\n"},{"id":"pl-anwendung","kap":4,"kapitel":"Kap. 4 · Pumping-Lemma, Myhill-Nerode, Minimierung","klausur":false,"erg":false,"frage":"<p>Wie benutzt man das Pumping-Lemma, um zu zeigen, dass eine Sprache nicht regulär ist? Wer „wählt“ was?<\/p>","antwort":"<p>Man benutzt die <b>Kontraposition<\/b> und führt einen Widerspruchsbeweis:<\/p><ol><li>Annahme: L regulär ⇒ es gibt eine Pumping-Zahl N (<b>beliebig<\/b>, nicht wählbar).<\/li><li><b>Ich wähle<\/b> ein Wort w ∈ L mit |w| ≥ N, das von N abhängt (z. B. \\(a^N b^N\\)).<\/li><li>Die Zerlegung w = pqr mit |pq| ≤ N, |q| ≥ 1 ist <b>beliebig<\/b>: <b>alle<\/b> Zerlegungen müssen abgedeckt werden.<\/li><li><b>Ich wähle<\/b> ein i (meist 0 oder 2) mit \\(pq^ir \\notin L\\).<\/li><li>Widerspruch ⇒ L ist nicht regulär.<\/li><\/ol>","details":"","punkte":["Annahme: L regulär ⇒ es gibt eine Pumping-Zahl N (<b>beliebig<\/b>, nicht wählbar).","<b>Ich wähle<\/b> ein Wort w ∈ L mit |w| ≥ N, das von N abhängt (z. B. \\(a^N b^N\\)).","Die Zerlegung w = pqr mit |pq| ≤ N, |q| ≥ 1 ist <b>beliebig<\/b>: <b>alle<\/b> Zerlegungen müssen abgedeckt werden.","<b>Ich wähle<\/b> ein i (meist 0 oder 2) mit \\(pq^ir \\notin L\\).","Widerspruch ⇒ L ist nicht regulär."],"nachfragen":[{"q":"Häufigster Fehler?","a":"<p>Eine konkrete Zerlegung oder ein konkretes N annehmen. Man muss <b>jede<\/b> Zerlegung mit |pq| ≤ N und |q| ≥ 1 widerlegen.<\/p>","q_raw":"Häufigster Fehler?","a_raw":"Eine konkrete Zerlegung oder ein konkretes N annehmen. Man muss **jede** Zerlegung mit |pq| ≤ N und |q| ≥ 1 widerlegen."},{"q":"Wie wählt man w geschickt?","a":"<p>So, dass |pq| ≤ N das q in einen einfachen Block zwingt, z. B. q = aʲ bei w = a^N b^N.<\/p>","q_raw":"Wie wählt man w geschickt?","a_raw":"So, dass |pq| ≤ N das q in einen einfachen Block zwingt, z. B. q = aʲ bei w = a^N b^N."}],"frage_raw":"Wie benutzt man das Pumping-Lemma, um zu zeigen, dass eine Sprache nicht regulär ist? Wer „wählt“ was?","antwort_raw":"\nMan benutzt die **Kontraposition** und führt einen Widerspruchsbeweis:\n1. Annahme: L regulär ⇒ es gibt eine Pumping-Zahl N (**beliebig**, nicht wählbar).\n2. **Ich wähle** ein Wort w ∈ L mit |w| ≥ N, das von N abhängt (z. B. \\(a^N b^N\\)).\n3. Die Zerlegung w = pqr mit |pq| ≤ N, |q| ≥ 1 ist **beliebig**: **alle** Zerlegungen müssen abgedeckt werden.\n4. **Ich wähle** ein i (meist 0 oder 2) mit \\(pq^ir \\notin L\\).\n5. Widerspruch ⇒ L ist nicht regulär.\n"},{"id":"pl-anbn","kap":4,"kapitel":"Kap. 4 · Pumping-Lemma, Myhill-Nerode, Minimierung","klausur":false,"erg":false,"frage":"<p>Zeigen Sie mit dem Pumping-Lemma: \\(L = \\{a^n b^n \\mid n \\ge 0\\}\\) ist nicht regulär.<\/p>","antwort":"<ul><li>Annahme: L regulär, Pumping-Zahl N.<\/li><li>Wähle \\(w = a^N b^N \\in L\\), |w| = 2N ≥ N.<\/li><li>Jede Zerlegung w = pqr mit |pq| ≤ N, |q| ≥ 1 liegt ganz im a-Block: \\(q = a^j\\) mit 1 ≤ j ≤ N.<\/li><li>i = 0: \\(pq^0r = a^{N-j} b^N \\notin L\\), da N − j ≠ N ↯<\/li><li>⇒ L ist nicht regulär. □<\/li><\/ul>","details":"","punkte":["Annahme: L regulär, Pumping-Zahl N.","Wähle \\(w = a^N b^N \\in L\\), |w| = 2N ≥ N.","Jede Zerlegung w = pqr mit |pq| ≤ N, |q| ≥ 1 liegt ganz im a-Block: \\(q = a^j\\) mit 1 ≤ j ≤ N.","i = 0: \\(pq^0r = a^{N-j} b^N \\notin L\\), da N − j ≠ N ↯","⇒ L ist nicht regulär. □"],"nachfragen":[],"frage_raw":"Zeigen Sie mit dem Pumping-Lemma: \\(L = \\{a^n b^n \\mid n \\ge 0\\}\\) ist nicht regulär.","antwort_raw":"\n- Annahme: L regulär, Pumping-Zahl N.\n- Wähle \\(w = a^N b^N \\in L\\), |w| = 2N ≥ N.\n- Jede Zerlegung w = pqr mit |pq| ≤ N, |q| ≥ 1 liegt ganz im a-Block: \\(q = a^j\\) mit 1 ≤ j ≤ N.\n- i = 0: \\(pq^0r = a^{N-j} b^N \\notin L\\), da N − j ≠ N ↯\n- ⇒ L ist nicht regulär. □\n"},{"id":"pl-notwendig","kap":4,"kapitel":"Kap. 4 · Pumping-Lemma, Myhill-Nerode, Minimierung","klausur":true,"erg":false,"frage":"<p>Ist das Pumping-Lemma eine notwendige oder eine hinreichende Bedingung für Regularität? Was folgt daraus?<\/p>","antwort":"<ul><li><b>Nur notwendig:<\/b> Jede reguläre Sprache erfüllt es, aber auch manche nicht-reguläre Sprachen erfüllen es.<\/li><li>Deshalb kann man mit dem PL nur zeigen, dass eine Sprache <b>nicht<\/b> regulär ist, aber nie, dass sie regulär <b>ist<\/b>.<\/li><li><b>Myhill-Nerode<\/b> ist dagegen <b>notwendig und hinreichend<\/b>: L regulär ⇔ Index endlich.<\/li><li>Regularität zeigt man konstruktiv: DFA, NFA oder reguläre Grammatik angeben.<\/li><\/ul>","details":"<p>Beispiel einer nicht-regulären Sprache, die das PL erfüllt (Ergänzung): \\(L = \\{a^i b^j c^k \\mid i = 0 \\text{ oder } j = k\\}\\). Mit N = 1 und q = erstes Zeichen bleibt man durch Pumpen in L. Trotzdem ist \\(L \\cap ab^*c^* = \\{ab^jc^j\\}\\) nicht regulär, also auch L nicht.<\/p>","punkte":["<b>Nur notwendig:<\/b> Jede reguläre Sprache erfüllt es, aber auch manche nicht-reguläre Sprachen erfüllen es.","Deshalb kann man mit dem PL nur zeigen, dass eine Sprache <b>nicht<\/b> regulär ist, aber nie, dass sie regulär <b>ist<\/b>.","<b>Myhill-Nerode<\/b> ist dagegen <b>notwendig und hinreichend<\/b>: L regulär ⇔ Index endlich.","Regularität zeigt man konstruktiv: DFA, NFA oder reguläre Grammatik angeben."],"nachfragen":[{"q":"Was ist der Unterschied zwischen notwendig und hinreichend?","a":"<p>Notwendig: „regulär ⇒ PL gilt“. Hinreichend wäre die Umkehrung „PL gilt ⇒ regulär“, und die ist falsch.<\/p>","q_raw":"Was ist der Unterschied zwischen notwendig und hinreichend?","a_raw":"Notwendig: „regulär ⇒ PL gilt“. Hinreichend wäre die Umkehrung „PL gilt ⇒ regulär“, und die ist falsch."}],"frage_raw":"Ist das Pumping-Lemma eine notwendige oder eine hinreichende Bedingung für Regularität? Was folgt daraus?","antwort_raw":"\n- **Nur notwendig:** Jede reguläre Sprache erfüllt es, aber auch manche nicht-reguläre Sprachen erfüllen es.\n- Deshalb kann man mit dem PL nur zeigen, dass eine Sprache **nicht** regulär ist, aber nie, dass sie regulär **ist**.\n- **Myhill-Nerode** ist dagegen **notwendig und hinreichend**: L regulär ⇔ Index endlich.\n- Regularität zeigt man konstruktiv: DFA, NFA oder reguläre Grammatik angeben.\n"},{"id":"mn-satz","kap":4,"kapitel":"Kap. 4 · Pumping-Lemma, Myhill-Nerode, Minimierung","klausur":false,"erg":false,"frage":"<p>Formulieren Sie den Satz von Myhill-Nerode. Was ist die Relation R<sub>L<\/sub>, was der Index?<\/p>","antwort":"<ul><li>\\((v, w) \\in R_L \\iff \\forall x \\in \\Sigma^*: (vx \\in L \\Leftrightarrow wx \\in L)\\)<\/li><li>In Worten: v und w verhalten sich bezüglich L gleich, egal welches Wort man anhängt.<\/li><li>R<sub>L<\/sub> ist eine Äquivalenzrelation; die Anzahl ihrer Klassen heißt <b>Index<\/b> von L.<\/li><li><b>Satz:<\/b> L ist <b>genau dann regulär, wenn ihr Index endlich ist.<\/b><\/li><li>Dabei gilt: Index = Anzahl der Zustände des Minimalautomaten.<\/li><\/ul>","details":"","punkte":["\\((v, w) \\in R_L \\iff \\forall x \\in \\Sigma^*: (vx \\in L \\Leftrightarrow wx \\in L)\\)","In Worten: v und w verhalten sich bezüglich L gleich, egal welches Wort man anhängt.","R<sub>L<\/sub> ist eine Äquivalenzrelation; die Anzahl ihrer Klassen heißt <b>Index<\/b> von L.","<b>Satz:<\/b> L ist <b>genau dann regulär, wenn ihr Index endlich ist.<\/b>","Dabei gilt: Index = Anzahl der Zustände des Minimalautomaten."],"nachfragen":[{"q":"Was ist ein trennendes Suffix?","a":"<p>Ein x mit vx ∈ L und wx ∉ L (oder umgekehrt). Es zeigt, dass v und w in verschiedenen Klassen liegen.<\/p>","q_raw":"Was ist ein trennendes Suffix?","a_raw":"Ein x mit vx ∈ L und wx ∉ L (oder umgekehrt). Es zeigt, dass v und w in verschiedenen Klassen liegen."},{"q":"Wozu ist der Satz gut?","a":"<p>Er ist notwendig <b>und<\/b> hinreichend: Man kann Nicht-Regularität zeigen (unendlich viele Klassen) <b>und<\/b> Regularität (endlich viele Klassen), und man erhält den Minimalautomaten.<\/p>","q_raw":"Wozu ist der Satz gut?","a_raw":"Er ist notwendig **und** hinreichend: Man kann Nicht-Regularität zeigen (unendlich viele Klassen) **und** Regularität (endlich viele Klassen), und man erhält den Minimalautomaten."}],"frage_raw":"Formulieren Sie den Satz von Myhill-Nerode. Was ist die Relation R_L, was der Index?","antwort_raw":"\n- \\((v, w) \\in R_L \\iff \\forall x \\in \\Sigma^*: (vx \\in L \\Leftrightarrow wx \\in L)\\)\n- In Worten: v und w verhalten sich bezüglich L gleich, egal welches Wort man anhängt.\n- R_L ist eine Äquivalenzrelation; die Anzahl ihrer Klassen heißt **Index** von L.\n- **Satz:** L ist **genau dann regulär, wenn ihr Index endlich ist.**\n- Dabei gilt: Index = Anzahl der Zustände des Minimalautomaten.\n"},{"id":"mn-beweis","kap":4,"kapitel":"Kap. 4 · Pumping-Lemma, Myhill-Nerode, Minimierung","klausur":false,"erg":false,"frage":"<p>Beweisidee zu Myhill-Nerode: Wie baut man aus den Äquivalenzklassen einen DFA, und warum ist δ wohldefiniert?<\/p>","antwort":"<p>Bei endlichem Index: <b>Klassen = Zustände<\/b>.<\/p><ul><li>Zustand \\(z_{[w]}\\) je Klasse, Start \\(z_{[\\varepsilon]}\\), Endzustände \\(\\{z_{[w]} \\mid w \\in L\\}\\)<\/li><li>\\(\\delta(z_{[w]}, a) = z_{[wa]}\\)<\/li><li><b>Wohldefiniert:<\/b> Sind v, w in derselben Klasse, dann auch va und wa: Für jedes x gilt vax ∈ L ⇔ wax ∈ L (wähle ax als Suffix).<\/li><li>Induktion: \\(\\hat\\delta(z_{[\\varepsilon]}, w) = z_{[w]}\\), also w ∈ L(M) ⇔ \\(z_{[w]} \\in F\\) ⇔ w ∈ L.<\/li><\/ul>","details":"<p><b>Minimalität<\/b> (Übungsblatt 04, A2): Ein DFA ist minimal, wenn (a) alle Zustände erreichbar sind und (b) keine zwei Zustände äquivalent sind.<\/p><ul><li>(a) \\(z_{[w]}\\) wird durch w erreicht.<\/li><li>(b) Für \\(z_{[v]} \\neq z_{[w]}\\) gibt es ein trennendes x, also \\(L(M, z_{[v]}) \\neq L(M, z_{[w]})\\).<\/li><\/ul><p>Umgekehrt (regulär ⇒ Index endlich): Wörter, die im DFA im selben Zustand enden, sind R<sub>L<\/sub>-äquivalent. Also gilt Index ≤ |Z|.<\/p>","punkte":["Zustand \\(z_{[w]}\\) je Klasse, Start \\(z_{[\\varepsilon]}\\), Endzustände \\(\\{z_{[w]} \\mid w \\in L\\}\\)","\\(\\delta(z_{[w]}, a) = z_{[wa]}\\)","<b>Wohldefiniert:<\/b> Sind v, w in derselben Klasse, dann auch va und wa: Für jedes x gilt vax ∈ L ⇔ wax ∈ L (wähle ax als Suffix).","Induktion: \\(\\hat\\delta(z_{[\\varepsilon]}, w) = z_{[w]}\\), also w ∈ L(M) ⇔ \\(z_{[w]} \\in F\\) ⇔ w ∈ L."],"nachfragen":[],"frage_raw":"Beweisidee zu Myhill-Nerode: Wie baut man aus den Äquivalenzklassen einen DFA, und warum ist δ wohldefiniert?","antw
