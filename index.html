m","klausur":false,"erg":false,"frage":"<p>Analysieren Sie Mergesort. Wie löst man die Rekurrenz mit der Einsetzungsmethode?<\/p>","antwort":"<ul><li>Teilen O(n), zwei rekursive Aufrufe halber Größe, Mischen O(n): <b>T(n) = 2T(n/2) + O(n)<\/b>.<\/li><li>Anschaulich: log n Ebenen mit je O(n) Arbeit ⇒ <b>Θ(n log n)<\/b>.<\/li><li><b>Einsetzungsmethode:<\/b> Lösung raten, T(n) ≤ d·n log n, dann per Induktion:<\/li><\/ul><p>\\[T(n) \\le 2 d \\tfrac n2 \\log\\tfrac n2 + cn = dn\\log n - dn + cn \\le dn \\log n \\text{, falls } d \\ge c.\\]<\/p>","details":"","punkte":["Teilen O(n), zwei rekursive Aufrufe halber Größe, Mischen O(n): <b>T(n) = 2T(n/2) + O(n)<\/b>.","Anschaulich: log n Ebenen mit je O(n) Arbeit ⇒ <b>Θ(n log n)<\/b>.","<b>Einsetzungsmethode:<\/b> Lösung raten, T(n) ≤ d·n log n, dann per Induktion:"],"nachfragen":[{"q":"Was liefert das Mastertheorem?","a":"<p>a = 2, b = 2, d = 1 = log₂2 ⇒ Fall „verteilt“ ⇒ Θ(n log n).<\/p>","q_raw":"Was liefert das Mastertheorem?","a_raw":"a = 2, b = 2, d = 1 = log₂2 ⇒ Fall „verteilt“ ⇒ Θ(n log n)."}],"frage_raw":"Analysieren Sie Mergesort. Wie löst man die Rekurrenz mit der Einsetzungsmethode?","antwort_raw":"\n- Teilen O(n), zwei rekursive Aufrufe halber Größe, Mischen O(n): **T(n) = 2T(n/2) + O(n)**.\n- Anschaulich: log n Ebenen mit je O(n) Arbeit ⇒ **Θ(n log n)**.\n- **Einsetzungsmethode:** Lösung raten, T(n) ≤ d·n log n, dann per Induktion:\n\\[T(n) \\le 2 d \\tfrac n2 \\log\\tfrac n2 + cn = dn\\log n - dn + cn \\le dn \\log n \\text{, falls } d \\ge c.\\]\n"},{"id":"lz-master","kap":8,"kapitel":"Kap. 8 · Laufzeitanalyse, Landau, Mastertheorem","klausur":false,"erg":false,"frage":"<p>Formulieren Sie das Mastertheorem.<\/p>","antwort":"<p>Für \\(T(n) = a \\cdot T(\\lceil n/b \\rceil) + O(n^d)\\) mit a &gt; 0, b &gt; 1, d ≥ 0:<\/p><ul><li>\\(d &lt; \\log_b a\\): \\(T(n) = O(n^{\\log_b a})\\) – die <b>Blätter<\/b> dominieren<\/li><li>\\(d = \\log_b a\\): \\(T(n) = O(n^d \\log n)\\) – die Arbeit ist <b>verteilt<\/b><\/li><li>\\(d &gt; \\log_b a\\): \\(T(n) = O(n^d)\\) – die <b>Wurzel<\/b> dominiert<\/li><\/ul><p>(Analog mit Θ, wenn die Rekurrenz mit Θ gegeben ist.)<\/p>","details":"","punkte":["\\(d &lt; \\log_b a\\): \\(T(n) = O(n^{\\log_b a})\\) – die <b>Blätter<\/b> dominieren","\\(d = \\log_b a\\): \\(T(n) = O(n^d \\log n)\\) – die Arbeit ist <b>verteilt<\/b>","\\(d &gt; \\log_b a\\): \\(T(n) = O(n^d)\\) – die <b>Wurzel<\/b> dominiert"],"nachfragen":[{"q":"Wann ist es nicht anwendbar?","a":"<p>Wenn die Rekurrenz nicht diese Form hat, z. B. T(n) = T(n−1) + n (Teilproblem nur um 1 kleiner) oder ungleich große Teilprobleme. Dann Rekursionsbaum oder Einsetzungsmethode.<\/p>","q_raw":"Wann ist es nicht anwendbar?","a_raw":"Wenn die Rekurrenz nicht diese Form hat, z. B. T(n) = T(n−1) + n (Teilproblem nur um 1 kleiner) oder ungleich große Teilprobleme. Dann Rekursionsbaum oder Einsetzungsmethode."},{"q":"Erweiterte Form aus der VL?","a":"<p>Ist \\(f(n) = \\Theta(n^{\\log_b a} \\log^k n)\\), dann \\(T(n) = \\Theta(n^{\\log_b a} \\log^{k+1} n)\\). Beispiel: 27T(n/3) + n³ log n ⇒ Θ(n³ log² n).<\/p>","q_raw":"Erweiterte Form aus der VL?","a_raw":"Ist \\(f(n) = \\Theta(n^{\\log_b a} \\log^k n)\\), dann \\(T(n) = \\Theta(n^{\\log_b a} \\log^{k+1} n)\\). Beispiel: 27T(n/3) + n³ log n ⇒ Θ(n³ log² n)."}],"frage_raw":"Formulieren Sie das Mastertheorem.","antwort_raw":"\nFür \\(T(n) = a \\cdot T(\\lceil n/b \\rceil) + O(n^d)\\) mit a > 0, b > 1, d ≥ 0:\n- \\(d < \\log_b a\\): \\(T(n) = O(n^{\\log_b a})\\) – die **Blätter** dominieren\n- \\(d = \\log_b a\\): \\(T(n) = O(n^d \\log n)\\) – die Arbeit ist **verteilt**\n- \\(d > \\log_b a\\): \\(T(n) = O(n^d)\\) – die **Wurzel** dominiert\n\n(Analog mit Θ, wenn die Rekurrenz mit Θ gegeben ist.)\n"},{"id":"lz-master-herleitung","kap":8,"kapitel":"Kap. 8 · Laufzeitanalyse, Landau, Mastertheorem","klausur":false,"erg":false,"frage":"<p>Leiten Sie das Mastertheorem über den Rekursionsbaum her.<\/p>","antwort":"<ul><li>Ebene k: \\(a^k\\) Teilprobleme der Größe \\(n/b^k\\), Arbeit \\(a^k \\cdot O((n/b^k)^d) = O(n^d) \\cdot (a/b^d)^k\\).<\/li><li>Tiefe \\(\\log_b n\\), dort \\(a^{\\log_b n} = n^{\\log_b a}\\) Blätter.<\/li><li>Gesamt: \\(\\sum_{k=0}^{\\log_b n} O(n^d)(a/b^d)^k\\), eine <b>geometrische Reihe<\/b> mit r = a/bᵈ:<ul><li>r &lt; 1 (d &gt; log_b a): erster Summand dominiert ⇒ O(nᵈ)<\/li><li>r = 1 (d = log_b a): log_b n + 1 gleiche Summanden ⇒ O(nᵈ log n)<\/li><li>r &gt; 1 (d &lt; log_b a): letzter Summand dominiert ⇒ \\(O(n^d \\cdot (a/b^d)^{\\log_b n}) = O(n^{\\log_b a})\\)<\/li><\/ul><\/li><\/ul>","details":"","punkte":["Ebene k: \\(a^k\\) Teilprobleme der Größe \\(n/b^k\\), Arbeit \\(a^k \\cdot O((n/b^k)^d) = O(n^d) \\cdot (a/b^d)^k\\).","Tiefe \\(\\log_b n\\), dort \\(a^{\\log_b n} = n^{\\log_b a}\\) Blätter.","Gesamt: \\(\\sum_{k=0}^{\\log_b n} O(n^d)(a/b^d)^k\\), eine <b>geometrische Reihe<\/b> mit r = a/bᵈ:<br>· r &lt; 1 (d &gt; log_b a): erster Summand dominiert ⇒ O(nᵈ)<br>· r = 1 (d = log_b a): log_b n + 1 gleiche Summanden ⇒ O(nᵈ log n)<br>· r &gt; 1 (d &lt; log_b a): letzter Summand dominiert ⇒ \\(O(n^d \\cdot (a/b^d)^{\\log_b n}) = O(n^{\\log_b a})\\)"],"nachfragen":[],"frage_raw":"Leiten Sie das Mastertheorem über den Rekursionsbaum her.","antwort_raw":"\n- Ebene k: \\(a^k\\) Teilprobleme der Größe \\(n/b^k\\), Arbeit \\(a^k \\cdot O((n/b^k)^d) = O(n^d) \\cdot (a/b^d)^k\\).\n- Tiefe \\(\\log_b n\\), dort \\(a^{\\log_b n} = n^{\\log_b a}\\) Blätter.\n- Gesamt: \\(\\sum_{k=0}^{\\log_b n} O(n^d)(a/b^d)^k\\), eine **geometrische Reihe** mit r = a/bᵈ:\n  - r < 1 (d > log_b a): erster Summand dominiert ⇒ O(nᵈ)\n  - r = 1 (d = log_b a): log_b n + 1 gleiche Summanden ⇒ O(nᵈ log n)\n  - r > 1 (d < log_b a): letzter Summand dominiert ⇒ \\(O(n^d \\cdot (a/b^d)^{\\log_b n}) = O(n^{\\log_b a})\\)\n"},{"id":"kk-chomsky","kap":9,"kapitel":"Kap. 9 · Komplexitätsklassen P, NP, EXP","klausur":false,"erg":false,"frage":"<p>Wie schwer ist das Wortproblem für die Sprachen der Chomsky-Typen?<\/p>","antwort":"<p>(obere Schranken laut VL)<\/p><ul><li><b>Typ 3:<\/b> DFA bauen, n Zustandswechsel ⇒ <b>O(n)<\/b><\/li><li><b>Typ 2:<\/b> Chomsky-Normalform + <b>CYK<\/b> ⇒ <b>O(n³)<\/b><\/li><li><b>Typ 1:<\/b> nur systematisches Ausprobieren aller Satzformen bis Länge n ⇒ <b>O(kⁿ)<\/b>, k = |Σ|<\/li><li><b>Typ 0:<\/b> im Allgemeinen <b>nicht entscheidbar<\/b>, also keine Schranke<\/li><\/ul>","details":"","punkte":["<b>Typ 3:<\/b> DFA bauen, n Zustandswechsel ⇒ <b>O(n)<\/b>","<b>Typ 2:<\/b> Chomsky-Normalform + <b>CYK<\/b> ⇒ <b>O(n³)<\/b>","<b>Typ 1:<\/b> nur systematisches Ausprobieren aller Satzformen bis Länge n ⇒ <b>O(kⁿ)<\/b>, k = |Σ|","<b>Typ 0:<\/b> im Allgemeinen <b>nicht entscheidbar<\/b>, also keine Schranke"],"nachfragen":[],"frage_raw":"Wie schwer ist das Wortproblem für die Sprachen der Chomsky-Typen?","antwort_raw":"\n(obere Schranken laut VL)\n- **Typ 3:** DFA bauen, n Zustandswechsel ⇒ **O(n)**\n- **Typ 2:** Chomsky-Normalform + **CYK** ⇒ **O(n³)**\n- **Typ 1:** nur systematisches Ausprobieren aller Satzformen bis Länge n ⇒ **O(kⁿ)**, k = |Σ|\n- **Typ 0:** im Allgemeinen **nicht entscheidbar**, also keine Schranke\n"},{"id":"kk-euler-hamilton","kap":9,"kapitel":"Kap. 9 · Komplexitätsklassen P, NP, EXP","klausur":false,"erg":false,"frage":"<p>Erklären Sie den Unterschied zwischen dem Eulerkreis- und dem Hamiltonkreis-Problem.<\/p>","antwort":"<ul><li><b>Eulerkreis:<\/b> Kreis, der <b>jede Kante<\/b> genau einmal benutzt. Existiert genau dann, wenn alle Knoten <b>geraden Grad<\/b> haben (und der Graph zusammenhängend ist) ⇒ effizient prüfbar, <b>in P<\/b>.<\/li><li><b>Hamiltonkreis:<\/b> Kreis, der <b>jeden Knoten<\/b> genau einmal besucht. Bekannt sind nur Algorithmen wie das Ausprobieren aller Permutationen, <b>O(n!)<\/b>. Das Problem ist <b>NP-vollständig<\/b>.<\/li><li>Graphen werden als Adjazenzmatrix kodiert, also als Wort über {0,1}. So werden beide Probleme zu Wortproblemen.<\/li><\/ul>","details":"","punkte":["<b>Eulerkreis:<\/b> Kreis, der <b>jede Kante<\/b> genau einmal benutzt. Existiert genau dann, wenn alle Knoten <b>geraden Grad<\/b> haben (und der Graph zusammenhängend ist) ⇒ effizient prüfbar, <b>in P<\/b>.","<b>Hamiltonkreis:<\/b> Kreis, der <b>jeden Knoten<\/b> genau einmal besucht. Bekannt sind nur Algorithmen wie das Ausprobieren aller Permutationen, <b>O(n!)<\/b>. Das Problem ist <b>NP-vollständig<\/b>.","Graphen werden als Adjazenzmatrix kodiert, also als Wort über {0,1}. So werden beide Probleme zu Wortproblemen."],"nachfragen":[{"q":"Hat der abgebildete Graph einen Eulerkreis?","a":"<p>Nein, die Grade sind A: 2, B: 2, C: 1, D: 3, also nicht alle gerade. Einen Hamiltonkreis hat er auch nicht: C hat Grad 1.<\/p>","q_raw":"Hat der abgebildete Graph einen Eulerkreis?","a_raw":"Nein, die Grade sind A: 2, B: 2, C: 1, D: 3, also nicht alle gerade. Einen Hamiltonkreis hat er auch nicht: C hat Grad 1."},{"q":"Warum ist der Unterschied so bemerkenswert?","a":"<p>Die Probleme klingen fast gleich (Kanten statt Knoten), liegen aber vermutlich auf verschiedenen Seiten der Grenze P / NP-vollständig.<\/p>","q_raw":"Warum ist der Unterschied so bemerkenswert?","a_raw":"Die Probleme klingen fast gleich (Kanten statt Knoten), liegen aber vermutlich auf verschiedenen Seiten der Grenze P / NP-vollständig."}],"frage_raw":"Erklären Sie den Unterschied zwischen dem Eulerkreis- und dem Hamiltonkreis-Problem.","antwort_raw":"\n- **Eulerkreis:** Kreis, der **jede Kante** genau einmal benutzt. Existiert genau dann, wenn alle Knoten **geraden Grad** haben (und der Graph zusammenhängend ist) ⇒ effizient prüfbar, **in P**.\n- **Hamiltonkreis:** Kreis, der **jeden Knoten** genau einmal besucht. Bekannt sind nur Algorithmen wie das Ausprobieren aller Permutationen, **O(n!)**. Das Problem ist **NP-vollständig**.\n- Graphen werden als Adjazenzmatrix kodiert, also als Wort über {0,1}. So werden beide Probleme zu Wortproblemen.\n"},{"id":"kk-P","kap":9,"kapitel":"Kap. 9 · Komplexitätsklassen P, NP, EXP","klausur":false,"erg":false,"frage":"<p>Definieren Sie die Klasse P. Warum gerade „polynomial“?<\/p>","antwort":"<ul><li><b>L ∈ P<\/b>, wenn eine <b>deterministische TM<\/b> das Wortproblem in <b>polynomialer Zeit O(nᵏ)<\/b> löst.<\/li><li>P = die <b>effizient lösbaren<\/b> Probleme. Beispiele: Sortieren, Suchen, kürzeste Wege, Eulerkreis.<\/li><li>Warum polynomial? P ist <b>robust<\/b>: Äquivalente Maschinenmodelle simulieren sich gegenseitig mit polynomialem Mehraufwand. Beispiel: Eine 1-Band-TM simuliert eine 2-Band-TM in ~n² Schritten. Außerdem sind Polynome abgeschlossen unter Addition, Multiplikation und Einsetzen.<\/li><\/ul>","details":"","punkte":["<b>L ∈ P<\/b>, wenn eine <b>deterministische TM<\/b> das Wortproblem in <b>polynomialer Zeit O(nᵏ)<\/b> löst.","P = die <b>effizient lösbaren<\/b> Probleme. Beispiele: Sortieren, Suchen, kürzeste Wege, Eulerkreis.","Warum polynomial? P ist <b>robust<\/b>: Äquivalente Maschinenmodelle simulieren sich gegenseitig mit polynomialem Mehraufwand. Beispiel: Eine 1-Band-TM simuliert eine 2-Band-TM in ~n² Schritten. Außerdem sind Polynome abgeschlossen unter Addition, Multiplikation und Einsetzen."],"nachfragen":[{"q":"Ist O(n¹⁰⁰) wirklich effizient?","a":"<p>Praktisch nicht unbedingt. Polynomialzeit ist ein <b>theoretisches<\/b> Kriterium mit guten Abschlusseigenschaften, und natürliche Probleme in P haben meist kleine Exponenten.<\/p>","q_raw":"Ist O(n¹⁰⁰) wirklich effizient?","a_raw":"Praktisch nicht unbedingt. Polynomialzeit ist ein **theoretisches** Kriterium mit guten Abschlusseigenschaften, und natürliche Probleme in P haben meist kleine Exponenten."}],"frage_raw":"Definieren Sie die Klasse P. Warum gerade „polynomial“?","antwort_raw":"\n- **L ∈ P**, wenn eine **deterministische TM** das Wortproblem in **polynomialer Zeit O(nᵏ)** löst.\n- P = die **effizient lösbaren** Probleme. Beispiele: Sortieren, Suchen, kürzeste Wege, Eulerkreis.\n- Warum polynomial? P ist **robust**: Äquivalente Maschinenmodelle simulieren sich gegenseitig mit polynomialem Mehraufwand. Beispiel: Eine 1-Band-TM simuliert eine 2-Band-TM in ~n² Schritten. Außerdem sind Polynome abgeschlossen unter Addition, Multiplikation und Einsetzen.\n"},{"id":"kk-EXP-NP","kap":9,"kapitel":"Kap. 9 · Komplexitätsklassen P, NP, EXP","klausur":false,"erg":false,"frage":"<p>Definieren Sie EXP und NP. Wie hängen P, NP und EXP zusammen?<\/p>","antwort":"<ul><li><b>EXP:<\/b> Wortproblem durch eine deterministische TM in <b>O(kⁿ)<\/b> lösbar. Nicht effizient lösbar, z. B. Schach, Go (verallgemeinert).<\/li><li><b>NP:<\/b> Wortproblem durch eine <b>nichtdeterministische TM<\/b> in <b>polynomialer Zeit<\/b> lösbar. Vermutlich nicht effizient lösbar, z. B. Hamiltonkreis, Clique, SAT.<\/li><li><b>P ⊆ NP ⊆ EXP<\/b><ul><li>P ⊆ NP: Eine DTM ist ein Spezialfall einer NTM.<\/li><li>NP ⊆ EXP: Eine DTM simuliert eine NTM, indem sie alle Rechenwege durchprobiert; für n NTM-Schritte schlimmstenfalls kⁿ Schritte.<\/li><\/ul><\/li><li>Ob P ≠ NP gilt, ist <b>offen<\/b>.<\/li><\/ul>","details":"","punkte":["<b>EXP:<\/b> Wortproblem durch eine deterministische TM in <b>O(kⁿ)<\/b> lösbar. Nicht effizient lösbar, z. B. Schach, Go (verallgemeinert).","<b>NP:<\/b> Wortproblem durch eine <b>nichtdeterministische TM<\/b> in <b>polynomialer Zeit<\/b> lösbar. Vermutlich nicht effizient lösbar, z. B. Hamiltonkreis, Clique, SAT.","<b>P ⊆ NP ⊆ EXP<\/b><br>· P ⊆ NP: Eine DTM ist ein Spezialfall einer NTM.<br>· NP ⊆ EXP: Eine DTM simuliert eine NTM, indem sie alle Rechenwege durchprobiert; für n NTM-Schritte schlimmstenfalls kⁿ Schritte.","Ob P ≠ NP gilt, ist <b>offen<\/b>."],"nachfragen":[{"q":"Weiß man, dass P ≠ EXP? (Ergänzung)","a":"<p>Ja, nach dem Zeithierarchiesatz ist P ⊊ EXP. Also ist mindestens eine der Inklusionen P ⊆ NP oder NP ⊆ EXP echt. Welche, weiß man nicht.<\/p>","q_raw":"Weiß man, dass P ≠ EXP? (Ergänzung)","a_raw":"Ja, nach dem Zeithierarchiesatz ist P ⊊ EXP. Also ist mindestens eine der Inklusionen P ⊆ NP oder NP ⊆ EXP echt. Welche, weiß man nicht."}],"frage_raw":"Definieren Sie EXP und NP. Wie hängen P, NP und EXP zusammen?","antwort_raw":"\n- **EXP:** Wortproblem durch eine deterministische TM in **O(kⁿ)** lösbar. Nicht effizient lösbar, z. B. Schach, Go (verallgemeinert).\n- **NP:** Wortproblem durch eine **nichtdeterministische TM** in **polynomialer Zeit** lösbar. Vermutlich nicht effizient lösbar, z. B. Hamiltonkreis, Clique, SAT.\n- **P ⊆ NP ⊆ EXP**\n  - P ⊆ NP: Eine DTM ist ein Spezialfall einer NTM.\n  - NP ⊆ EXP: Eine DTM simuliert eine NTM, indem sie alle Rechenwege durchprobiert; für n NTM-Schritte schlimmstenfalls kⁿ Schritte.\n- Ob P ≠ NP gilt, ist **offen**.\n"},{"id":"kk-verifizierer","kap":9,"kapitel":"Kap. 9 · Komplexitätsklassen P, NP, EXP","klausur":false,"erg":false,"frage":"<p>Was sind Zertifikat und Verifizierer? Wie charakterisiert man damit NP?<\/p>","antwort":"<ul><li><b>Zertifikat<\/b> v: ein Hinweis (z. B. ein Lösungskandidat), mit dessen Hilfe man w ∈ L in Polynomialzeit <b>positiv<\/b> bestätigen kann.<\/li><li><b>Verifizierer<\/b> M<sub>V<\/sub>: eine TM, die bei Eingabe (w, v) in <b>polynomialer Zeit<\/b> prüft, ob v ein gültiges Zertifikat für w ist.<\/li><li><b>NP = Menge der Sprachen mit einem Polynomialzeit-Verifizierer<\/b>: Lösungen sind schwer zu <b>finden<\/b>, aber leicht zu <b>prüfen<\/b>.<\/li><\/ul>","details":"","punkte":["<b>Zertifikat<\/b> v: ein Hinweis (z. B. ein Lösungskandidat), mit dessen Hilfe man w ∈ L in Polynomialzeit <b>positiv<\/b> bestätigen kann.","<b>Verifizierer<\/b> M<sub>V<\/sub>: eine TM, die bei Eingabe (w, v) in <b>polynomialer Zeit<\/b> prüft, ob v ein gültiges Zertifikat für w ist.","<b>NP = Menge der Sprachen mit einem Polynomialzeit-Verifizierer<\/b>: Lösungen sind schwer zu <b>finden<\/b>, aber leicht zu <b>prüfen<\/b>."],"nachfragen":[{"q":"Beispiel Hamiltonkreis?","a":"<p>Zertifikat: eine Knotenfolge (k<sub>a<\/sub>, k<sub>b<\/sub>, …, k<sub>a<\/sub>). Prüfen, ob jeder Knoten genau einmal vorkommt und aufeinanderfolgende Knoten verbunden sind: O(n) bzw. polynomial.<\/p>","q_raw":"Beispiel Hamiltonkreis?","a_raw":"Zertifikat: eine Knotenfolge (k_a, k_b, …, k_a). Prüfen, ob jeder Knoten genau einmal vorkommt und aufeinanderfolgende Knoten verbunden sind: O(n) bzw. polynomial."},{"q":"Beispiel Faktorisierung?","a":"<p>Zertifikat: die Primfaktoren. Ausmultiplizieren ist einfach, Finden ist (vermutlich) schwer.<\/p>","q_raw":"Beispiel Faktorisierung?","a_raw":"Zertifikat: die Primfaktoren. Ausmultiplizieren ist einfach, Finden ist (vermutlich) schwer."},{"q":"Warum ist das äquivalent zur NTM-Definition?","a":"<p>Die NTM rät das Zertifikat nichtdeterministisch und verifiziert es dann. Umgekehrt ist die Folge der nichtdeterministischen Entscheidungen einer akzeptierenden Rechnung ein Zertifikat.<\/p>","q_raw":"Warum ist das äquivalent zur NTM-Definition?","a_raw":"Die NTM rät das Zertifikat nichtdeterministisch und verifiziert es dann. Umgekehrt ist die Folge der nichtdeterministischen Entscheidungen einer akzeptierenden Rechnung ein Zertifikat."},{"q":"Muss man auch „Nein“ leicht prüfen können?","a":"<p>Nein, nur positive Instanzen brauchen ein Zertifikat. Leicht prüfbare Nein-Antworten beschreibt die Klasse <b>coNP<\/b> (Ergänzung).<\/p>","q_raw":"Muss man auch „Nein“ leicht prüfen können?","a_raw":"Nein, nur positive Instanzen brauchen ein Zertifikat. Leicht prüfbare Nein-Antworten beschreibt die Klasse **coNP** (Ergänzung)."}],"frage_raw":"Was sind Zertifikat und Verifizierer? Wie charakterisiert man damit NP?","antwort_raw":"\n- **Zertifikat** v: ein Hinweis (z. B. ein Lösungskandidat), mit dessen Hilfe man w ∈ L in Polynomialzeit **positiv** bestätigen kann.\n- **Verifizierer** M_V: eine TM, die bei Eingabe (w, v) in **polynomialer Zeit** prüft, ob v ein gültiges Zertifikat für w ist.\n- **NP = Menge der Sprachen mit einem Polynomialzeit-Verifizierer**: Lösungen sind schwer zu **finden**, aber leicht zu **prüfen**.\n"},{"id":"np-reduktion","kap":9,"kapitel":"Kap. 9 · Komplexitätsklassen P, NP, EXP","klausur":false,"erg":false,"frage":"<p>Was ist eine polynomielle Reduktion, und welche Schlüsse erlaubt sie?<\/p>","antwort":"<ul><li><b>L<sub>A<\/sub> ≤_poly L<sub>B<\/sub><\/b>, wenn L<sub>A<\/sub> ≤ L<sub>B<\/sub> mit einer <b>in Polynomialzeit berechenbaren<\/b> Reduktionsfunktion f (w ∈ L<sub>A<\/sub> ⇔ f(w) ∈ L<sub>B<\/sub>).<\/li><li>Folgerungen:<ul><li>L<sub>B<\/sub> ∈ P ⇒ L<sub>A<\/sub> ∈ P, und L<sub>A<\/sub> ∉ P ⇒ L<sub>B<\/sub> ∉ P<\/li><li>L<sub>B<\/sub> ∈ NP ⇒ L<sub>A<\/sub> ∈ NP<\/li><\/ul><\/li><li>Transitiv: aus A ≤_poly B und B ≤_poly C folgt A ≤_poly C (Polynome verketten sich zu Polynomen).<\/li><\/ul>","details":"","punkte":["<b>L<sub>A<\/sub> ≤_poly L<sub>B<\/sub><\/b>, wenn L<sub>A<\/sub> ≤ L<sub>B<\/sub> mit einer <b>in Polynomialzeit berechenbaren<\/b> Reduktionsfunktion f (w ∈ L<sub>A<\/sub> ⇔ f(w) ∈ L<sub>B<\/sub>).","Folgerungen:<br>· L<sub>B<\/sub> ∈ P ⇒ L<sub>A<\/sub> ∈ P, und L<sub>A<\/sub> ∉ P ⇒ L<sub>B<\/sub> ∉ P<br>· L<sub>B<\/sub> ∈ NP ⇒ L<sub>A<\/sub> ∈ NP","Transitiv: aus A ≤_poly B und B ≤_poly C folgt A ≤_poly C (Polynome verketten sich zu Polynomen)."],"nachfragen":[{"q":"Warum muss f polynomial sein (und nicht nur berechenbar)?","a":"<p>Sonst könnte die Reduktion selbst exponentiell lange dauern, und „L<sub>B<\/sub> effizient ⇒ L<sub>A<\/sub> effizient“ wäre falsch. Beachte: |f(w)| ist dann ebenfalls polynomial in |w|.<\/p>","q_raw":"Warum muss f polynomial sein (und nicht nur berechenbar)?","a_raw":"Sonst könnte die Reduktion selbst exponentiell lange dauern, und „L_B effizient ⇒ L_A effizient“ wäre falsch. Beachte: |f(w)| ist dann ebenfalls polynomial in |w|."}],"frage_raw":"Was ist eine polynomielle Reduktion, und welche Schlüsse erlaubt sie?","antwort_raw":"\n- **L_A ≤_poly L_B**, wenn L_A ≤ L_B mit einer **in Polynomialzeit berechenbaren** Reduktionsfunktion f (w ∈ L_A ⇔ f(w) ∈ L_B).\n- Folgerungen:\n  - L_B ∈ P ⇒ L_A ∈ P, und L_A ∉ P ⇒ L_B ∉ P\n  - L_B ∈ NP ⇒ L_A ∈ NP\n- Transitiv: aus A ≤_poly B und B ≤_poly C folgt A ≤_poly C (Polynome verketten sich zu Polynomen).\n"},{"id":"np-vollst","kap":9,"kapitel":"Kap. 9 · Komplexitätsklassen P, NP, EXP","klausur":false,"erg":false,"frage":"<p>Was bedeutet NP-vollständig? Warum sind diese Probleme für P vs. NP so wichtig?<\/p>","antwort":"<p>L ist <b>NP-vollständig<\/b>, wenn<\/p><ol><li>L ∈ NP und<\/li><li><b>jedes<\/b> L′ ∈ NP polynomiell auf L reduzierbar ist (L′ ≤_poly L).<\/li><\/ol><p>Sie sind die „schwersten“ Probleme in NP:<\/p><ul><li>Ist <b>ein<\/b> NP-vollständiges Problem in P ⇒ <b>P = NP<\/b>.<\/li><li>Ist <b>ein<\/b> NP-vollständiges Problem nachweislich nicht in P ⇒ <b>P ≠ NP<\/b>.<\/li><\/ul><p>Beispiele: SAT, Hamiltonkreis, Clique, 3-SAT, Vertex Cover, TSP (Entscheidungsvariante).<\/p>","details":"","punkte":["L ∈ NP und","<b>jedes<\/b> L′ ∈ NP polynomiell auf L reduzierbar ist (L′ ≤_poly L).","Ist <b>ein<\/b> NP-vollständiges Problem in P ⇒ <b>P = NP<\/b>.","Ist <b>ein<\/b> NP-vollständiges Problem nachweislich nicht in P ⇒ <b>P ≠ NP<\/b>."],"nachfragen":[{"q":"Was ist NP-schwer? (Ergänzung)","a":"<p>Nur Bedingung 2. Ein NP-schweres Problem muss nicht in NP liegen (z. B. das Halteproblem ist NP-schwer, aber unentscheidbar).<\/p>","q_raw":"Was ist NP-schwer? (Ergänzung)","a_raw":"Nur Bedingung 2. Ein NP-schweres Problem muss nicht in NP liegen (z. B. das Halteproblem ist NP-schwer, aber unentscheidbar)."},{"q":"Wie zeigt man NP-Vollständigkeit eines neuen Problems L?","a":"<p>(1) L ∈ NP (Zertifikat + Polynomialzeit-Verifizierer) und (2) ein <b>bekanntes<\/b> NP-vollständiges L′ mit L′ ≤_poly L. Wegen der Transitivität reicht ein einziges.<\/p>","q_raw":"Wie zeigt man NP-Vollständigkeit eines neuen Problems L?","a_raw":"(1) L ∈ NP (Zertifikat + Polynomialzeit-Verifizierer) und (2) ein **bekanntes** NP-vollständiges L′ mit L′ ≤_poly L. Wegen der Transitivität reicht ein einziges."}],"frage_raw":"Was bedeutet NP-vollständig? Warum sind diese Probleme für P vs. NP so wichtig?","antwort_raw":"\nL ist **NP-vollständig**, wenn\n1. L ∈ NP und\n2. **jedes** L′ ∈ NP polynomiell auf L reduzierbar ist (L′ ≤_poly L).\n\nSie sind die „schwersten“ Probleme in NP:\n- Ist **ein** NP-vollständiges Problem in P ⇒ **P = NP**.\n- Ist **ein** NP-vollständiges Problem nachweislich nicht in P ⇒ **P ≠ NP**.\n\nBeispiele: SAT, Hamiltonkreis, Clique, 3-SAT, Vertex Cover, TSP (Entscheidungsvariante).\n"},{"id":"np-cook","kap":9,"kapitel":"Kap. 9 · Komplexitätsklassen P, NP, EXP","klausur":false,"erg":true,"frage":"<p>Was besagt der Satz von Cook und Levin, und was ist die Beweisidee?<\/p>","antwort":"<ul><li><b>Satz:<\/b> <b>SAT<\/b> (Erfüllbarkeit aussagenlogischer Formeln) ist <b>NP-vollständig<\/b>. Es war das erste bekannte NP-vollständige Problem (1971).<\/li><li>SAT ∈ NP: Zertifikat ist eine Belegung, Auswerten geht in Polynomialzeit.<\/li><li><b>Beweisidee<\/b> für „NP-schwer“: Für jede NTM M mit polynomialer Laufzeit p(n) und jede Eingabe w baut man in Polynomialzeit eine Formel φ, die genau dann erfüllbar ist, wenn M w akzeptiert. Variablen beschreiben „Zustand zur Zeit t“, „Kopfposition zur Zeit t“ und „Bandinhalt in Zelle i zur Zeit t“ (Tabelle der Größe p(n) × p(n)). Klauseln erzwingen Startkonfiguration, korrekte Übergänge und das Erreichen eines Endzustands.<\/li><\/ul>","details":"","punkte":["<b>Satz:<\/b> <b>SAT<\/b> (Erfüllbarkeit aussagenlogischer Formeln) ist <b>NP-vollständig<\/b>. Es war das erste bekannte NP-vollständige Problem (1971).","SAT ∈ NP: Zertifikat ist eine Belegung, Auswerten geht in Polynomialzeit.","<b>Beweisidee<\/b> für „NP-schwer“: Für jede NTM M mit polynomialer Laufzeit p(n) und jede Eingabe w baut man in Polynomialzeit eine Formel φ, die genau dann erfüllbar ist, wenn M w akzeptiert. Variablen beschreiben „Zustand zur Zeit t“, „Kopfposition zur Zeit t“ und „Bandinhalt in Zelle i zur Zeit t“ (Tabelle der Größe p(n) × p(n)). Klauseln erzwingen Startkonfiguration, korrekte Übergänge und das Erreichen eines Endzustands."],"nachfragen":[{"q":"Warum ist das so zentral?","a":"<p>Ab dann zeigt man NP-Vollständigkeit per Reduktion von SAT (bzw. 3-SAT) aus, statt jedes Mal alle NP-Probleme zu kodieren.<\/p>","q_raw":"Warum ist das so zentral?","a_raw":"Ab dann zeigt man NP-Vollständigkeit per Reduktion von SAT (bzw. 3-SAT) aus, statt jedes Mal alle NP-Probleme zu kodieren."}],"frage_raw":"Was besagt der Satz von Cook und Levin, und was ist die Beweisidee?","antwort_raw":"\n- **Satz:** **SAT** (Erfüllbarkeit aussagenlogischer Formeln) ist **NP-vollständig**. Es war das erste bekannte NP-vollständige Problem (1971).\n- SAT ∈ NP: Zertifikat ist eine Belegung, Auswerten geht in Polynomialzeit.\n- **Beweisidee** für „NP-schwer“: Für jede NTM M mit polynomialer Laufzeit p(n) und jede Eingabe w baut man in Polynomialzeit eine Formel φ, die genau dann erfüllbar ist, wenn M w akzeptiert. Variablen beschreiben „Zustand zur Zeit t“, „Kopfposition zur Zeit t“ und „Bandinhalt in Zelle i zur Zeit t“ (Tabelle der Größe p(n) × p(n)). Klauseln erzwingen Startkonfiguration, korrekte Übergänge und das Erreichen eines Endzustands.\n"},{"id":"np-folgen","kap":9,"kapitel":"Kap. 9 · Komplexitätsklassen P, NP, EXP","klausur":false,"erg":true,"frage":"<p>Was wäre, wenn P = NP? Und warum glauben die meisten an P ≠ NP?<\/p>","antwort":"<ul><li>P = NP hieße: Alles, was sich effizient <b>prüfen<\/b> lässt, lässt sich auch effizient <b>finden<\/b>.<\/li><li>Folgen: Viele Optimierungs- und Planungsprobleme wären effizient lösbar. Viele Verschlüsselungsverfahren beruhen aber darauf, dass bestimmte Probleme schwer zu lösen sind; sie würden ihre Grundlage verlieren.<\/li><li>Trotz jahrzehntelanger Suche kennt man für kein NP-vollständiges Problem einen Polynomialzeit-Algorithmus ⇒ die Mehrheit vermutet P ≠ NP. Bewiesen ist es nicht (Millennium-Problem).<\/li><\/ul>","details":"","punkte":["P = NP hieße: Alles, was sich effizient <b>prüfen<\/b> lässt, lässt sich auch effizient <b>finden<\/b>.","Folgen: Viele Optimierungs- und Planungsprobleme wären effizient lösbar. Viele Verschlüsselungsverfahren beruhen aber darauf, dass bestimmte Probleme schwer zu lösen sind; sie würden ihre Grundlage verlieren.","Trotz jahrzehntelanger Suche kennt man für kein NP-vollständiges Problem einen Polynomialzeit-Algorithmus ⇒ die Mehrheit vermutet P ≠ NP. Bewiesen ist es nicht (Millennium-Problem)."],"nachfragen":[],"frage_raw":"Was wäre, wenn P = NP? Und warum glauben die meisten an P ≠ NP?","antwort_raw":"\n- P = NP hieße: Alles, was sich effizient **prüfen** lässt, lässt sich auch effizient **finden**.\n- Folgen: Viele Optimierungs- und Planungsprobleme wären effizient lösbar. Viele Verschlüsselungsverfahren beruhen aber darauf, dass bestimmte Probleme schwer zu lösen sind; sie würden ihre Grundlage verlieren.\n- Trotz jahrzehntelanger Suche kennt man für kein NP-vollständiges Problem einen Polynomialzeit-Algorithmus ⇒ die Mehrheit vermutet P ≠ NP. Bewiesen ist es nicht (Millennium-Problem).\n"},{"id":"np-unterschied","kap":9,"kapitel":"Kap. 9 · Komplexitätsklassen P, NP, EXP","klausur":false,"erg":false,"frage":"<p>Was ist der Unterschied zwischen „unentscheidbar“ und „NP-vollständig“?<\/p>","antwort":"<ul><li><b>Unentscheidbar<\/b> (z. B. Halteproblem): Es gibt <b>prinzipiell keinen<\/b> Algorithmus, auch nicht mit beliebig viel Zeit.<\/li><li><b>NP-vollständig<\/b> (z. B. SAT): Es <b>gibt<\/b> Algorithmen (z. B. alle Belegungen ausprobieren, exponentiell). Man kennt aber vermutlich keine <b>effizienten<\/b>: „praktisch unlösbar“ für große Eingaben.<\/li><li>Das ist genau die Einteilung vom Anfang der VL: unlösbar | lösbar, aber nicht effizient | effizient lösbar.<\/li><\/ul>","details":"","punkte":["<b>Unentscheidbar<\/b> (z. B. Halteproblem): Es gibt <b>prinzipiell keinen<\/b> Algorithmus, auch nicht mit beliebig viel Zeit.","<b>NP-vollständig<\/b> (z. B. SAT): Es <b>gibt<\/b> Algorithmen (z. B. alle Belegungen ausprobieren, exponentiell). Man kennt aber vermutlich keine <b>effizienten<\/b>: „praktisch unlösbar“ für große Eingaben.","Das ist genau die Einteilung vom Anfang der VL: unlösbar | lösbar, aber nicht effizient | effizient lösbar."],"nachfragen":[],"frage_raw":"Was ist der Unterschied zwischen „unentscheidbar“ und „NP-vollständig“?","antwort_raw":"\n- **Unentscheidbar** (z. B. Halteproblem): Es gibt **prinzipiell keinen** Algorithmus, auch nicht mit beliebig viel Zeit.\n- **NP-vollständig** (z. B. SAT): Es **gibt** Algorithmen (z. B. alle Belegungen ausprobieren, exponentiell). Man kennt aber vermutlich keine **effizienten**: „praktisch unlösbar“ für große Eingaben.\n- Das ist genau die Einteilung vom Anfang der VL: unlösbar | lösbar, aber nicht effizient | effizient lösbar.\n"},{"id":"zs-roter-faden","kap":10,"kapitel":"Kap. 10 · Zusammenhänge und Prüfungssimulation","klausur":false,"erg":false,"frage":"<p>Geben Sie in zwei bis drei Minuten einen Überblick über die Vorlesung.<\/p>","antwort":"<ol><li><b>Frage:<\/b> Was ist algorithmisch lösbar (Berechenbarkeit), und wie schwer ist es (Komplexität)?<\/li><li><b>Sprache der Theorie:<\/b> Probleme als Wortproblem „w ∈ L?“; Grammatiken erzeugen, Automaten akzeptieren.<\/li><li><b>Endliche Automaten:<\/b> DFA = NFA = NFAε = reguläre Grammatik (Rabin-Scott). Grenzen per Pumping-Lemma und Myhill-Nerode; Minimalautomat.<\/li><li><b>Kellerautomaten:<\/b> NPDA = kontextfrei (Typ 2), NPDA ⊋ DPDA; Pumping-Lemma für CF; CYK in O(n³).<\/li><li><b>Turingmaschinen:<\/b> das allgemeinste Modell (Church-Turing). Entscheidbar vs. semi-entscheidbar; UTM.<\/li><li><b>Grenzen:<\/b> Diagonalisierung ⇒ unberechenbare Funktionen, Halteproblem unentscheidbar; Reduktionen, Satz von Rice.<\/li><li><b>Komplexität:<\/b> Landau, Mastertheorem; P ⊆ NP ⊆ EXP; NP-Vollständigkeit, P vs. NP offen.<\/li><\/ol>","details":"","punkte":["<b>Frage:<\/b> Was ist algorithmisch lösbar (Berechenbarkeit), und wie schwer ist es (Komplexität)?","<b>Sprache der Theorie:<\/b> Probleme als Wortproblem „w ∈ L?“; Grammatiken erzeugen, Automaten akzeptieren.","<b>Endliche Automaten:<\/b> DFA = NFA = NFAε = reguläre Grammatik (Rabin-Scott). Grenzen per Pumping-Lemma und Myhill-Nerode; Minimalautomat.","<b>Kellerautomaten:<\/b> NPDA = kontextfrei (Typ 2), NPDA ⊋ DPDA; Pumping-Lemma für CF; CYK in O(n³).","<b>Turingmaschinen:<\/b> das allgemeinste Modell (Church-Turing). Entscheidbar vs. semi-entscheidbar; UTM.","<b>Grenzen:<\/b> Diagonalisierung ⇒ unberechenbare Funktionen, Halteproblem unentscheidbar; Reduktionen, Satz von Rice.","<b>Komplexität:<\/b> Landau, Mastertheorem; P ⊆ NP ⊆ EXP; NP-Vollständigkeit, P vs. NP offen."],"nachfragen":[],"frage_raw":"Geben Sie in zwei bis drei Minuten einen Überblick über die Vorlesung.","antwort_raw":"\n1. **Frage:** Was ist algorithmisch lösbar (Berechenbarkeit), und wie schwer ist es (Komplexität)?\n2. **Sprache der Theorie:** Probleme als Wortproblem „w ∈ L?“; Grammatiken erzeugen, Automaten akzeptieren.\n3. **Endliche Automaten:** DFA = NFA = NFAε = reguläre Grammatik (Rabin-Scott). Grenzen per Pumping-Lemma und Myhill-Nerode; Minimalautomat.\n4. **Kellerautomaten:** NPDA = kontextfrei (Typ 2), NPDA ⊋ DPDA; Pumping-Lemma für CF; CYK in O(n³).\n5. **Turingmaschinen:** das allgemeinste Modell (Church-Turing). Entscheidbar vs. semi-entscheidbar; UTM.\n6. **Grenzen:** Diagonalisierung ⇒ unberechenbare Funktionen, Halteproblem unentscheidbar; Reduktionen, Satz von Rice.\n7. **Komplexität:** Landau, Mastertheorem; P ⊆ NP ⊆ EXP; NP-Vollständigkeit, P vs. NP offen.\n"},{"id":"zs-modelle","kap":10,"kapitel":"Kap. 10 · Zusammenhänge und Prüfungssimulation","klausur":false,"erg":false,"frage":"<p>Vergleichen Sie DFA, NPDA und Turingmaschine.<\/p>","antwort":"<table class='tab'><tr><th><\/th><th>DFA<\/th><th>NPDA<\/th><th>TM<\/th><\/tr><tr><td>Speicher<\/td><td>nur Zustände<\/td><td>+ Keller (LIFO)<\/td><td>Band, beliebig les-/schreibbar<\/td><\/tr><tr><td>Kopf<\/td><td>nur rechts<\/td><td>nur rechts / ε<\/td><td>rechts, links, stehen<\/td><\/tr><tr><td>Akzeptanz<\/td><td>Endzustand am Wortende<\/td><td>leerer Keller<\/td><td>Endzustand erreichen (hält sofort)<\/td><\/tr><tr><td>Sprachen<\/td><td>Typ 3 (regulär)<\/td><td>Typ 2 (kontextfrei)<\/td><td>Typ 0 (semi-entscheidbar)<\/td><\/tr><tr><td>Wortproblem<\/td><td>O(n)<\/td><td>O(n³) (CYK)<\/td><td>i. A. unentscheidbar<\/td><\/tr><tr><td>Hält immer?<\/td><td>ja<\/td><td>(geeignet konstruierbar)<\/td><td><b>nein<\/b><\/td><\/tr><\/table>","details":"","punkte":["<table class='tab'><tr><th><\/th><th>DFA<\/th><th>NPDA<\/th><th>TM<\/th><\/tr><tr><td>Speicher<\/td><td>nur Zustände<\/td><td>+ Keller (LIFO)<\/td><td>Band, beliebig les-/schreibbar<\/td><\/tr><tr><td>Kopf<\/td><td>nur rechts<\/td><td>nur rechts / ε<\/td><td>rechts, links, stehen<\/td><\/tr><tr><td>Akzeptanz<\/td><td>Endzustand am Wortende<\/td><td>leerer Keller<\/td><td>Endzustand erreichen (hält sofort)<\/td><\/tr><tr><td>Sprachen<\/td><td>Typ 3 (regulär)<\/td><td>Typ 2 (kontextfrei)<\/td><td>Typ 0 (semi-entscheidbar)<\/td><\/tr><tr><td>Wortproblem<\/td><td>O(n)<\/td><td>O(n³) (CYK)<\/td><td>i. A. unentscheidbar<\/td><\/tr><tr><td>Hält immer?<\/td><td>ja<\/td><td>(geeignet konstruierbar)<\/td><td><b>nein<\/b><\/td><\/tr><\/table>"],"nachfragen":[],"frage_raw":"Vergleichen Sie DFA, NPDA und Turingmaschine.","antwort_raw":"\n| | DFA | NPDA | TM |\n|---|---|---|---|\n| Speicher | nur Zustände | + Keller (LIFO) | Band, beliebig les-/schreibbar |\n| Kopf | nur rechts | nur rechts / ε | rechts, links, stehen |\n| Akzeptanz | Endzustand am Wortende | leerer Keller | Endzustand erreichen (hält sofort) |\n| Sprachen | Typ 3 (regulär) | Typ 2 (kontextfrei) | Typ 0 (semi-entscheidbar) |\n| Wortproblem | O(n) | O(n³) (CYK) | i. A. unentscheidbar |\n| Hält immer? | ja | (geeignet konstruierbar) | **nein** |\n"},{"id":"zs-nichtdeterminismus","kap":10,"kapitel":"Kap. 10 · Zusammenhänge und Prüfungssimulation","klausur":false,"erg":false,"frage":"<p>Welche Rolle spielt Nichtdeterminismus bei den verschiedenen Modellen?<\/p>","antwort":"<ul><li><b>Endliche Automaten:<\/b> <b>keine<\/b> Mehrmacht (Rabin-Scott), aber exponentiell kompaktere Darstellung möglich.<\/li><li><b>Kellerautomaten:<\/b> <b>echte<\/b> Mehrmacht: NPDA ⊋ DPDA (z. B. \\(\\{ww^R\\}\\)).<\/li><li><b>Turingmaschinen, Berechenbarkeit:<\/b> keine Mehrmacht, denn eine DTM kann alle Rechenwege einer NTM durchprobieren.<\/li><li><b>Turingmaschinen, Effizienz:<\/b> genau die offene Frage <b>P vs. NP<\/b>. Die Simulation kostet bisher exponentiell viel Zeit.<\/li><\/ul>","details":"","punkte":["<b>Endliche Automaten:<\/b> <b>keine<\/b> Mehrmacht (Rabin-Scott), aber exponentiell kompaktere Darstellung möglich.","<b>Kellerautomaten:<\/b> <b>echte<\/b> Mehrmacht: NPDA ⊋ DPDA (z. B. \\(\\{ww^R\\}\\)).","<b>Turingmaschinen, Berechenbarkeit:<\/b> keine Mehrmacht, denn eine DTM kann alle Rechenwege einer NTM durchprobieren.","<b>Turingmaschinen, Effizienz:<\/b> genau die offene Frage <b>P vs. NP<\/b>. Die Simulation kostet bisher exponentiell viel Zeit."],"nachfragen":[],"frage_raw":"Welche Rolle spielt Nichtdeterminismus bei den verschiedenen Modellen?","antwort_raw":"\n- **Endliche Automaten:** **keine** Mehrmacht (Rabin-Scott), aber exponentiell kompaktere Darstellung möglich.\n- **Kellerautomaten:** **echte** Mehrmacht: NPDA ⊋ DPDA (z. B. \\(\\{ww^R\\}\\)).\n- **Turingmaschinen, Berechenbarkeit:** keine Mehrmacht, denn eine DTM kann alle Rechenwege einer NTM durchprobieren.\n- **Turingmaschinen, Effizienz:** genau die offene Frage **P vs. NP**. Die Simulation kostet bisher exponentiell viel Zeit.\n"},{"id":"zs-diagonal","kap":10,"kapitel":"Kap. 10 · Zusammenhänge und Prüfungssimulation","klausur":true,"erg":false,"frage":"<p>Wo kommt in der Vorlesung Diagonalisierung vor, und was ist das gemeinsame Prinzip?<\/p>","antwort":"<ul><li><b>Unberechenbare Funktionen:<\/b> g(x) ändert fₓ(x) ab ⇒ g steht in keiner Zeile der Aufzählung.<\/li><li><b>Halteproblem:<\/b> M<sub>w<\/sub> macht auf der Diagonale das Gegenteil (hält bei 0, läuft endlos bei 1) ⇒ Widerspruch bei \\(A_{k,k}\\).<\/li><li>(Hintergrund: Cantor, ℝ bzw. 𝒫(ℕ) überabzählbar.)<\/li><li><b>Prinzip:<\/b> Man nimmt eine vollständige Aufzählung an, konstruiert ein Objekt, das sich von jedem Eintrag an der Diagonalstelle unterscheidet, und folgert, dass die Aufzählung nicht vollständig oder die Annahme falsch war.<\/li><\/ul>","details":"","punkte":["<b>Unberechenbare Funktionen:<\/b> g(x) ändert fₓ(x) ab ⇒ g steht in keiner Zeile der Aufzählung.","<b>Halteproblem:<\/b> M<sub>w<\/sub> macht auf der Diagonale das Gegenteil (hält bei 0, läuft endlos bei 1) ⇒ Widerspruch bei \\(A_{k,k}\\).","(Hintergrund: Cantor, ℝ bzw. 𝒫(ℕ) überabzählbar.)","<b>Prinzip:<\/b> Man nimmt eine vollständige Aufzählung an, konstruiert ein Objekt, das sich von jedem Eintrag an der Diagonalstelle unterscheidet, und folgert, dass die Aufzählung nicht vollständig oder die Annahme falsch war."],"nachfragen":[],"frage_raw":"Wo kommt in der Vorlesung Diagonalisierung vor, und was ist das gemeinsame Prinzip?","antwort_raw":"\n- **Unberechenbare Funktionen:** g(x) ändert fₓ(x) ab ⇒ g steht in keiner Zeile der Aufzählung.\n- **Halteproblem:** M_w macht auf der Diagonale das Gegenteil (hält bei 0, läuft endlos bei 1) ⇒ Widerspruch bei \\(A_{k,k}\\).\n- (Hintergrund: Cantor, ℝ bzw. 𝒫(ℕ) überabzählbar.)\n- **Prinzip:** Man nimmt eine vollständige Aufzählung an, konstruiert ein Objekt, das sich von jedem Eintrag an der Diagonalstelle unterscheidet, und folgert, dass die Aufzählung nicht vollständig oder die Annahme falsch war.\n"},{"id":"zs-notw-hinr","kap":10,"kapitel":"Kap. 10 · Zusammenhänge und Prüfungssimulation","klausur":true,"erg":false,"frage":"<p>Wo begegnen Ihnen in der Vorlesung notwendige und hinreichende Bedingungen?<\/p>","antwort":"<ul><li><b>Pumping-Lemma (regulär):<\/b> notwendig für Regularität ⇒ taugt nur für „nicht regulär“.<\/li><li><b>Pumping-Lemma (kontextfrei):<\/b> notwendig für Kontextfreiheit ⇒ taugt nur für „nicht kontextfrei“.<\/li><li><b>Myhill-Nerode:<\/b> notwendig <b>und<\/b> hinreichend ⇒ zeigt beide Richtungen und liefert den Minimalautomaten.<\/li><li>Positiv zeigt man Regularität bzw. Kontextfreiheit <b>konstruktiv<\/b> (Automat oder Grammatik angeben).<\/li><\/ul>","details":"","punkte":["<b>Pumping-Lemma (regulär):<\/b> notwendig für Regularität ⇒ taugt nur für „nicht regulär“.","<b>Pumping-Lemma (kontextfrei):<\/b> notwendig für Kontextfreiheit ⇒ taugt nur für „nicht kontextfrei“.","<b>Myhill-Nerode:<\/b> notwendig <b>und<\/b> hinreichend ⇒ zeigt beide Richtungen und liefert den Minimalautomaten.","Positiv zeigt man Regularität bzw. Kontextfreiheit <b>konstruktiv<\/b> (Automat oder Grammatik angeben)."],"nachfragen":[],"frage_raw":"Wo begegnen Ihnen in der Vorlesung notwendige und hinreichende Bedingungen?","antwort_raw":"\n- **Pumping-Lemma (regulär):** notwendig für Regularität ⇒ taugt nur für „nicht regulär“.\n- **Pumping-Lemma (kontextfrei):** notwendig für Kontextfreiheit ⇒ taugt nur für „nicht kontextfrei“.\n- **Myhill-Nerode:** notwendig **und** hinreichend ⇒ zeigt beide Richtungen und liefert den Minimalautomaten.\n- Positiv zeigt man Regularität bzw. Kontextfreiheit **konstruktiv** (Automat oder Grammatik angeben).\n"},{"id":"zs-reduktionen","kap":10,"kapitel":"Kap. 10 · Zusammenhänge und Prüfungssimulation","klausur":false,"erg":false,"frage":"<p>Vergleichen Sie Reduktionen in der Berechenbarkeit und in der Komplexitätstheorie.<\/p>","antwort":"<ul><li>Gemeinsam: f bildet Instanzen ab, <b>w ∈ L<sub>A<\/sub> ⇔ f(w) ∈ L<sub>B<\/sub><\/b>; „L<sub>A<\/sub> ist nicht schwerer als L<sub>B<\/sub>“.<\/li><li><b>Berechenbarkeit (≤):<\/b> f muss nur <b>berechenbar und total<\/b> sein. Überträgt <b>Entscheidbarkeit<\/b> (von rechts nach links) und <b>Unentscheidbarkeit<\/b> (von links nach rechts). Ausgangspunkt: L<sub>H<\/sub>.<\/li><li><b>Komplexität (≤_poly):<\/b> f muss in <b>Polynomialzeit<\/b> berechenbar sein. Überträgt <b>Zugehörigkeit zu P/NP<\/b> (rechts → links) und <b>Schwere<\/b> (links → rechts). Ausgangspunkt: SAT.<\/li><\/ul>","details":"","punkte":["Gemeinsam: f bildet Instanzen ab, <b>w ∈ L<sub>A<\/sub> ⇔ f(w) ∈ L<sub>B<\/sub><\/b>; „L<sub>A<\/sub> ist nicht schwerer als L<sub>B<\/sub>“.","<b>Berechenbarkeit (≤):<\/b> f muss nur <b>berechenbar und total<\/b> sein. Überträgt <b>Entscheidbarkeit<\/b> (von rechts nach links) und <b>Unentscheidbarkeit<\/b> (von links nach rechts). Ausgangspunkt: L<sub>H<\/sub>.","<b>Komplexität (≤_poly):<\/b> f muss in <b>Polynomialzeit<\/b> berechenbar sein. Überträgt <b>Zugehörigkeit zu P/NP<\/b> (rechts → links) und <b>Schwere<\/b> (links → rechts). Ausgangspunkt: SAT."],"nachfragen":[],"frage_raw":"Vergleichen Sie Reduktionen in der Berechenbarkeit und in der Komplexitätstheorie.","antwort_raw":"\n- Gemeinsam: f bildet Instanzen ab, **w ∈ L_A ⇔ f(w) ∈ L_B**; „L_A ist nicht schwerer als L_B“.\n- **Berechenbarkeit (≤):** f muss nur **berechenbar und total** sein. Überträgt **Entscheidbarkeit** (von rechts nach links) und **Unentscheidbarkeit** (von links nach rechts). Ausgangspunkt: L_H.\n- **Komplexität (≤_poly):** f muss in **Polynomialzeit** berechenbar sein. Überträgt **Zugehörigkeit zu P/NP** (rechts → links) und **Schwere** (links → rechts). Ausgangspunkt: SAT.\n"},{"id":"zs-techniken","kap":10,"kapitel":"Kap. 10 · Zusammenhänge und Prüfungssimulation","klausur":false,"erg":false,"frage":"<p>Welche Beweistechniken kommen in der Vorlesung vor? Nennen Sie je ein Beispiel.<\/p>","antwort":"<ul><li><b>Konstruktion:<\/b> Automat oder Grammatik angeben (Komplement-DFA, Rabin-Scott, NPDA für aⁿbⁿ)<\/li><li><b>Widerspruch:<\/b> Pumping-Lemma-Beweise, Halteproblem<\/li><li><b>Schubfachprinzip:<\/b> Beweis des Pumping-Lemmas<\/li><li><b>Induktion:<\/b> \\(\\hat\\delta\\) in Rabin-Scott und Myhill-Nerode, Einsetzungsmethode bei Rekurrenzen<\/li><li><b>Diagonalisierung:<\/b> unberechenbare Funktion, Halteproblem<\/li><li><b>Reduktion:<\/b> L<sub>ε<\/sub>, Rice, NP-Vollständigkeit<\/li><li><b>Abzählargumente:<\/b> überabzählbar viele Sprachen bzw. Funktionen, abzählbar viele TMs<\/li><\/ul>","details":"","punkte":["<b>Konstruktion:<\/b> Automat oder Grammatik angeben (Komplement-DFA, Rabin-Scott, NPDA für aⁿbⁿ)","<b>Widerspruch:<\/b> Pumping-Lemma-Beweise, Halteproblem","<b>Schubfachprinzip:<\/b> Beweis des Pumping-Lemmas","<b>Induktion:<\/b> \\(\\hat\\delta\\) in Rabin-Scott und Myhill-Nerode, Einsetzungsmethode bei Rekurrenzen","<b>Diagonalisierung:<\/b> unberechenbare Funktion, Halteproblem","<b>Reduktion:<\/b> L<sub>ε<\/sub>, Rice, NP-Vollständigkeit","<b>Abzählargumente:<\/b> überabzählbar viele Sprachen bzw. Funktionen, abzählbar viele TMs"],"nachfragen":[],"frage_raw":"Welche Beweistechniken kommen in der Vorlesung vor? Nennen Sie je ein Beispiel.","antwort_raw":"\n- **Konstruktion:** Automat oder Grammatik angeben (Komplement-DFA, Rabin-Scott, NPDA für aⁿbⁿ)\n- **Widerspruch:** Pumping-Lemma-Beweise, Halteproblem\n- **Schubfachprinzip:** Beweis des Pumping-Lemmas\n- **Induktion:** \\(\\hat\\delta\\) in Rabin-Scott und Myhill-Nerode, Einsetzungsmethode bei Rekurrenzen\n- **Diagonalisierung:** unberechenbare Funktion, Halteproblem\n- **Reduktion:** L_ε, Rice, NP-Vollständigkeit\n- **Abzählargumente:** überabzählbar viele Sprachen bzw. Funktionen, abzählbar viele TMs\n"},{"id":"zs-hierarchie-entscheid","kap":10,"kapitel":"Kap. 10 · Zusammenhänge und Prüfungssimulation","klausur":false,"erg":true,"frage":"<p>Ordnen Sie ein: entscheidbar, semi-entscheidbar, nicht semi-entscheidbar. Mit Beispielen.<\/p>","antwort":"<ul><li><b>Entscheidbar:<\/b> alle Typ-1-, Typ-2- und Typ-3-Sprachen, z. B. aⁿbⁿcⁿ, SAT, Hamiltonkreis<\/li><li><b>Semi-entscheidbar, aber nicht entscheidbar:<\/b> L<sub>H<\/sub>, L<sub>ε<\/sub><\/li><li><b>Nicht einmal semi-entscheidbar:<\/b> \\(\\overline{L_H}\\) (sonst wäre L<sub>H<\/sub> entscheidbar) und {c<sub>M<\/sub> | M hält auf allen Eingaben} (Ergänzung)<\/li><li>Überabzählbar viele Sprachen gegen abzählbar viele TMs ⇒ „fast alle“ Sprachen liegen in der letzten Klasse.<\/li><\/ul>","details":"","punkte":["<b>Entscheidbar:<\/b> alle Typ-1-, Typ-2- und Typ-3-Sprachen, z. B. aⁿbⁿcⁿ, SAT, Hamiltonkreis","<b>Semi-entscheidbar, aber nicht entscheidbar:<\/b> L<sub>H<\/sub>, L<sub>ε<\/sub>","<b>Nicht einmal semi-entscheidbar:<\/b> \\(\\overline{L_H}\\) (sonst wäre L<sub>H<\/sub> entscheidbar) und {c<sub>M<\/sub> | M hält auf allen Eingaben} (Ergänzung)","Überabzählbar viele Sprachen gegen abzählbar viele TMs ⇒ „fast alle“ Sprachen liegen in der letzten Klasse."],"nachfragen":[],"frage_raw":"Ordnen Sie ein: entscheidbar, semi-entscheidbar, nicht semi-entscheidbar. Mit Beispielen.","antwort_raw":"\n- **Entscheidbar:** alle Typ-1-, Typ-2- und Typ-3-Sprachen, z. B. aⁿbⁿcⁿ, SAT, Hamiltonkreis\n- **Semi-entscheidbar, aber nicht entscheidbar:** L_H, L_ε\n- **Nicht einmal semi-entscheidbar:** \\(\\overline{L_H}\\) (sonst wäre L_H entscheidbar) und {c_M | M hält auf allen Eingaben} (Ergänzung)\n- Überabzählbar viele Sprachen gegen abzählbar viele TMs ⇒ „fast alle“ Sprachen liegen in der letzten Klasse.\n"},{"id":"zs-kodierung","kap":10,"kapitel":"Kap. 10 · Zusammenhänge und Prüfungssimulation","klausur":false,"erg":false,"frage":"<p>Warum spielt Kodierung in der Vorlesung eine so große Rolle?<\/p>","antwort":"<ul><li>Damit Automaten und TMs <b>beliebige<\/b> Probleme bearbeiten können, muss alles ein <b>Wort<\/b> sein: Zahlen (unär, binär), Graphen (Adjazenzmatrix), Formeln, Programme bzw. TMs (c<sub>M<\/sub>).<\/li><li>Kodierte TMs ermöglichen die <b>UTM<\/b> (Programme als Daten) und <b>Selbstbezug<\/b>: Diagonalisierung, Halteproblem, Rice.<\/li><li>Bei Komplexität ist wichtig, dass die Kodierung <b>vernünftig<\/b> ist: Ihre Länge bestimmt n. Eine unäre Kodierung von Zahlen kann Laufzeiten künstlich polynomial aussehen lassen.<\/li><\/ul>","details":"","punkte":["Damit Automaten und TMs <b>beliebige<\/b> Probleme bearbeiten können, muss alles ein <b>Wort<\/b> sein: Zahlen (unär, binär), Graphen (Adjazenzmatrix), Formeln, Programme bzw. TMs (c<sub>M<\/sub>).","Kodierte TMs ermöglichen die <b>UTM<\/b> (Programme als Daten) und <b>Selbstbezug<\/b>: Diagonalisierung, Halteproblem, Rice.","Bei Komplexität ist wichtig, dass die Kodierung <b>vernünftig<\/b> ist: Ihre Länge bestimmt n. Eine unäre Kodierung von Zahlen kann Laufzeiten künstlich polynomial aussehen lassen."],"nachfragen":[],"frage_raw":"Warum spielt Kodierung in der Vorlesung eine so große Rolle?","antwort_raw":"\n- Damit Automaten und TMs **beliebige** Probleme bearbeiten können, muss alles ein **Wort** sein: Zahlen (unär, binär), Graphen (Adjazenzmatrix), Formeln, Programme bzw. TMs (c_M).\n- Kodierte TMs ermöglichen die **UTM** (Programme als Daten) und **Selbstbezug**: Diagonalisierung, Halteproblem, Rice.\n- Bei Komplexität ist wichtig, dass die Kodierung **vernünftig** ist: Ihre Länge bestimmt n. Eine unäre Kodierung von Zahlen kann Laufzeiten künstlich polynomial aussehen lassen.\n"},{"id":"zs-laie","kap":10,"kapitel":"Kap. 10 · Zusammenhänge und Prüfungssimulation","klausur":false,"erg":false,"frage":"<p>Erklären Sie einem Laien, warum es Probleme gibt, die kein Computer lösen kann.<\/p>","antwort":"<ul><li>Jedes Programm ist ein endlicher Text, also gibt es „nur“ so viele Programme, wie es natürliche Zahlen gibt.<\/li><li>Es gibt aber viel mehr Ja/Nein-Fragen über Zahlen bzw. Texte (überabzählbar viele). Für die meisten gibt es also gar kein Programm.<\/li><li>Konkretes Beispiel: Ein Programm, das für jedes Programm vorhersagt, ob es anhält, kann es nicht geben. Sonst könnte man ein „Trotz-Programm“ bauen, das die Vorhersage über sich selbst immer widerlegt.<\/li><\/ul>","details":"","punkte":["Jedes Programm ist ein endlicher Text, also gibt es „nur“ so viele Programme, wie es natürliche Zahlen gibt.","Es gibt aber viel mehr Ja/Nein-Fragen über Zahlen bzw. Texte (überabzählbar viele). Für die meisten gibt es also gar kein Programm.","Konkretes Beispiel: Ein Programm, das für jedes Programm vorhersagt, ob es anhält, kann es nicht geben. Sonst könnte man ein „Trotz-Programm“ bauen, das die Vorhersage über sich selbst immer widerlegt."],"nachfragen":[],"frage_raw":"Erklären Sie einem Laien, warum es Probleme gibt, die kein Computer lösen kann.","antwort_raw":"\n- Jedes Programm ist ein endlicher Text, also gibt es „nur“ so viele Programme, wie es natürliche Zahlen gibt.\n- Es gibt aber viel mehr Ja/Nein-Fragen über Zahlen bzw. Texte (überabzählbar viele). Für die meisten gibt es also gar kein Programm.\n- Konkretes Beispiel: Ein Programm, das für jedes Programm vorhersagt, ob es anhält, kann es nicht geben. Sonst könnte man ein „Trotz-Programm“ bauen, das die Vorhersage über sich selbst immer widerlegt.\n"}]; window.BUK_SHARE = {"url": "https://asamedia.github.io/buk-trainer/", "qr": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 33 33\" class=\"segno\"><title>QR-Code BuK-Trainer<\/title><path class=\"qrline\" stroke=\"#000\" d=\"M2 2.5h7m2 0h4m1 0h2m2 0h2m2 0h7m-29 1h1m5 0h1m2 0h1m2 0h1m1 0h3m3 0h1m1 0h1m5 0h1m-29 1h1m1 0h3m1 0h1m2 0h4m1 0h2m1 0h2m1 0h1m1 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m3 0h1m3 0h1m4 0h2m1 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m3 0h1m2 0h1m1 0h4m3 0h1m1 0h3m1 0h1m-29 1h1m5 0h1m1 0h3m1 0h1m1 0h7m1 0h1m5 0h1m-29 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-19 1h2m3 0h3m-18 1h1m2 0h1m1 0h2m1 0h1m1 0h1m1 0h2m1 0h2m2 0h1m1 0h1m1 0h1m-23 1h1m1 0h3m2 0h5m3 0h1m3 0h3m2 0h1m2 0h1m-27 1h1m1 0h4m1 0h1m1 0h2m3 0h1m1 0h4m1 0h5m-28 1h1m6 0h1m2 0h1m1 0h2m1 0h1m2 0h2m3 0h2m1 0h2m-28 1h2m1 0h4m2 0h1m1 0h1m2 0h1m1 0h2m3 0h2m2 0h1m1 0h2m-28 1h1m2 0h1m2 0h2m1 0h1m1 0h1m6 0h3m-18 1h1m1 0h1m5 0h1m3 0h1m3 0h3m1 0h5m-29 1h1m2 0h1m3 0h1m1 0h1m3 0h1m3 0h3m1 0h1m1 0h1m1 0h1m1 0h1m-28 1h3m1 0h3m4 0h4m1 0h3m1 0h2m5 0h1m-24 1h1m2 0h1m2 0h2m2 0h1m1 0h2m3 0h3m1 0h1m2 0h1m-29 1h1m1 0h1m3 0h6m1 0h1m2 0h2m5 0h1m3 0h2m-27 1h2m6 0h1m2 0h1m1 0h1m1 0h4m1 0h2m3 0h2m-29 1h1m5 0h1m1 0h2m2 0h1m1 0h1m5 0h5m1 0h1m-19 1h1m1 0h2m1 0h1m2 0h2m1 0h2m3 0h1m1 0h3m-29 1h7m3 0h5m1 0h3m1 0h1m1 0h1m1 0h1m2 0h1m-28 1h1m5 0h1m1 0h1m2 0h3m1 0h2m3 0h1m3 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m2 0h4m1 0h4m2 0h5m2 0h2m-29 1h1m1 0h <script>
"use strict";
/* Grundgerüst: Helfer, Fortschritt (db pro Person, sonst Gerätespeicher), App-Rahmen und Navigation. */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

const SUBS = { 0: "₀", 1: "₁", 2: "₂", 3: "₃", 4: "₄", 5: "₅", 6: "₆", 7: "₇", 8: "₈", 9: "₉" };
function pretty(name) {
  return String(name).replace(/([A-Za-z])(\d+)/g, (_, a, d) => a + d.replace(/\d/g, (x) => SUBS[x]));
}
const W = (w) => (w === "" ? "ε" : w);
function rle(w) {           // aaabb -> a³b² (kompakte Anzeige langer Wörter)
  if (w === "") return "ε";
  const sup = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
  let out = "", i = 0;
  while (i < w.length) {
    let j = i;
    while (j < w.length && w[j] === w[i]) j++;
    const n = j - i;
    out += w[i] + (n > 1 ? String(n).replace(/\d/g, (x) => sup[x]) : "");
    i = j;
  }
  return out;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function typeset(el) {
  if (!(window.MathJax && MathJax.typesetPromise)) { window.__mjPending = (window.__mjPending || []).concat([el]); return; }
  // MathJax misst die Schriftgröße am Element – noch nicht eingehängt ergäbe das NaN-Maße
  if (!el.isConnected) { setTimeout(() => { if (el.isConnected) typeset(el); }, 0); return; }
  MathJax.typesetPromise([el]).catch(() => {});
}
function fb(kind, title, ...body) {
  return h("div", { class: "fb " + kind, role: "status" }, h("b", { class: "t" }, title), ...body);
}
// In der claude.ai-Ansicht gibt es Claude als Prüfer und den Kontospeicher; auf der Webseite nur Selbstcheck und Gerätespeicher
const VIA_CLAUDE = !!(window.claude && window.claude.use);
const ISSUES = "https://github.com/ASAMedia/buk-trainer/issues";

/* Rückgängig für Entwürfe: merkt sich frühere Stände und setzt das Objekt an Ort und Stelle zurück (Entwürfe behalten ihre Referenz). */
const histories = new WeakMap();
function undoable(model) {
  if (histories.has(model)) return histories.get(model);
  let last = JSON.stringify(model);
  const past = [];
  const hist = {
    note() { const cur = JSON.stringify(model); if (cur !== last) { past.push(last); if (past.length > 80) past.shift(); last = cur; } },
    undo() {
      if (!past.length) return false;
      last = past.pop();
      const s = JSON.parse(last);
      for (const k of Object.keys(model)) delete model[k];
      Object.assign(model, s);
      return true;
    },
    get can() { return past.length > 0; },
  };
  histories.set(model, hist);
  return hist;
}

/* Tage als "JJJJ-MM-TT" (lokale Zeit) */
function today(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDays(day, n) { const d = new Date(day + "T12:00:00"); d.setDate(d.getDate() + n); return today(d); }
function daysBetween(a, b) { return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5); }
const IVL = [0, 1, 3, 7, 14, 30];             // Tage bis zur nächsten Wiederholung je Stufe (verteiltes Wiederholen)
const EMPTY = () => ({ v: 1, tasks: {}, oral: {}, sims: [], days: {}, prefs: {} });

/* ------------------------------------------------------------------ Fortschritt */
const Progress = {
  data: EMPTY(),
  where: "Gerät",
  ref: null,
  writing: false,
  dirty: false,
  load() {
    try {
      const s = localStorage.getItem("buk-trainer");
      if (s) this.data = Object.assign(EMPTY(), JSON.parse(s));
    } catch (e) { /* Speicher gesperrt: ohne weiter */ }
  },
  async connect() {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const id = user ? await user.id() : null;
      if (!db || !id) return;
      this.ref = db.doc("data/users/" + id + "/progress");
      const snap = await this.ref.get();
      if (snap.exists) this.data = this.merge(this.data, snap.data());
      this.where = "Konto";
      App.updateSaveLabel();
      App.refresh();
      this.save();
    } catch (e) { this.ref = null; }
  },
  merge(a, b) {
    const out = EMPTY();
    a = a || {}; b = b || {};
    for (const k of ["tasks", "oral"]) {
      const x = a[k] || {}, y = b[k] || {};
      for (const id of new Set([...Object.keys(x), ...Object.keys(y)])) {
        const p = x[id], q = y[id];
        out[k][id] = !p ? q : !q ? p : ((q.t || 0) >= (p.t || 0) ? Object.assign({}, p, q, { done: p.done || q.done, best: Math.max(p.best || 0, q.best || 0) }) : Object.assign({}, q, p, { done: p.done || q.done, best: Math.max(p.best || 0, q.best || 0) }));
      }
    }
    const sims = new Map();
    for (const s of [...(a.sims || []), ...(b.sims || [])]) sims.set(s.t, s);
    out.sims = [...sims.values()].sort((x, y) => x.t - y.t).slice(-40);
    out.days = Object.assign({}, a.days, b.days);
    out.prefs = ((b.prefs || {}).t || 0) >= ((a.prefs || {}).t || 0) ? Object.assign({}, b.prefs) : Object.assign({}, a.prefs);
    return out;
  },
  task(key) { return this.data.tasks[key] || {}; },
  done(key) { return !!(this.data.tasks[key] && this.data.tasks[key].done); },
  record(key, ok) {
    const t = Object.assign({ tries: 0 }, this.data.tasks[key]), d = today();
    t.tries += 1; t.t = Date.now();
    if (ok) {
      // Stufe steigt höchstens einmal am Tag; wer heute erst danebenlag, fängt wieder bei Stufe 1 an
      if (t.okDay !== d) { t.box = t.failDay === d ? 1 : Math.min((t.box || 0) + 1, IVL.length - 1); t.due = addDays(d, IVL[t.box]); }
      t.done = true; t.okDay = d;
    } else {
      t.fails = (t.fails || 0) + 1; t.failDay = d;
      if (t.done && t.okDay !== d) { t.box = 0; t.due = d; }
    }
    this.data.tasks[key] = t;
    this.save();
  },
  oral(qid) { return this.data.oral[qid] || {}; },
  recordOral(qid, score) {
    const o = Object.assign({ n: 0, best: 0 }, this.data.oral[qid]), d = today();
    o.n += 1; o.last = score; o.best = Math.max(o.best, score); o.t = Date.now();
    if (score >= 70) { if (o.day !== d || !o.box) { o.box = Math.min((o.box || 0) + 1, IVL.length - 1); o.due = addDays(d, IVL[o.box]); } }
    else { o.box = 0; o.due = addDays(d, 1); }
    o.day = d;
    this.data.oral[qid] = o;
    this.save();
  },
  pref(k, v) {
    if (v === undefined) return this.data.prefs[k];
    this.data.prefs = Object.assign({}, this.data.prefs, { [k]: v, t: Date.now() });
    this.save();
  },
  save() {
    try { localStorage.setItem("buk-trainer", JSON.stringify(this.data)); } catch (e) { /* egal */ }
    if (!this.ref) return;
    if (this.writing) { this.dirty = true; return; }
    this.writing = true;
    this.ref.set(JSON.parse(JSON.stringify(this.data)))
      .catch(() => { /* bleibt im Gerätespeicher */ })
      .finally(() => { this.writing = false; if (this.dirty) { this.dirty = false; this.save(); } });
  },
};

/* ------------------------------------------------------------------ App */
const App = {
  mods: [],
  stack: [],
  register(m) { this.mods.push(m); },
  mod(id) { return this.mods.find((m) => m.id === id); },
  start() {
    Progress.load();
    document.body.append(
      h("div", { class: "bar" }, h("div", { class: "wrap" },
        h("button", { class: "back", id: "back", type: "button", onclick: () => this.back(), hidden: true }, "‹ Zurück"),
        h("div", { class: "title", id: "title" }, "BuK-Trainer"),
        h("button", { class: "save", id: "save", type: "button", title: "Fortschritt übertragen", onclick: transferSheet }))),
      h("main", { class: "wrap", id: "view" }));
    this.updateSaveLabel();
    const want = (location.hash || "").slice(1);
    if (want && this.mod(want)) this.show({ view: "mod", mod: want }, true); else this.show({ view: "home" }, true);
    Progress.connect();
  },
  updateSaveLabel() { const s = $("#save"); if (s) s.textContent = "Fortschritt: " + Progress.where; },
  show(state, reset) {
    if (reset) this.stack = [];
    this.stack.push(state);
    this.render();
  },
  back() { if (this.stack.length > 1) { this.stack.pop(); this.render(); } },
  refresh() { if (this.stack.length && this.stack[this.stack.length - 1].view === "home") this.render(); },
  render() {
    const st = this.stack[this.stack.length - 1];
    const view = $("#view");
    view.replaceChildren();
    $("#back").hidden = st.view === "home";
    window.scrollTo(0, 0);
    if (st.view === "home") { $("#title").textContent = "BuK-Trainer"; Home.render(view); return; }
    const m = this.mod(st.mod);
    $("#title").textContent = m.title;
    if (st.view === "mod") (m.renderModule || renderTaskList)(view, m, st);
    else m.renderTask(view, m.tasks.find((t) => t.id === st.task));
    typeset(view);
  },
};

function tapeCells(done, total) {
  const label = done + " von " + total + " erledigt";
  if (total > 24) { done = Math.round((done * 24) / total); total = 24; }
  return h("div", { class: "tape", "aria-label": label },
    Array.from({ length: total }, (_, i) => h("i", { class: i < done ? "on" : "" })));
}
function modProgress(m) {
  if (m.progress) return m.progress();
  const total = m.tasks.length, done = m.tasks.filter((t) => Progress.done(m.id + ":" + t.id)).length;
  return [done, total];
}

function renderTaskList(view, m) {
  view.append(h("div", { class: "hero" }, h("div", { class: "eyebrow" }, m.chapter), h("h1", null, m.title), h("p", { class: "muted" }, m.intro)));
  const list = h("div", { class: "stack" });
  m.tasks.forEach((t, i) => {
    const key = m.id + ":" + t.id, p = Progress.task(key);
    list.append(h("button", { class: "mod", type: "button", onclick: () => App.show({ view: "task", mod: m.id, task: t.id }) },
      h("b", null, (i + 1) + ". " + t.title),
      h("span", null, p.done ? "gelöst ✓" : p.tries ? "angefangen (" + p.tries + " Versuche)" : (t.hint || "offen"))));
  });
  view.append(list);
}

/* Auswahl einer Teilmenge (unten eingeblendet) */
function pickSubset(items, current, title, labelOf = pretty, note = "Nichts gewählt = ∅") {
  return new Promise((resolve) => {
    const sel = new Set(current || []);
    const chips = items.map((it) => {
      const c = h("button", { class: "chip" + (sel.has(it) ? " on" : ""), type: "button", "aria-pressed": sel.has(it) ? "true" : "false" }, labelOf(it));
      c.addEventListener("click", () => {
        if (sel.has(it)) sel.delete(it); else sel.add(it);
        c.classList.toggle("on", sel.has(it)); c.setAttribute("aria-pressed", sel.has(it) ? "true" : "false");
      });
      return c;
    });
    const close = (v) => { sheet.remove(); resolve(v); };
    const sheet = h("div", { class: "sheet", role: "dialog", "aria-label": title }, h("div", { class: "wrap" },
      h("b", null, title), h("div", { class: "row" }, chips),
      h("div", { class: "row" },
        h("button", { class: "btn primary", type: "button", onclick: () => close(items.filter((x) => sel.has(x))) }, "Übernehmen"),
        h("button", { class: "btn", type: "button", onclick: () => close(null) }, "Abbrechen"),
        h("span", { class: "small muted" }, note))));
    document.body.append(sheet);
  });
}

/* Fortschritt als Code übertragen (Gerät ↔ Gerät, Webseite ↔ claude.ai). BUK1 = deflate + Base64, BUK0 = nur Base64. */
async function packProgress(data) {
  let bytes = new TextEncoder().encode(JSON.stringify(data)), tag = "BUK0";
  if (window.CompressionStream) {
    try { bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()); tag = "BUK1"; } catch (e) { /* unkomprimiert */ }
  }
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return tag + ":" + btoa(bin);
}
async function unpackProgress(code) {
  const m = String(code).replace(/\s+/g, "").match(/^BUK([01]):([A-Za-z0-9+/=]+)$/);
  if (!m) throw new Error("form");
  let bytes = Uint8Array.from(atob(m[2]), (c) => c.charCodeAt(0));
  if (m[1] === "1") bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  const d = JSON.parse(new TextDecoder().decode(bytes));
  if (!d || typeof d.tasks !== "object" || typeof d.oral !== "object") throw new Error("inhalt");
  return d;
}
async function copyText(text, ta) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* weiter mit Markieren */ }
  if (ta) { ta.focus(); ta.select(); try { return document.execCommand("copy"); } catch (e) { return false; } }
  return false;
}

"use strict";
/* Engines (DFA, NFA, NPDA, TM) und Zustandsdiagramme als SVG. */

/* ------------------------------------------------------------------ DFA */
function dStep(d, q, c) {
  if (q == null) return null;
  const r = d.delta[q];
  const t = r ? r[c] : null;
  return t == null || t === "" ? null : t;
}
const dAcc = (d, q) => q != null && d.finals.includes(q);

function dfaRun(d, w) {
  let q = d.start;
  const path = [q];
  for (const c of w) {
    const n = dStep(d, q, c);
    if (n == null) return { ok: false, path, missing: { q, c } };
    q = n; path.push(q);
  }
  return { ok: dAcc(d, q), path, end: q };
}

/** kürzestes Wort, auf dem sich (a ab pa) und (b ab pb) unterscheiden; null = äquivalent */
function dfaDiff(a, b, sigma, pa = a.start, pb = b.start) {
  const seen = new Set([pa + "|" + pb]);
  const queue = [[pa, pb, ""]];
  while (queue.length) {
    const [p, q, w] = queue.shift();
    if (dAcc(a, p) !== dAcc(b, q)) return { word: w, a: dAcc(a, p), b: dAcc(b, q) };
    for (const c of sigma) {
      const np = dStep(a, p, c), nq = dStep(b, q, c), k = np + "|" + nq;
      if (!seen.has(k)) { seen.add(k); queue.push([np, nq, w + c]); }
    }
  }
  return null;
}

function reachable(d, sigma) {
  const seen = new Set([d.start]), queue = [d.start];
  while (queue.length) {
    const q = queue.shift();
    for (const c of sigma) { const n = dStep(d, q, c); if (n != null && !seen.has(n)) { seen.add(n); queue.push(n); } }
  }
  return d.states.filter((q) => seen.has(q));
}

/** DFA mit totalem δ: fehlende Übergänge gehen in einen Müllzustand § */
function completeDFA(d, sigma) {
  if (!d.states.some((q) => sigma.some((c) => dStep(d, q, c) == null))) return d;
  const delta = {};
  for (const q of d.states) { delta[q] = {}; for (const c of sigma) delta[q][c] = dStep(d, q, c) ?? "§"; }
  delta["§"] = Object.fromEntries(sigma.map((c) => [c, "§"]));
  return Object.assign({}, d, { states: [...d.states, "§"], delta });
}

/** Äquivalenzklassen der erreichbaren Zustände; count = Zustände des minimalen (totalen) DFA */
function dfaMinimize(d, sigma) {
  const cd = completeDFA(d, sigma);
  const reach = reachable(cd, sigma);
  const classes = [];
  for (const q of reach) {
    const c = classes.find((cl) => !dfaDiff(cd, cd, sigma, cl[0], q));
    if (c) c.push(q); else classes.push([q]);
  }
  return { reach: reach.filter((q) => q !== "§"), classes, count: classes.length, dfa: cd };
}

/* ------------------------------------------------------------------ NFA */
function closure(n, set) {
  const out = [...set];
  for (let i = 0; i < out.length; i++) for (const z of ((n.delta[out[i]] || {})["ε"] || [])) if (!out.includes(z)) out.push(z);
  return n.states.filter((z) => out.includes(z));
}
function nMove(n, set, c) {
  const out = new Set();
  for (const z of set) for (const z2 of ((n.delta[z] || {})[c] || [])) out.add(z2);
  return closure(n, [...out]);
}
const setKey = (s) => "{" + s.join(",") + "}";
function powerset(n) {
  const start = closure(n, [n.start]);
  const rows = [], seen = new Map();
  const add = (s) => { const k = setKey(s); if (!seen.has(k)) { seen.set(k, rows.length); rows.push({ set: s }); } return k; };
  add(start);
  for (let i = 0; i < rows.length; i++) {
    rows[i].trans = {};
    for (const c of n.sigma) { const t = nMove(n, rows[i].set, c); rows[i].trans[c] = t; add(t); }
    rows[i].final = rows[i].set.some((z) => n.finals.includes(z));
  }
  return { start, rows };
}

/* ------------------------------------------------------------------ NPDA (Akzeptanz durch leeren Keller) */
function pdaAccepts(p, w, maxCfg = 20000) {
  const start = { z: p.start, i: 0, k: p.bottom };
  const seen = new Set(), queue = [start];
  const key = (c) => c.z + "|" + c.i + "|" + c.k;
  seen.add(key(start));
  let n = 0;
  while (queue.length && n++ < maxCfg) {
    const c = queue.shift();
    if (c.i === w.length && c.k === "") return true;
    if (c.k === "") continue;
    const top = c.k[0], rest = c.k.slice(1);
    for (const t of p.trans) {
      if (t.from !== c.z || t.top !== top) continue;
      if (t.read !== "" && (c.i >= w.length || w[c.i] !== t.read)) continue;
      const nc = { z: t.to, i: c.i + (t.read === "" ? 0 : 1), k: t.push + rest };
      if (nc.k.length > 2 * w.length + 6) continue;
      const kk = key(nc);
      if (!seen.has(kk)) { seen.add(kk); queue.push(nc); }
    }
  }
  return false;
}

/* ------------------------------------------------------------------ TM */
function tmRun(t, w, limit = 10000) {
  const tape = new Map();
  [...w].forEach((c, i) => tape.set(i, c));
  let h = 0, z = t.start, steps = 0;
  const sym = (i) => (tape.has(i) ? tape.get(i) : t.blank);
  while (steps < limit) {
    if (t.finals.includes(z)) return { halt: true, acc: true, tape, h, steps, z };
    if (z === t.reject) return { halt: true, acc: false, tape, h, steps, z };
    const r = (t.delta[z] || {})[sym(h)];
    if (!r) return { halt: true, acc: false, missing: { z, a: sym(h) }, tape, h, steps, z };
    tape.set(h, r[1]); z = r[0];
    h += r[2] === "R" ? 1 : r[2] === "L" ? -1 : 0;
    steps++;
  }
  return { halt: false, acc: false, tape, h, steps, z };
}
function tapeString(tape, blank) {
  const ks = [...tape.keys()].filter((k) => tape.get(k) !== blank);
  if (!ks.length) return "";
  let s = "";
  for (let i = Math.min(...ks); i <= Math.max(...ks); i++) s += tape.has(i) ? tape.get(i) : blank;
  return s;
}

/* ------------------------------------------------------------------ Diagramme */
const SVGNS = "http://www.w3.org/2000/svg";
let diagCount = 0;
function svgEl(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}

/**
 * Platz jedes Zustands auf dem Kreis (0 = links, Startzustand). Bis 8 Zustände werden alle Reihenfolgen
 * probiert: möglichst keine sich kreuzenden Kanten, kurze Sehnen, sonst die gewohnte Reihenfolge.
 */
function circleOrder(st, edges, start) {
  const n = st.length, si = Math.max(0, st.findIndex((s) => s.id === start));
  const nat = st.map((_, i) => (i - si + n) % n);
  const idx = Object.fromEntries(st.map((s, i) => [s.id, i]));
  const E = [...new Set(edges.filter((e) => e.from !== e.to && e.from in idx && e.to in idx)
    .map((e) => [idx[e.from], idx[e.to]].sort((a, b) => a - b).join(",")))].map((k) => k.split(",").map(Number));
  if (n > 8 || E.length < 2) return nat;
  const cost = (slot) => {
    let c = 0;
    for (let i = 0; i < E.length; i++) {
      const a = slot[E[i][0]], b = slot[E[i][1]], lo = Math.min(a, b), hi = Math.max(a, b);
      c += 3 * (Math.min(hi - lo, n - hi + lo) - 1);
      for (let j = i + 1; j < E.length; j++) {
        const x = slot[E[j][0]], y = slot[E[j][1]];
        if (x === a || x === b || y === a || y === b) continue;
        if ((x > lo && x < hi) !== (y > lo && y < hi)) c += 100;
      }
    }
    for (let i = 0; i < n; i++) { const d = Math.abs(slot[i] - nat[i]); c += Math.min(d, n - d); }
    return c;
  };
  const rest = st.map((_, i) => i).filter((i) => i !== si), slot = new Array(n);
  let best = nat, bs = cost(nat);
  const perm = (k) => {                       // Heap-Algorithmus über alle Plätze außer dem des Startzustands
    if (k <= 1) {
      slot[si] = 0; rest.forEach((q, j) => { slot[q] = j + 1; });
      const c = cost(slot);
      if (c < bs) { bs = c; best = slot.slice(); }
      return;
    }
    for (let i = 0; i < k; i++) {
      perm(k - 1);
      const j = k % 2 ? 0 : i;
      [rest[j], rest[k - 1]] = [rest[k - 1], rest[j]];
    }
  };
  perm(rest.length);
  return best;
}

/**
 * spec: {states:[{id, label?, final?, rej?}], start, edges:[{from, to, lines:[...]}],
 *        pos?:{id:[x,y]}, loop?:{id:"up|down|left|right"}, bend?:{"a|b":px}}
 * → {svg, mark(states, edges)}
 */
function drawAutomaton(spec) {
  const uid = "d" + (++diagCount);
  const st = spec.states;
  const byId = Object.fromEntries(st.map((s) => [s.id, s]));
  const pos = Object.assign({}, spec.pos || {});
  const auto = st.some((s) => !pos[s.id]);
  if (auto) {                                 // automatisches Layout: ab 3 Zuständen im Kreis, Start links
    const n = st.length;
    if (n <= 2) st.forEach((s, i) => { pos[s.id] = [70 + i * 170, 90]; });
    else {
      // hochkant, weil das Handy schmal ist: in der Breite enger, in der Höhe weiter

const dfaDrafts = {};

function DfaEditor(sigma, init) {
  const m = init || { states: ["z0", "z1"], start: "z0", finals: [], delta: { z0: {}, z1: {} } };
  const root = h("div", { class: "stack" });
  let onChange = () => {};
  let diag = null, selQ = null;
  const hist = undoable(m);
  const tap = (q) => {
    if (!selQ) { selQ = q; draw(); return; }
    const from = selQ;
    selQ = null; draw();
    const cur = sigma.filter((c) => (m.delta[from] || {})[c] === q);
    pickSubset(sigma, cur, "δ(" + pretty(from) + ", ·) = " + pretty(q) + " – für welche Zeichen?", (c) => c, "Nichts gewählt = Übergang entfernen. Andere Ziele dieser Zeichen werden ersetzt.").then((res) => {
      if (!res) return;
      const row = m.delta[from] = m.delta[from] || {};
      for (const c of sigma) { if (res.includes(c)) row[c] = q; else if (row[c] === q) row[c] = ""; }
      update();
    });
  };
  const draw = () => {
    hist.note();
    root.replaceChildren();
    const tbl = h("table", { class: "ed" },
      h("tr", null, h("th", null, "Zustand"), h("th", null, "Start"), h("th", null, "End"), sigma.map((c) => h("th", null, "δ(·, " + c + ")")), h("th", null, "")));
    for (const q of m.states) {
      const row = h("tr", null,
        h("th", null, pretty(q)),
        h("td", null, h("input", { type: "radio", name: "start", checked: m.start === q, "aria-label": "Start " + q, onchange: () => { m.start = q; update(); } })),
        h("td", null, h("input", { type: "checkbox", checked: m.finals.includes(q), "aria-label": "Endzustand " + q, onchange: (e) => { m.finals = e.target.checked ? [...m.finals, q] : m.finals.filter((x) => x !== q); update(); } })),
        sigma.map((c) => {
          const sel = h("select", { "aria-label": "δ(" + q + ", " + c + ")", onchange: (e) => { (m.delta[q] = m.delta[q] || {})[c] = e.target.value; update(); } },
            h("option", { value: "" }, "–"), m.states.map((t) => h("option", { value: t }, pretty(t))));
          sel.value = (m.delta[q] || {})[c] || "";
          return h("td", null, sel);
        }),
        h("td", null, m.states.length > 1 ? h("button", { class: "btn ghost", type: "button", "aria-label": "Zustand " + q + " löschen", onclick: () => remove(q) }, "×") : ""));
      tbl.append(row);
    }
    root.append(h("div", { class: "scroll" }, tbl),
      h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: add }, "+ Zustand"),
        h("span", { class: "small muted" }, "Pro Zustand und Zeichen genau ein Übergang (δ total).")));
    diag = drawAutomaton(dfaSpec(model()));
    root.append(zoomBox(editableDiagram(diag, selQ, tap), m, undoButton(hist, () => { selQ = null; draw(); onChange(); })), tapBar(selQ, pretty(selQ || ""), selQ ? [
      h("button", { class: "btn", type: "button", onclick: () => { const q = selQ; m.finals = m.finals.includes(q) ? m.finals.filter((x) => x !== q) : [...m.finals, q]; selQ = null; update(); } }, m.finals.includes(selQ) ? "Kein Endzustand" : "Endzustand"),
      m.start !== selQ ? h("button", { class: "btn", type: "button", onclick: () => { m.start = selQ; selQ = null; update(); } }, "Startzustand") : null,
    ] : null, () => { selQ = null; draw(); }));
  };
  const update = () => { draw(); onChange(); };
  const add = () => {
    let i = 0;
    while (m.states.includes("z" + i)) i++;
    m.states.push("z" + i); m.delta["z" + i] = {};
    update();
  };
  const remove = (q) => {
    m.states = m.states.filter((x) => x !== q);
    m.finals = m.finals.filter((x) => x !== q);
    delete m.delta[q];
    for (const r of Object.values(m.delta)) for (const c of Object.keys(r)) if (r[c] === q) r[c] = "";
    if (m.start === q) m.start = m.states[0];
    update();
  };
  const model = () => ({ states: [...m.states], start: m.start, finals: [...m.finals], delta: JSON.parse(JSON.stringify(m.delta)), sigma });
  draw();
  return { el: root, model, raw: m, onChange: (f) => { onChange = f; }, mark: (s, e) => diag && diag.mark(s, e) };
}

function runPanel(getModel, sigma, mark) {
  const inp = h("input", { type: "text", class: "word", placeholder: "Wort testen (leer = ε)", autocapitalize: "off", autocomplete: "off", spellcheck: "false" });
  const out = h("div", { class: "small" });
  const go = () => {
    const w = inp.value.replace(/\s+/g, "");
    const bad = [...w].filter((c) => !sigma.includes(c));
    if (bad.length) { out.textContent = "Nur Zeichen aus Σ = {" + sigma.join(", ") + "} erlaubt."; return; }
    const d = getModel(), r = dfaRun(d, w);
    const edges = r.path.slice(1).map((q, i) => [r.path[i], q]);
    mark(r.path.length ? [r.path[r.path.length - 1]] : [], edges);
    out.textContent = r.path.map(pretty).join(" → ") + (r.missing ? "  ·  δ(" + pretty(r.missing.q) + ", " + r.missing.c + ") fehlt ⇒ abgelehnt" : r.ok ? "  ·  Endzustand ⇒ akzeptiert" : "  ·  kein Endzustand ⇒ abgelehnt");
  };
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } });
  return { el: h("div", { class: "stack" }, h("div", { class: "row" }, inp, h("button", { class: "btn", type: "button", onclick: go }, "Testen")), out), test: (w) => { inp.value = w; go(); } };
}

App.register({
  id: "dfa", title: "DFA bauen", chapter: "Kap. 3", desc: "Automaten konstruieren, exakte Prüfung mit Gegenbeispiel",
  intro: "Baue den Automaten in der Tabelle. „Prüfen“ vergleicht ihn exakt mit der gesuchten Sprache und zeigt dir das kürzeste Wort, bei dem er sich irrt.",
  tasks: DFA_TASKS,
  renderTask(view, t) {
    taskHead(view, this, t, t.text);
    const ed = DfaEditor(t.sigma, dfaDrafts[t.id]);
    dfaDrafts[t.id] = ed.raw;
    const run = runPanel(ed.model, t.sigma, ed.mark);
    const out = h("div", { class: "stack" });
    const check = () => {
      out.replaceChildren();
      const d = ed.model();
      if (!d.start) { out.append(fb("bad", "Kein Startzustand", "Markiere einen Zustand als Start.")); return; }
      const missing = [];
      for (const q of reachable(d, t.sigma)) for (const c of t.sigma) if (dStep(d, q, c) == null) missing.push("δ(" + pretty(q) + ", " + c + ")");
      const diff = dfaDiff(d, t.ref, t.sigma);
      const key = "dfa:" + t.id;
      if (diff) {
        Progress.record(key, false);
        const wq = "„" + W(diff.word) + "“";
        out.append(fb("bad", "Noch nicht richtig", h("p", null, "Gegenbeispiel: ", h("b", { class: "mono" }, wq), ". Dein Automat ",
          diff.a ? "akzeptiert" : "lehnt", " es", diff.a ? "" : " ab", ", es gehört aber ", diff.b ? "zu L." : "nicht zu L."),
          h("button", { class: "btn", type: "button", onclick: () => run.test(diff.word) }, "Lauf für " + wq + " anzeigen")));
        return;
      }
      if (missing.length) {
        Progress.record(key, false);
        out.append(fb("info", "Die Sprache stimmt – aber δ ist nicht total", h("p", null, "Es fehlen: " + missing.join(", ") + ". In der VL ist δ: Z × Σ → Z total; ergänze einen Müllzustand.")));
        return;
      }
      Progress.record(key, true);
      const own = reachable(d, t.sigma).length, min = dfaMinimize(t.ref, t.sigma).count;
      out.append(fb("ok", "Richtig! Dein DFA akzeptiert genau L.",
        h("p", null, own > min ? `Er hat ${own} erreichbare Zustände, minimal sind ${min}. Findest du äquivalente Zustände?` : `Mit ${own} Zuständen ist er sogar minimal.`)));
    };
    const sol = h("div");
    const showSol = () => {
      sol.replaceChildren(h("div", { class: "card task" }, h("b", null, "Musterlösung"),
        diagramView(drawAutomaton(dfaSpec(t.ref)).svg), h("p", null, t.explain)));
    };
    view.append(h("div", { class: "card task" }, ed.el), h("div", { class: "card task" }, h("b", null, "Ausprobieren"), run.el),
      h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: check }, "Prüfen"),
        h("button", { class: "btn ghost", type: "button", onclick: showSol }, "Lösung zeigen")), out, sol);
  },
});

function N(states, start, finals, delta, sigma, extra) { return Object.assign({ states, start, finals, delta, sigma }, extra || {}); }

const NFA_TASKS = [
